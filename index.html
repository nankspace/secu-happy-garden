<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>セキュのハッピーガーデン</title>
<style>
:root{--bg:#FAF9F5;--card:#FFFFFF;--soft:#F4F3EE;--text:#1F1E1D;--sub:#5F5E5A;--muted:#8A8983;--line:rgba(0,0,0,.12);--accent:#185FA5;--accent-bg:#E6F1FB;--warn:#854F0B;--warn-bg:#FAEEDA;--danger:#A32D2D;--danger-bg:#FCEBEB;--mono:ui-monospace,"Cascadia Mono",Consolas,"Menlo",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1A1A19;--card:#242422;--soft:#2C2C2A;--text:#ECEBE6;--sub:#B4B2A9;--muted:#888780;--line:rgba(255,255,255,.14);--accent:#85B7EB;--accent-bg:#0C447C;--warn:#FAC775;--warn-bg:#412402;--danger:#F09595;--danger-bg:#501313}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
.wrap{max-width:1360px;margin:0 auto;padding:16px}
.brand{font-size:18px;font-weight:500;margin:0 0 6px}
.brand small{font-size:12px;color:var(--sub);font-weight:400;margin-left:8px}
.layout{display:grid;gap:16px}
.right{order:-1}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1.25fr) minmax(380px,.75fr)}.right{order:0;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
button:hover{border-color:var(--sub)}
button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.lbl{font-size:13px;color:var(--sub);margin-right:4px}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:14px;margin:8px 0 0}
.ms dt{color:var(--sub);font-size:12px;padding-top:3px}.ms dd{margin:0}
.rr{display:grid;grid-template-columns:20px auto minmax(0,1fr);gap:4px 8px;align-items:baseline;padding:4px 8px;border-radius:8px;color:var(--sub);font-size:14px;line-height:1.5}
.rr.on{background:var(--accent-bg);color:var(--text)}
.who{font-size:12px;padding:1px 8px;border-radius:8px;white-space:nowrap}
.pr{grid-column:3;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pn{font-family:var(--mono);font-size:12px;color:var(--sub)}
.ly{font-size:11px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.legend{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.box{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin:0 0 10px}
.jk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px;margin:6px 0 0}
.jk dt{color:var(--warn);font-size:12px;padding-top:2px}.jk dd{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.badge{font-size:12px;padding:2px 8px;border-radius:8px;margin-right:6px}
.nd{cursor:pointer;transition:opacity .3s}.nd.dim{opacity:.5}
.edge{stroke:#C9C6BC;stroke-width:2;stroke-linecap:round;fill:none}
.edge.hot{stroke:#378ADD;stroke-width:2.6;stroke-dasharray:6 5}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:no-preference){.edge.hot{animation:flow 1.6s linear infinite}}
.end{display:none;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--accent-bg);color:var(--accent);font-size:14px}
.sel{margin:0 0 12px}
.sel .row{margin:0 0 6px}
input[type=range]{accent-color:#378ADD}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">セキュのハッピーガーデン<small>科目B 構造の基礎入れ｜経路を見てみよう</small></div>
<div class="sel"><div class="row" id="groups"></div><div class="row" id="scenes"></div></div>
<div class="layout">
<div class="left">
<div class="card">
<svg id="map" width="100%" viewBox="0 0 680 380" role="img" aria-label="場面の図"></svg>
<div class="row" style="margin:8px 0 0;font-size:13px;color:var(--sub)">
<span>速さ</span><span>ゆっくり</span><input type="range" id="spd" min="50" max="300" step="10" value="120" style="flex:1;max-width:220px"><span>はやい</span>
<span style="margin-left:auto">目を閉じている機器や人＝この手順では通らない所（記録も残らない）</span>
</div>
<div class="end" id="end">1周目はここまで。次は「2周目 立場で見る」で、★ の付いた所を押してみよう <button id="go2" style="margin-left:8px">2周目へ</button></div>
</div>
<div style="margin-top:12px">
<div class="row" id="modes"></div>
<div class="row"><button id="prev" aria-label="前の手順">◀</button><span id="steps" style="display:contents"></span><button id="next" aria-label="次の手順">▶</button><button id="again">↻ もう一度</button></div>
<div class="row" id="viewrow" style="display:none"><span class="lbl">立ち位置</span><span id="views" style="display:contents"></span></div>
<div class="box" id="box">
<div style="flex:none;width:40px;display:flex;justify-content:center"><svg id="mic" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="margin-top:4px"><rect x="10" y="3" width="8" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 13a8 8 0 0 0 16 0M14 21v4M10 25h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><svg id="av" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="display:none"></svg></div>
<div style="min-width:0;flex:1"><div id="bx-h" style="font-size:13px;margin-bottom:2px"></div><div id="bx-b"></div></div>
</div>
<div style="font-size:13px;color:var(--sub);margin:4px 0 6px">この手順に関係するカード</div>
<div class="cards" id="cards"></div>
</div>
</div>
<div class="right">
<div class="card">
<div style="font-size:12px;color:var(--sub)" id="h-sub"></div>
<div style="font-size:20px;font-weight:500;margin:2px 0 0" id="h-title"></div>
<dl class="ms">
<dt>ゴール</dt><dd id="h-goal"></dd>
<dt>見どころ</dt><dd id="h-focus"></dd>
<dt>例</dt><dd><span id="h-ex"></span><div class="legend" id="h-note"></div></dd>
<dt>通る順</dt><dd><div class="legend" id="h-layer" style="margin:0 0 6px">層：L2 データリンク層（MAC アドレス）・L3 ネットワーク層（IP アドレス）・L4 トランスポート層（TCP・UDP とポート）・L7 アプリケーション層。TLS は L4 と L7 の間（L5〜L6 相当）。ポートまで書き換える NAPT は L4 にもかかる</div><div id="route"></div></dd>
</dl>
</div>
</div>
</div>
</div>
<script>
const SCENES=[{"group":"1","scene":"1","title":"会社の PC で、取引先の Web サイトを開くまで（アドレスの配布・プロキシ・名前解決・アドレス変換・証明書の検証）","goal":"A さんのブラウザに、取引先のページが出る","focus":"どの機器に何が見えて、どこに記録が残るか（FW・プロキシ・キャッシュ DNS の立場）","example":"朝、営業の A さんは、取引先がサイトに載せた新しい価格表を確かめるため、会社の PC の電源を入れ、ブラウザのお気に入りから取引先のサイト https://www.example.jp を開いた。会社では、誰がどのサイトへ行ったかを残し、許可していないサイトを止めるため、外のサイトへはプロキシを通して出る決まりになっている。ページが出るまでの数秒の間に、裏で7つの手順が動いている","note":"www.example.jp と 203.0.113.10 は、説明用に取っておかれた名前とアドレス（実在のサイトではない）","zones":[[16,30,262,220,"#EEEDFE","社内 LAN","#3C3489"],[228,258,206,110,"#FAEEDA","DMZ","#633806"],[376,104,112,128,"#E6F1FB","",""],[516,30,156,338,"#E1F5EE","社外のサーバ","#085041"]],"nodes":{"pc":{"x":62,"y":170,"label":"A さんの PC","type":"pc"},"l2":{"x":142,"y":170,"label":"L2 スイッチ","type":"sw"},"l3":{"x":226,"y":170,"label":"L3 スイッチ","type":"sw"},"dhcp":{"x":226,"y":92,"label":"DHCP サーバ","type":"srv","labelPos":"above"},"fw":{"x":318,"y":170,"label":"FW（NAT）","type":"fw","labelPos":"above"},"net":{"x":432,"y":166,"label":"インターネット","type":"net"},"adns":{"x":594,"y":110,"label":"権威 DNS","type":"srv","labelPos":"above"},"web":{"x":594,"y":290,"label":"取引先の Web サーバ","type":"srv"},"px":{"x":283,"y":318,"label":"プロキシ","type":"srv"},"dns":{"x":380,"y":318,"label":"キャッシュ DNS","type":"srv"}},"edges":[["pc","l2"],["l2","l3"],["l3","dhcp"],["l3","fw"],["fw","px"],["fw","dns"],["px","dns"],["fw","net"],["net","adns"],["net","web"]],"route":[["pc","が DHCP（Dynamic Host Configuration Protocol）サーバから、IP（Internet Protocol）アドレス・サブネットマスク・ゲートウェイ・DNS（Domain Name System）サーバをもらう",[["DHCP","L7"]]],["pc","がゲートウェイ（ルータとして働く L3 スイッチ）の MAC（Media Access Control）アドレスを引く",[["ARP（Address Resolution Protocol）","L2〜3"]]],["pc","が、会社の決まりどおり、まずプロキシと接続をつくる",[["TCP（Transmission Control Protocol）","L4"]]],["pc","がプロキシに、取引先のサイトへの中継を頼む",[["HTTP（Hypertext Transfer Protocol）CONNECT","L7"]]],["px","がキャッシュ DNS に名前を引いてもらう。キャッシュ DNS が権威 DNS に聞く",[["DNS","L7"]]],["px","が FW（ファイアウォール）を通って、取引先の Web サーバと接続をつくる。FW が送信元を書き換える",[["TCP","L4"],["NAT（Network Address Translation）","L3"]]],["pc","が取引先の Web サーバと TLS（Transport Layer Security）の接続をつくり、ページを頼む",[["TLS","L5〜6 相当"],["HTTPS（HTTP over TLS）","L7"]]]],"steps":[{"t":"① DHCP","star":["l3","L3 スイッチはルータとしてブロードキャストを止めるので、DHCP リレーで中継する役になる（S07-3）"],"o":"A さんが PC の電源を入れると、PC は LAN（Local Area Network）につながり、まず DHCP で自分の IP アドレス・サブネットマスク・ゲートウェイ・参照する DNS サーバをもらう。やりとりは UDP（User Datagram Protocol）で、DISCOVER → OFFER → REQUEST → ACK の4回。","legs":[[["pc","l2","l3","dhcp"],"DISCOVER","IP アドレスをもらいに行く中","DHCP サーバ","DHCP DISCOVER（ブロードキャスト、UDP 67番宛て）","まだ IP アドレスが無いので、同じセグメントの全員に聞こえるように呼びかける。L3 スイッチがリレーして DHCP サーバに届ける"],[["dhcp","l3","l2","pc"],"OFFER","配るアドレスの案を受け取る中","A さんの PC","DHCP OFFER（PC へは UDP 68番宛て）","DHCP サーバが「この IP アドレスでどう？」と、配るアドレスを示す"],[["pc","l2","l3","dhcp"],"REQUEST","使うアドレスを伝える中","DHCP サーバ","DHCP REQUEST（ブロードキャスト、UDP 67番宛て）","「そのアドレスを使います」と、OFFER の中から選んで伝える"],[["dhcp","l3","l2","pc"],"ACK","設定を受け取る中","A さんの PC","DHCP ACK（PC へは UDP 68番宛て）","使うアドレスが決まった。IP アドレス・サブネットマスク・ゲートウェイ・DNS サーバが届いた"]],"r":{"pc":"まだ IP アドレスが無いので、DISCOVER をブロードキャストする。届いた OFFER のアドレスを REQUEST（これもブロードキャスト）で選び、ACK で使うアドレスが決まる。","l2":"ブロードキャストを、同じセグメントの全部のポートに流す。ふつうは MAC アドレスを見て転送するだけ。DHCP スヌーピングを入れれば、正規のサーバのポート以外から来た OFFER・ACK を捨てる。","l3":"L3 スイッチはルータとして働くので、ブロードキャストを向こうへ通さない。そこで DHCP リレーとして、DHCP サーバへ中継する。サーバからの返事は L3 スイッチの 67番に届き、L3 スイッチが PC の 68番へ渡す。","dhcp":"配るアドレスを選んで OFFER で示し、REQUEST が来たら ACK で確定する。IP アドレス・サブネットマスク・ゲートウェイ・DNS サーバを渡す。偽の DHCP サーバがいると、PC に配るゲートウェイや DNS サーバを、偽のものに差し替えられる。"},"cards":["S07-2","S07-3"]},{"t":"② ARP","star":["pc","偽の ARP 応答で書き換えられるのは、PC の ARP テーブル（S07-1）"],"o":"A さんがお気に入りを押した。プロキシの IP アドレスは、サブネットマスクで見ると別のセグメントなので、PC はまずゲートウェイ（L3 スイッチ）の MAC アドレスを ARP で引く。","legs":[[["pc","l2","l3"],"ゲートウェイの MAC は？","ゲートウェイの MAC アドレスを探し中","L3 スイッチ（ゲートウェイ）","ARP 要求（ブロードキャスト）","「この IP アドレスの人、MAC アドレスを教えて」と、同じセグメントの全員に聞く"],[["l3","l2","pc"],"MAC はこれ","MAC アドレスを受け取る中","A さんの PC","ARP 応答（ユニキャスト）","ARP テーブルに書き込んで、しばらく覚えておく。応答が本物かは確かめない"]],"r":{"pc":"「ゲートウェイの IP の MAC は？」をブロードキャストし、返ってきた MAC を ARP テーブルに覚える。偽の応答でも信じてしまう。","l2":"ARP の要求を全部のポートに流す。DAI（Dynamic ARP Inspection）を入れていなければ、応答が本物かは確かめない。","l3":"自分の MAC アドレスを返す。偽の応答を送る機器がいると、PC の ARP テーブルが書き換わる（ARP スプーフィング）。"},"cards":["S07-1"]},{"t":"③ TCP","star":["fw","LAN から DMZ へは送信元を書き換えずに通すので、プロキシには PC の IP アドレスが見える（S05-1）"],"o":"A さんの PC のブラウザが、プロキシと TCP の接続をつくる。SYN → SYN+ACK → ACK の3回のやりとりで、接続ができる。","legs":[[["pc","l2","l3","fw","px"],"SYN","TCP の接続をつくり中","プロキシ（例：8080番）","TCP SYN","「つないでいい？」と最初の合図を送る"],[["px","fw","l3","l2","pc"],"SYN+ACK","返事を受け取る中","A さんの PC","TCP SYN+ACK","「いいよ。そっちもいい？」"],[["pc","l2","l3","fw","px"],"ACK","最後の合図を送る中","プロキシ","TCP ACK","「OK」。これで接続ができた（3ウェイハンドシェイク）"]],"r":{"pc":"SYN を送り、SYN+ACK を受けて、ACK を返す。","l2":"ふつうは MAC アドレスを見て転送するだけで、IP アドレスやその先の中身は見ない。","l3":"宛先の IP アドレスを見て、FW の方へ転送する。","fw":"LAN から DMZ（DeMilitarized Zone：社内と外の間に置く区画）のプロキシへの通信を、ルールで許可しているので通す。送信元は PC の IP アドレスのまま。戻りの SYN+ACK は、ステートフルなので応答として通す。","px":"SYN を受けて SYN+ACK を返す。ACK が来たら接続ができる。"},"cards":["S05-1","S05-2"]},{"t":"④ CONNECT","star":["pc","PC は宛先の名前とポートをそのまま渡し、名前を引くのはプロキシ（S05-2）"],"o":"A さんの PC のブラウザは、プロキシに「CONNECT www.example.jp:443」と頼む。プロキシは A さんを認証し、宛先の名前（www.example.jp）を、URL（Uniform Resource Locator）フィルタの許可・拒否のリストと照らして記録する。","legs":[[["pc","l2","l3","fw","px"],"CONNECT www.example.jp:443","プロキシにお願い中","プロキシ","HTTP CONNECT www.example.jp:443","「www.example.jp の 443番へ、つないでほしい」"],[["px","fw","l3","l2","pc"],"407 認証して","身元を聞かれ中","A さんの PC","HTTP 407 Proxy Authentication Required","「あなたは誰？」と聞き返される"],[["pc","l2","l3","fw","px"],"CONNECT（ID 付き）","ID を付けてもう一度お願い中","プロキシ","CONNECT ＋ Proxy-Authorization ヘッダ","A さんの ID を見せる。プロキシは宛先をリストと照らして通し、誰が・どこへ・いつを記録する。"]],"r":{"pc":"宛先の名前とポートをプロキシに伝え、ID は Proxy-Authorization ヘッダで渡す。宛先の名前を IP アドレスに引くのはプロキシで、① でもらった DNS サーバは、この場面では宛先を引くのに使わない。","l2":"ふつうは MAC アドレスを見て転送するだけで、IP アドレスやその先の中身は見ない。","l3":"宛先の IP アドレスを見て転送するだけ。","fw":"許可した通信なので通す。パケットフィルタが見るのは、IP アドレスとポートまで。","px":"407 を返して利用者を認証する（Proxy-Authorization）。宛先の名前を許可・拒否のリストと照らし、利用者・宛先・時刻を記録する。"},"cards":["S05-2"]},{"t":"⑤ DNS","star":["dns","キャッシュ DNS が記録を取っていても、残る送信元はプロキシで、A さんまでたどれるのはプロキシの記録（S05-2）"],"o":"宛先の名前を引くのはプロキシ。キャッシュ DNS（フルサービスリゾルバ）が外の権威 DNS に聞いて答えを持ち帰り、TTL（Time To Live：覚えておいてよい秒数）の間覚える。","legs":[[["px","dns"],"A レコードは？","名前を引いてもらう中","キャッシュ DNS","DNS 再帰的クエリ（ふつう UDP 53番）","「www.example.jp の A レコード（IPv4 アドレス）は？」"],[["dns","fw","net","adns"],"A レコードは？","外へ聞きに行く中","権威 DNS（example.jp）","DNS 非再帰的クエリ（ふつう UDP 53番）","キャッシュに無いので、ルートサーバ → jp の DNS → example.jp の権威 DNS と順にたどる（図は最後の1回だけ）"],[["adns","net","fw","dns"],"203.0.113.10","答えを持ち帰る中","キャッシュ DNS","DNS 応答（A レコード・TTL）","「203.0.113.10 だよ」。TTL の秒数のあいだ覚えておく"],[["dns","px"],"203.0.113.10","答えを渡す中","プロキシ","DNS 応答","これで行き先の IP アドレスが分かった"]],"r":{"px":"キャッシュ DNS に「www.example.jp の A レコードは？」と再帰的クエリを送る。","dns":"キャッシュに無ければ、ルートサーバ → jp の DNS → example.jp の権威 DNS の順に聞いて、答えを TTL の間覚える。偽の応答を先に受け取ると、TTL の間それを全員に返す（キャッシュポイズニング。S01-3）。問い合わせの記録を取る設定なら、送信元（ここではプロキシ）と名前が残る。","fw":"DMZ のキャッシュ DNS から外への DNS（53番）を許可しているので通す。送信元を FW のグローバル IP アドレス（とポート）に書き換える（NAT）。","net":"経路の途中。DNS はふつう暗号化されていないので、経路の上で中身を見られうる。","adns":"自分のゾーンの A レコードを返す。見える送信元は、FW のグローバル IP アドレス。"},"cards":["S01-1","S01-2","S01-3"]},{"t":"⑥ NAT","star":["web","見える送信元は FW のグローバル IP アドレス（S05-4）"],"o":"プロキシが取引先の Web サーバと TCP の接続をつくり、できたら PC に「200 Connection established」を返す。FW は、送信元を自分のグローバル IP アドレス（とポート）に書き換え、対応を表に覚える（NAT）。","legs":[[["px","fw","net","web"],"SYN","Web サーバとつなぎ中","取引先の Web サーバ（443番）","TCP SYN（FW が送信元を NAT で書き換え）","FW を出るとき、送信元が FW のグローバル IP アドレス（とポート）に変わる"],[["web","net","fw","px"],"SYN+ACK","返事を受け取る中","プロキシ","TCP SYN+ACK","FW は覚えておいた対応表で、戻りをプロキシへ返す"],[["px","fw","net","web"],"ACK","最後の合図を送る中","取引先の Web サーバ","TCP ACK","接続ができた"],[["px","fw","l3","l2","pc"],"200 つないだ","トンネル開通を知らせ中","A さんの PC","HTTP 200 Connection established","ここからプロキシは、中身を見ずに中継するだけ"]],"r":{"px":"Web サーバと TCP の接続をつくり、PC に 200 を返す。ここからは中身を見ずに中継する（トンネル）。","fw":"ルールを上から照らし、プロキシから外への 443番を許可。送信元を、FW のグローバル IP アドレス（とポート）に書き換え、対応を表に覚える。戻りの応答は、対応表で宛先をプロキシに戻して通す。FW の記録で送信元として分かるのはプロキシまで。A さんの PC は、プロキシの記録でしか分からない。","net":"経路の途中。","web":"見える送信元は、FW のグローバル IP アドレスだけ。A さんの PC やプロキシのアドレスは見えない。","pc":"プロキシから 200 が届いたら、トンネルができたと分かる。","l2":"ふつうは MAC アドレスを見て転送するだけで、IP アドレスやその先の中身は見ない。","l3":"宛先の IP アドレスを見て転送するだけ。"},"cards":["S05-1","S05-4"]},{"t":"⑦ TLS","star":["px","復号しないプロキシに見えるのは、利用者・CONNECT で伝えられた名前とポート・時刻・通信の量まで（S05-2）"],"o":"トンネルの中で、A さんの PC と取引先の Web サーバが直接 TLS を結ぶ。PC は、届いた証明書の SAN（Subject Alternative Name：証明書に書かれたサイトの名前）と、信頼するルート認証局（CA：Certification Authority）までたどれるかなどを確かめてから、暗号化した HTTP の要求を送る。","legs":[[["pc","l2","l3","fw","px","fw","net","web"],"ClientHello","TLS の接続をつくり中","取引先の Web サーバ","TLS ClientHello（SNI（Server Name Indication：つなぎたいサイトの名前）＝www.example.jp）","「この名前のサイトと、この暗号で話したい」"],[["web","net","fw","px","fw","l3","l2","pc"],"証明書","証明書を受け取り中","A さんの PC","TLS ServerHello・Certificate・CertificateVerify","PC が SAN・ルート認証局までたどれるか・期限を確かめ、署名で秘密鍵を持つ相手かを確かめる。だめなら止める"],[["pc","l2","l3","fw","px","fw","net","web"],"GET /（暗号）","ページを頼み中","取引先の Web サーバ","HTTPS（HTTP GET / を TLS で暗号化）","中身は暗号文で、途中の機器には読めない（復号して検査しない限り）。返ってきたページが A さんのブラウザに出て、ゴール"]],"r":{"pc":"SNI に www.example.jp を入れて ClientHello を送る。届いた証明書で3つを確かめる。SAN が接続先の FQDN（Fully Qualified Domain Name：www.example.jp のような、省略しない名前）と一致するか。信頼するルート認証局までたどれるか。期限内か。さらに CertificateVerify の署名で、秘密鍵を持つ相手かを確かめる。合格なら、要求を暗号化して送る。","l2":"ふつうは MAC アドレスを見て転送するだけで、IP アドレスやその先の中身は見ない。","l3":"宛先の IP アドレスを見て転送するだけ。","fw":"見えるのは IP アドレスとポート（PC→プロキシは 8080番、プロキシ→外は 443番）。パケットフィルタは SNI を見ない。ServerHello のあとは暗号文（TLS 1.3 の場合）。","px":"見えるのは、利用者・CONNECT で伝えられた名前とポート・時刻・通信の量まで。URL のパスや中身は見えない（復号して検査しない限り）。","net":"経路の途中。ClientHello の SNI は平文で見える。ServerHello のあとは暗号文（TLS 1.3 の場合）。","web":"SNI で出す証明書を選び、証明書と秘密鍵で TLS を結ぶ。どのサイトへの要求かは Host ヘッダ（HTTP/2 では :authority）で決め、要求に答える。応答に Strict-Transport-Security ヘッダを付ければ、次から http:// で開いても、ブラウザが https:// で行く（S03-4）。"},"cards":["S03-1","S03-4","S03-5"]}]},{"group":"1","scene":"2","title":"取引先に請求書のメールが届くまで（送信元を確かめる送信ドメイン認証・メールの暗号化・ビジネスメール詐欺）","goal":"B さんに A さんの本物の請求書が届き、似たドメインからの「振込先が変わった」には、B さんが払わない","focus":"SPF・DKIM・DMARC を照らすのは受信側メールサーバで、送信側は自分の権威 DNS に書くだけ。封筒の送信者（MAIL FROM）・署名したドメイン（DKIM の d=）・画面に出る差出人（ヘッダ From）のどれを、どの仕組みが見るか。全部 pass しても、そのドメインが本物の取引先かは保証されないこと（受信側メールサーバ・送信側の権威 DNS・攻撃者の立場）","example":"社員の A さん（example.jp）が、取引先の B さん（example.com）に、今月の請求書をメールで送る。メールは SMTP（Simple Mail Transfer Protocol）で、メールサーバからメールサーバへ配られる。SMTP は送信者を確かめない。そこで example.jp の管理者は、example.jp の権威 DNS（Domain Name System）に、送ってよいサーバと署名の鍵と、確かめが fail したときの扱いを書いておく。受け取った側はそれを引いて確かめる。この仕組みが SPF（Sender Policy Framework）・DKIM（DomainKeys Identified Mail）・DMARC（Domain-based Message Authentication, Reporting and Conformance）で、まとめて送信ドメイン認証という。請求書には振込先の口座が載る。攻撃者は、A さんを装って「振込先が変わった」と送る機会をねらっている。取引先は、前のドメイン example.net も残していて、そこに届いたメールを example.com へ自動で転送している。example.jp は送信ドメイン認証を始めたばかりで、まだ fail したメールも止めない設定にしている。この場面は、今月の請求から、翌月と、その数か月後までを追う","note":"example.jp・example.com・example.net・attacker.example と 192.0.2.10・198.51.100.25 は、説明用に取っておかれた名前とアドレス（実在のサーバではない）。examp1e.jp は、似せたドメインの例として作った名前","zones":[[16,16,236,236,"#EEEDFE","example.jp（A さんの会社）","#3C3489"],[282,140,116,112,"#E6F1FB","",""],[428,16,248,236,"#E1F5EE","example.com（取引先）","#085041"],[196,284,180,90,"#FAECE7","攻撃者の手元","#712B13"],[440,276,236,98,"#F1EFE8","example.net（取引先の旧ドメイン）","#444441"]],"nodes":{"pcA":{"x":60,"y":200,"label":"A さんの PC","type":"pc"},"mtaA":{"x":180,"y":200,"label":"送信側メールサーバ","type":"srv"},"dnsA":{"x":150,"y":96,"label":"送信側の権威 DNS","type":"srv","labelPos":"above"},"net":{"x":340,"y":200,"label":"インターネット","type":"net","labelPos":"above"},"dnsB":{"x":530,"y":96,"label":"受信側の権威 DNS","type":"srv","labelPos":"above"},"mtaB":{"x":500,"y":200,"label":"受信側メールサーバ","type":"srv"},"pcB":{"x":620,"y":200,"label":"B さんの PC","type":"pc"},"bad":{"x":320,"y":326,"label":"攻撃者","type":"bad"},"fwd":{"x":480,"y":330,"label":"転送サーバ","type":"srv"}},"edges":[["pcA","mtaA"],["mtaA","net"],["dnsA","net"],["net","dnsB"],["net","mtaB"],["mtaB","pcB"],["net","bad"],["net","fwd"]],"route":[["pcA","が送信側メールサーバへメールを預け、送信側メールサーバが宛先の MX（Mail Exchange）レコードを引いて、受信側メールサーバへ届ける",[["SMTP（Simple Mail Transfer Protocol。587番・SMTP-AUTH：SMTP Authentication）","L7"],["STARTTLS で TLS（Transport Layer Security）へ切り替え","L5〜6 相当"],["DNS（Domain Name System）の MX","L7"],["SMTP（25番）","L7"]]],["mtaB","が example.jp の権威 DNS の TXT レコード（文字列を載せるレコード）を引き、SPF（Sender Policy Framework）で接続元の IP（Internet Protocol）アドレスを、DKIM（DomainKeys Identified Mail）で example.jp のドメインの署名を確かめる",[["DNS（TXT）","L7"],["SPF","L7"],["DKIM","L7"],["デジタル署名",""]]],["mtaB","が、SPF・DKIM で pass（合格）したドメインと、画面に出る差出人（ヘッダ From）のドメインが合うかを DMARC（Domain-based Message Authentication, Reporting and Conformance）で判定して受信箱に入れ、結果を送信側へ報告する",[["DNS（TXT）","L7"],["DMARC","L7"],["IMAP4（Internet Message Access Protocol version 4）","L7"]]],["fwd","が届いたメールを、差出人と本文はそのままで、宛先を b@example.com に変えて転送する。接続元が変わって SPF は fail になるが、DKIM の署名は残る",[["SMTP（転送）","L7"],["SPF","L7"],["DKIM","L7"]]],["pcA","が自分の秘密鍵で署名し、B さんの公開鍵で暗号化して送る",[["S/MIME（Secure/Multipurpose Internet Mail Extensions）","L7"],["デジタル署名",""],["ハイブリッド暗号（本文は共通鍵、その鍵は公開鍵で暗号化）",""]]],["bad","がヘッダ From だけ example.jp と偽る。example.jp は DMARC のポリシを p=reject（拒否してほしい）に強めており、受信側メールサーバが拒否する",[["SMTP","L7"],["DMARC","L7"]]],["bad","が似たドメインを取り、SPF・DKIM・DMARC を正しく設定して「振込先が変わった」と送る。全部 pass する",[["SMTP","L7"],["SPF","L7"],["DKIM","L7"],["DMARC","L7"]]]],"steps":[{"t":"① SMTP の配送","star":["mtaA","封筒（MAIL FROM・RCPT TO）を書いて配るのは送信側メールサーバで、画面に出るヘッダ From とは別に書ける（S02-1）"],"o":"A さんのメールソフトが、587番で送信側メールサーバにつなぎ、TLS（Transport Layer Security）に切り替えて SMTP-AUTH（SMTP Authentication）で認証してから預ける。送信側メールサーバは、example.com の MX（Mail Exchange）レコードで受信側メールサーバの IP（Internet Protocol）アドレスを知り、25番で届ける。","legs":[[["pcA","mtaA"],"請求書のメール","メールを預ける中","送信側メールサーバ（587番）","SMTP（587番。STARTTLS で TLS に切り替えてから SMTP-AUTH）","「A さんです。このメールを b@example.com へ」。認証した利用者のメールだけ、宛先を問わず中継してもらえる"],[["mtaA","net","dnsB"],"MX は？","宛先のメールサーバを探し中","example.com の権威 DNS","DNS 問い合わせ（example.com の MX レコード）","「example.com 宛てのメールは、どのサーバが受ける？」（キャッシュ DNS は図では省いた）"],[["dnsB","net","mtaA"],"mx.example.com","答えを受け取る中","送信側メールサーバ","DNS 応答（MX レコード：10 mx.example.com。その A レコードも引く）","受信側メールサーバの名前と IP アドレスが分かった"],[["mtaA","net","mtaB"],"MAIL FROM・RCPT TO","メールを届ける中","受信側メールサーバ（25番）","SMTP（25番）：MAIL FROM:<a@example.jp> → RCPT TO:<b@example.com> → DATA（DKIM-Signature ヘッダ・ヘッダ From: a@example.jp・本文）","配送に使うのは封筒（MAIL FROM・RCPT TO）で、画面に出る差出人（ヘッダ From）は DATA の中に、封筒とは別に書く。送る前に、DKIM の署名（DKIM-Signature ヘッダ）も付けた"]],"r":{"pcA":"メールソフトが、送信側メールサーバに 587番でつなぎ、STARTTLS で TLS に切り替えてから、ID とパスワードで認証して（SMTP-AUTH）メールを預ける（465番で最初から TLS にする形もある）。","mtaA":"認証した社内の利用者のメールだけ、宛先を問わず中継する（外から来た外宛てのメールまで中継すると、第三者中継で迷惑メールの踏み台になる）。送る前に、example.jp のドメインの秘密鍵（サーバが持つ。A さん個人の鍵ではない）で、DKIM の署名（DKIM-Signature ヘッダ）を付ける。宛先の MX を引き、封筒の MAIL FROM に A さんのアドレス（届かないときのエラー通知の宛先。Return-Path に残る）、RCPT TO に宛先を書いて送る。","net":"経路の途中。サーバの間も STARTTLS で暗号化できるが、守れるのは区間ごと。メールサーバの上では平文（⑤）。","dnsB":"example.com のゾーンの MX レコード（このドメイン宛てのメールを受けるサーバの名前）を返す。","mtaB":"25番で受ける。外から受けるのは自社ドメイン宛てだけ。封筒の MAIL FROM もヘッダ From も、SMTP では送信者が自由に書ける。MAIL FROM のドメインを確かめるのが ② の SPF、ヘッダ From のドメインを確かめるのが ③ の DMARC。"},"cards":["S02-1"]},{"t":"② SPF・DKIM","star":["mtaB","照らすのは受信側で、送信側は権威 DNS に書くだけ（S02-2）"],"o":"受信側メールサーバが、届いたメールの送信元を確かめる。SPF では MAIL FROM のドメインの TXT レコードと SMTP の接続元の IP アドレスを照らし、DKIM では署名したドメイン（d=）の公開鍵で署名を検証する。","legs":[[["mtaB","net","dnsA"],"TXT は？","TXT レコードを聞き中","example.jp の権威 DNS","DNS 問い合わせ（example.jp の TXT＝SPF、sel1._domainkey.example.jp の TXT＝DKIM の公開鍵）","MAIL FROM のドメインと、DKIM-Signature の d=example.jp・s=sel1（セレクタ）から、引く名前を決める"],[["dnsA","net","mtaB"],"SPF・公開鍵","答えを受け取る中","受信側メールサーバ","DNS 応答（SPF：v=spf1 ip4:192.0.2.10 -all ／ DKIM：v=DKIM1; k=rsa; p=<公開鍵>。DKIM の p= は公開鍵で、DMARC の p=（ポリシ）とは別）","接続元（送信側メールサーバ）の 192.0.2.10 は SPF に載っている → pass。公開鍵で署名を検証 → pass"]],"r":{"mtaB":"SPF：MAIL FROM のドメイン（example.jp）の TXT を引き、SMTP の接続元の IP アドレスが載っていれば pass、無ければ末尾の -all（fail）・~all（softfail）に従う。DKIM：DKIM-Signature の d=（署名したドメイン）と s=（セレクタ：どの鍵かを示す名前）から <s>._domainkey.<d> の TXT を引き、公開鍵で署名を検証する。合えば、d= のドメインが署名したことと、署名のあとに、h= に並べたヘッダと本文が書き換わっていないことが分かる。","net":"経路の途中。DNS の問い合わせは、ふつう暗号化されていない。","dnsA":"example.jp の管理者が書いた TXT レコードを返すだけで、照合はしない。送ってよいメールサーバの IP アドレス（SPF）と、DKIM の公開鍵が載っている。SPF に書くのはメールサーバの IP アドレスで、DNS サーバの IP アドレスではない。"},"cards":["S02-2","S02-3"]},{"t":"③ DMARC","star":["dnsA","fail したときの扱い（p=）を宣言するのは送信側で、p= や aspf= の値を問われる（S02-4）"],"o":"受信側メールサーバが、SPF・DKIM で pass したドメインと、画面に出るヘッダ From のドメインが合うか（アライメント）を見る。合わないときの扱いは送信側が _dmarc.example.jp の TXT の p= で宣言していて、example.jp は始めたばかりなので p=none（何もしないでほしい）にしている。","legs":[[["mtaB","net","dnsA"],"_dmarc は？","ポリシを聞き中","example.jp の権威 DNS","DNS 問い合わせ（_dmarc.example.jp の TXT）","ヘッダ From が a@example.jp なので、example.jp のポリシを引く"],[["dnsA","net","mtaB"],"p=none","ポリシを受け取る中","受信側メールサーバ","DNS 応答（v=DMARC1; p=none; aspf=r; rua=mailto:dmarc@example.jp）","SPF の MAIL FROM も DKIM の d= も example.jp で、ヘッダ From と合う → DMARC pass"],[["mtaB","pcB"],"請求書（認証 pass）","受信箱に届く中","B さんの PC","IMAP4（Internet Message Access Protocol version 4）over TLS（993番）","B さんがメールソフトで受け取る。認証の結果は Authentication-Results ヘッダに残る"],[["mtaB","net","mtaA"],"集約レポート","結果を報告する中","送信側メールサーバ（rua= の宛先 dmarc@example.jp）","メール（DMARC の集約レポート。1日分などをまとめて rua= の宛先へ）","「example.jp を名乗るメールを、どの IP アドレスから何通受け、何通が pass したか」を送信側に知らせる"]],"r":{"mtaB":"SPF・DKIM の結果だけでは、画面に出るヘッダ From は確かめていない。DMARC は、pass したドメイン（SPF は MAIL FROM、DKIM は d=）とヘッダ From のドメインが合うかを見て、どちらか1つが合えば pass。合い方の厳しさは aspf=（SPF）と adkim=（DKIM）で決める。r（relaxed）なら mail.example.jp と example.jp のように組織ドメインが同じで合い、s（strict）なら FQDN（Fully Qualified Domain Name）まで同じでないと合わない。fail のときの扱いは送信側が p= で宣言し（none：何もしない／quarantine：隔離／reject：拒否）、それを判断材料に受信側が決める。結果は集約レポートにまとめて送信側へ送る。","net":"経路の途中。","dnsA":"_dmarc.example.jp の TXT に、ポリシ（p=）・アライメントの厳しさ（aspf=）・集約レポートの宛先（rua=）が書いてある。p=none で始め、集約レポートを見てから強める（⑥）。","pcB":"メールソフトが IMAP4 で受信箱を読む。SPF・DKIM・DMARC を照らしたのは受信側メールサーバで、PC に届くのはその結果（Authentication-Results ヘッダ）。","mtaA":"rua= の宛先（dmarc@example.jp）として、集約レポートを受ける。example.jp を名乗るメールの送信元が一覧になるので、正規の送信元（外部の配信サービスを含む）の DMARC の pass・fail と、なりすましの量が分かる。"},"cards":["S02-4"]},{"t":"④ 転送","star":["fwd","転送すると接続元の IP アドレスが転送サーバに変わり、SPF が fail になる（S02-2）"],"o":"翌月、A さんは、アドレス帳に残っていた B さんの前のアドレス b@example.net に請求書を送った。取引先の転送サーバ（example.net）は、宛先を b@example.com に変え、MAIL FROM・ヘッダ From・本文はそのままで送り直す。","legs":[[["mtaA","net","fwd"],"請求書のメール","前のアドレスへ届ける中","転送サーバ（example.net）","SMTP（25番。MAIL FROM:<a@example.jp> → RCPT TO:<b@example.net>）","宛先のドメインが example.net なので、example.net の MX（転送サーバ）へ届ける"],[["fwd","net","mtaB"],"宛先を変えて転送","転送される中","受信側メールサーバ（example.com）","SMTP（25番。接続元は 198.51.100.25。MAIL FROM:<a@example.jp> のまま → RCPT TO:<b@example.com>）","MAIL FROM・ヘッダ From・本文はそのまま。変わったのは、宛先（RCPT TO：b@example.com）と接続元の IP アドレスで、SPF に効くのは接続元の方"],[["mtaB","net","dnsA"],"TXT は？","TXT レコードを聞き中","example.jp の権威 DNS","DNS 問い合わせ（SPF・DKIM の公開鍵・DMARC の TXT）","名乗ったドメインは、今回も example.jp"],[["dnsA","net","mtaB"],"SPF・公開鍵・ポリシ","答えを受け取る中","受信側メールサーバ","DNS 応答（v=spf1 ip4:192.0.2.10 -all ほか ② ③ と同じ）","198.51.100.25 は SPF に無い → SPF fail、署名はそのまま → DKIM pass。d=example.jp がヘッダ From と合う → DMARC pass"]],"r":{"mtaA":"① と同じく、DKIM の署名を付けて送る。宛先が example.net なので、example.net の MX（転送サーバ）へ届ける。","net":"経路の途中。","fwd":"届いたメールを、宛先（RCPT TO）を b@example.com に変え、封筒の MAIL FROM・ヘッダ From・本文は変えずに、example.com へ送り直す。受信側から見える接続元は、自分の IP アドレス（198.51.100.25）になる。署名したヘッダや本文を書き換える転送（件名や本文の末尾に文字を足すなど）だと、DKIM も fail になる。","mtaB":"SPF は、MAIL FROM のドメイン example.jp の TXT に接続元の 198.51.100.25 が無いので fail。DKIM の署名はメールに付いて回るので pass。DMARC は、SPF か DKIM のどちらか1つが pass し、そのドメインがヘッダ From と合えば pass。ここでは DKIM（d=example.jp）が合うので DMARC は pass で、p を reject に強めたあと（⑥）でも受信箱に届く（-all だと、DMARC を見る前に SPF の fail だけで拒否する受信側もある）。","dnsA":"② ③ と同じ TXT を返す。SPF に書いてあるのは example.jp のメールサーバの IP アドレスだけで、取引先の転送サーバは載っていない。"},"cards":["S02-2","S02-3","S02-4"]},{"t":"⑤ S/MIME","star":["pcA","署名は送信者の秘密鍵、暗号化は受信者の公開鍵で、誰の鍵かを問われる（S02-5）"],"o":"TLS が守るのは区間ごとの通信だけで、メールサーバの上では平文。そこで A さんは S/MIME（Secure/Multipurpose Internet Mail Extensions）で、自分の秘密鍵で署名し、B さんの証明書（前に届いた B さんの署名付きメールに付いていた）の公開鍵で暗号化して送る。","legs":[[["pcA","mtaA"],"署名・暗号化した請求書","暗号文のまま預ける中","送信側メールサーバ","S/MIME（ハイブリッド暗号：本文を使い捨ての共通鍵で暗号化し、その鍵を B さんの公開鍵で暗号化して添える）","送信側メールサーバに置かれても、本文は暗号文"],[["mtaA","net","mtaB"],"暗号文のメール","配送される中","受信側メールサーバ","SMTP（25番。DKIM の署名もこれまでどおり付く）","SPF・DKIM・DMARC は ②③ と同じく pass。本文はどのサーバでも読めない（件名・差出人・宛先は見える）"],[["mtaB","pcB"],"暗号文のメール","受信箱に届く中","B さんの PC","IMAP4 over TLS","B さんの秘密鍵で共通鍵を取り出して復号し、A さんの証明書で署名を検証する"]],"r":{"pcA":"本文に A さんの秘密鍵で署名し、A さんの証明書を添える。次に、本文を使い捨ての共通鍵で暗号化し、その共通鍵を B さんの証明書の公開鍵で暗号化して添える。暗号化して送るには、先に相手の証明書が要る。","mtaA":"預かったメールを中継する。本文は暗号文なので読めない。件名などのヘッダは、ふつう暗号化されないので見える。","net":"経路の途中。","mtaB":"②③ と同じく SPF・DKIM・DMARC を照らして受け取る。サーバの上でも、本文は暗号文のまま。","pcB":"自分の秘密鍵で共通鍵を取り出し、本文を復号する。添えられた A さんの証明書を、信頼するルート認証局（CA：Certification Authority）までたどって確かめ、その公開鍵で署名を検証し、証明書のメールアドレスがヘッダ From と合うかも見る。合えば、差出人が証明書の持ち主の A さん本人であることと、改ざんが無いことが分かる（DKIM が示すのは、ドメインの単位）。"},"cards":["S02-5"]},{"t":"⑥ DMARC を強める","star":["mtaB","SPF・DKIM が攻撃者のドメインで pass しても、ヘッダ From と合わなければ DMARC で fail になる（S02-4）"],"o":"example.jp は、集約レポートで正規の送信元（外部の配信サービスを含む）が DMARC で pass している（SPF か DKIM が pass し、ドメインが example.jp と合う）のを確かめてから、p を none → quarantine → reject と強めた。そこへ攻撃者が、封筒と DKIM の署名は自分で取ったドメイン attacker.example にして、画面に出るヘッダ From だけ a@example.jp と偽ったメールを送る。","legs":[[["bad","net","mtaB"],"From: a@example.jp","A さんを名乗る中","受信側メールサーバ","SMTP（MAIL FROM:<info@attacker.example>、ヘッダ From: a@example.jp、DKIM の d=attacker.example）","封筒と DKIM の署名は自分のドメインなので、SPF と DKIM は pass する。攻撃者のメールサーバと権威 DNS は、図では「攻撃者」1つにまとめ、そこへの問い合わせは省いた"],[["mtaB","net","dnsA"],"_dmarc は？","ポリシを聞き中","example.jp の権威 DNS","DNS 問い合わせ（_dmarc.example.jp の TXT）","ヘッダ From が example.jp なので、example.jp のポリシを引く"],[["dnsA","net","mtaB"],"p=reject","ポリシを受け取る中","受信側メールサーバ","DNS 応答（v=DMARC1; p=reject; aspf=r; rua=mailto:dmarc@example.jp）","pass したのは attacker.example。ヘッダ From の example.jp と合わない → DMARC fail"],[["mtaB","net","bad"],"拒否（5xx）","突き返される中","攻撃者","SMTP の 5xx 応答（DATA の終わりへの応答。550 5.7.1 など。DMARC のポリシで受け取りを拒否）","p=none のころなら、このメールは B さんに届いていた"]],"r":{"bad":"attacker.example を自分で取り、SPF と DKIM を設定した。封筒の MAIL FROM と DKIM の d= は自分のドメインにして、画面に出るヘッダ From だけ本物の A さんのアドレスを書く。","net":"経路の途中。","mtaB":"SPF（MAIL FROM の attacker.example）も DKIM（d=attacker.example）も pass。でも、pass したドメインがヘッダ From の example.jp と合わないので、DMARC は fail。example.jp の p=reject を判断材料に、受信側が SMTP の応答で拒否し、集約レポートにも載せる（最後の扱いを決めるのは受信側）。","dnsA":"強めたポリシ p=reject（拒否してほしいという送信側の宣言）を返す。p=none のままだと、受信側は fail を見つけても止めないので届く。reject にする前に正規の送信元を確かめておかないと、正規のメールまで拒否されうる。"},"cards":["S02-4"]},{"t":"⑦ 似たドメイン","star":["bad","似たドメインを取って SPF・DKIM・DMARC を正しく設定すれば、全部 pass する（S02-6）"],"o":"攻撃者は手を変え、example.jp に似たドメイン examp1e.jp（l ではなく 1）を取ってヘッダ From もそれにし、A さんを装って「来月から振込先が変わりました」と B さんに送る。ビジネスメール詐欺（BEC：Business E-mail Compromise）の手口で、名乗ったドメインの権威 DNS は攻撃者が用意したものなので、送信ドメイン認証は全部 pass する。","legs":[[["bad","net","mtaB"],"振込先が変わりました","A さんを装う中","受信側メールサーバ","SMTP（MAIL FROM:<a@examp1e.jp>、ヘッダ From: \"A さん\" <a@examp1e.jp>、DKIM の d=examp1e.jp）","「来月から振込先が変わりました。新しい口座は…」。表示名は A さん、ドメインは1文字違い"],[["mtaB","net","bad"],"TXT は？","名乗ったドメインに聞き中","examp1e.jp の権威 DNS（攻撃者が用意）","DNS 問い合わせ（examp1e.jp の SPF・DKIM の公開鍵・DMARC の TXT）","受信側は、名乗ったドメインの権威 DNS に聞くしかない"],[["bad","net","mtaB"],"SPF・公開鍵・DMARC","答えを返す中","受信側メールサーバ","DNS 応答（攻撃者が正しく書いた TXT）","接続元は SPF に載っている、署名は正しい、ドメインはヘッダ From と合う → 全部 pass"],[["mtaB","pcB"],"認証は全部 pass","受信箱に届く中","B さんの PC","IMAP4 over TLS","B さんの画面には「A さん」と出る。B さんは払う前に、前から決めてある電話番号で A さんに確かめ、偽物と分かって払わない"]],"r":{"bad":"examp1e.jp を取り、自分のメールサーバと権威 DNS を用意して、SPF・DKIM・DMARC を正しく書いた（図では1つにまとめた）。送信ドメイン認証が保証するのは「名乗ったドメインから正しく送られた」ことだけで、そのドメインが本物の取引先かは保証しない。本物の A さんのアカウントを乗っ取れば、正規のアドレスからも送れ、そのときも全部 pass する。","net":"経路の途中。","mtaB":"examp1e.jp の TXT で照らすと、SPF・DKIM・DMARC は全部 pass。example.jp の p=reject が効くのは、ヘッダ From が example.jp（とそのサブドメイン）のメールだけ。examp1e.jp には効かない。","pcB":"画面には、表示名「A さん」と、いつもに似た文面が出る。ここからは B さんがすること：振込先の変更はメールだけでは受け付けず、メールに書いてある連絡先ではなく、前から決めてある電話などで A さんに確かめる。金融機関にも口座の名義を確かめる。差出人のドメインが examp1e.jp（1文字違い）であることも見る。"},"cards":["S02-6"]}]},{"group":"1","scene":"3","title":"管理者が家から会社につないで、サーバを直す（VPN・踏み台・無線 LAN・機器の見張り）","goal":"確かめた端末と利用者だけが、決めた通り道で社内に入る（家からは VPN（Virtual Private Network）と踏み台（中継のサーバ）、社内では無線 LAN（Local Area Network）の AP（Access Point）につなぐ前の認証（IEEE 802.1X）。入口を乗っ取られても、奥への通り道は踏み台の22番だけに限る）","focus":"機器の見張り（無線 AP と監視サーバ）・入口（VPN 装置）・通り道（FW と踏み台）・つなぐ前の認証（無線 AP と RADIUS サーバ）のそれぞれで、誰が何を確かめるかを見る。操作の記録は踏み台にまとめて残す。VPN 装置はインターネットから見えるので、攻撃者の立場からも見る","example":"夜、社内の無線 AP（Access Point）が、SNMP（Simple Network Management Protocol）の trap で監視サーバに異常を知らせ、システム管理者の C さんにメールが届いた。無線 AP を新しく入れ替えたのに、RADIUS（Remote Authentication Dial In User Service）サーバの設定（つないでよい AP の一覧と、AP と共有する鍵）が古いままで、AP が RADIUS サーバに認証を頼んでも返事が来ない。このままだと、翌朝出社した社員が、会社の PC を無線 LAN（Local Area Network）につなげない。C さんは会社から渡されたノート PC で、家から VPN（Virtual Private Network）につなぎ、踏み台サーバ（社内のサーバを操作するときに必ず通す、中継のサーバ）を通って、RADIUS サーバのその設定を直す。社内は役割ごとにセグメント（管理・サーバ・事務の LAN）を分け、間の通信は FW（ファイアウォール）で最小にしてある。翌朝、社員の B さんが、会社の PC を無線 LAN につなぐ。C さんが作業をしている夜も、翌朝も、攻撃者は、インターネットから見える VPN 装置の、パッチの当たっていない脆弱性をねらっている","zones":[[8,60,100,122,"#F1EFE8","C さんの自宅","#444441"],[114,164,92,94,"#E6F1FB","",""],[220,164,100,94,"#FAEEDA","境界","#633806"],[8,272,112,98,"#FAECE7","攻撃者の手元","#712B13"],[132,272,170,98,"#E1F5EE","ほかの組織","#085041"],[430,10,238,128,"#EEEDFE","社内：管理","#3C3489"],[470,156,198,102,"#EEEDFE","社内：サーバ","#3C3489"],[430,270,238,100,"#EEEDFE","社内：事務の LAN","#3C3489"]],"nodes":{"cpc":{"x":50,"y":150,"label":"C さんの PC","type":"pc","labelPos":"above"},"net":{"x":160,"y":215,"label":"インターネット","type":"net","labelPos":"above"},"vpn":{"x":270,"y":215,"label":"VPN 装置","type":"box"},"fw":{"x":380,"y":215,"label":"FW","type":"fw"},"fumi":{"x":480,"y":88,"label":"踏み台サーバ","type":"srv","labelPos":"above"},"kanshi":{"x":600,"y":88,"label":"監視サーバ","type":"srv"},"radius":{"x":600,"y":215,"label":"RADIUS サーバ","type":"srv"},"ap":{"x":470,"y":330,"label":"無線 AP","type":"sw"},"bpc":{"x":590,"y":330,"label":"B さんの PC","type":"pc"},"bad":{"x":70,"y":325,"label":"攻撃者","type":"bad"},"other":{"x":250,"y":325,"label":"ほかの組織のサーバ","type":"srv"}},"edges":[["cpc","net"],["net","vpn"],["vpn","fw"],["fw","fumi"],["fw","kanshi"],["fw","radius"],["fw","ap"],["ap","bpc"],["net","bad"],["net","other"]],"route":[["ap","が trap で監視サーバに異常を知らせ、監視サーバが状態を問い合わせる",[["SNMP（Simple Network Management Protocol）","L7"],["UDP（User Datagram Protocol）","L4"]]],["cpc","が VPN 装置とつなぎ、端末の証明書と多要素認証で入る",[["TLS（Transport Layer Security）のクライアント証明書","L5〜6 相当"],["HTTPS（Hypertext Transfer Protocol Secure）","L7"],["OTP（One-Time Password）",""]]],["cpc","が踏み台サーバへ SSH（Secure Shell）でつなぎ、ホスト鍵（サーバが本物だと示す公開鍵）を確かめてから公開鍵認証で入る",[["SSH","L7"],["TCP（Transmission Control Protocol）","L4"]]],["fumi","が C さんに代わって RADIUS（Remote Authentication Dial In User Service）サーバへ SSH でつなぐ。署名は C さんの PC が作り、直した設定は踏み台から SFTP（SSH File Transfer Protocol）で送る",[["SSH Agent Forwarding","L7"],["SFTP","L7"]]],["bpc","が無線 AP に 802.1X でつなぐ。AP が RADIUS サーバに中継し、端末の証明書で認証する",[["IEEE 802.1X（EAP：Extensible Authentication Protocol）","L2"],["RADIUS","L7"],["WPA2／WPA3 Enterprise（WPA：Wi-Fi Protected Access）","L2"]]],["bad","が VPN 装置の脆弱性を突いて乗っ取り、ほかの組織への攻撃の中継拠点にする",[["HTTPS","L7"],["パケットフィルタ（FW：ファイアウォール）","L3〜4"]]]],"steps":[{"t":"① SNMP（機器の見張り）","star":["ap","機器の側（エージェント）は、v1・v2c だと平文で流れるコミュニティ名（既定値は public）だけで値を読ませてしまうので、v3 で利用者ごとに認証する（S07-4）"],"o":"夜、無線 AP が「RADIUS サーバに認証を頼んでも返事が来ない」という異常を、trap で監視サーバに知らせる。監視サーバは AP に値を問い合わせて状態を確かめ、C さんに知らせる。この会社の SNMP は v3 で、認証と暗号化の両方を使う段階（authPriv）にしてある。","legs":[[["ap","fw","kanshi"],"trap","異常を知らせる中","監視サーバ（UDP 162番）","SNMPv3 trap（UDP 162番宛て）","機器の側から「RADIUS サーバに認証を頼んでも、答えが来ない」と知らせる。trap は返事を待たない"],[["kanshi","fw","ap"],"GetRequest","状態を問い合わせる中","無線 AP（UDP 161番）","SNMPv3 GetRequest（UDP 161番宛て。利用者ごとの認証と暗号化）","「RADIUS への認証の要求の失敗の数は？」と値を聞く"],[["ap","fw","kanshi"],"Response","答えを返す中","監視サーバ","SNMPv3 Response（値を暗号化して返す）","値を見た監視サーバが、C さんにメールで知らせる（メールサーバは図では省いた）"]],"r":{"ap":"機器の側（エージェント）として、異常を trap で監視サーバへ送り、問い合わせに値を返す。v1・v2c はコミュニティ名を共有のパスワードとして平文で送り、既定値（読み取りは public）のままだと誰でも設定や状態を読める。v3 の authPriv（認証と暗号化）にして、問い合わせてよい管理側の IP（Internet Protocol）アドレスも絞る。","fw":"事務の LAN と管理のセグメントの境目。監視サーバから AP への UDP 161番と、AP から監視サーバへの UDP 162番だけを通す。trap は AP の側から始まる通信なので、問い合わせとその応答とは別に、許可の行が要る。","kanshi":"管理側（マネージャ）として、機器の UDP 161番に値を問い合わせ、UDP 162番で trap を受ける。異常を見つけたら、管理者にメールで知らせる。"},"cards":["S07-4"]},{"t":"② VPN（端末と利用者）","star":["vpn","インターネットから見える入口で、端末（クライアント証明書）と利用者（多要素認証）を分けて確かめる（S06-3・S03-3）"],"o":"C さんが家から、会社から渡されたノート PC で VPN 装置につなぐ。VPN 装置は、TLS（Transport Layer Security）のハンドシェイクでクライアント証明書を求めて端末を確かめ、続けてパスワードと OTP（One-Time Password）で利用者を確かめる。","legs":[[["cpc","net","vpn"],"ClientHello","VPN 装置とつなぎ始める中","VPN 装置（443番）","TLS ClientHello（SSL-VPN）","家の回線から、インターネットごしに会社の入口へ。TLS を使う VPN を SSL-VPN と呼ぶ（SSL は TLS の前の名前）"],[["vpn","net","cpc"],"証明書を見せて","端末の証明書を求められる中","C さんの PC","TLS ServerHello → CertificateRequest → Certificate・CertificateVerify・Finished（TLS 1.3 の順。VPN 装置が PC の証明書を求めてから、自分の証明書を出す。EncryptedExtensions は省いた）","VPN 装置が「そちらの証明書を見せて」と求め、続けて自分の証明書と署名を出す"],[["cpc","net","vpn"],"クライアント証明書＋署名","端末を確かめてもらう中","VPN 装置","TLS Certificate・CertificateVerify（秘密鍵で署名）・Finished","証明書は、会社の認証局（CA：Certification Authority）が業務用の端末にだけ発行したもの。秘密鍵は TPM（Trusted Platform Module）の外に出せない"],[["cpc","net","vpn"],"ID・パスワード・OTP","利用者を確かめてもらう中","VPN 装置","HTTPS（TLS の中で、ID・パスワードとスマホの認証アプリの OTP）","端末と利用者の両方が通り、VPN のトンネルができた。PC は VPN 用のアドレスをもらう"]],"r":{"cpc":"VPN 装置の証明書を、名前・チェーン・期限で確かめる。求められたらクライアント証明書を出し、TPM の中の秘密鍵で署名する。秘密鍵を書き出せないので、ファイルを写して別の端末で使うことはできない。","net":"経路の途中。ClientHello（接続先の名前を示す SNI：Server Name Indication を含む）と ServerHello は平文。TLS 1.3 では、そこから先の証明書・ID・パスワード・OTP は暗号文。","vpn":"インターネットから見える入口。CertificateRequest で端末に証明書を求め、会社の認証局までたどれるか・署名が正しいか・失効していないかを確かめる。次に ID・パスワードと OTP で利用者を確かめる。ID・パスワードだけだと、盗まれた認証情報でそのまま入られる。"},"cards":["S06-3","S03-3"]},{"t":"③ 踏み台へ SSH","star":["cpc","ホスト鍵を照らすのはクライアントの側で、known_hosts と違うという警告が出たら、別のサーバ（なりすまし・中間者）を疑い、管理者に正しいフィンガープリントを確かめる（S06-2）"],"o":"VPN のトンネルの中から、C さんは踏み台サーバへ SSH（Secure Shell）でつなぐ。VPN の側から FW が通すのは、VPN 用のアドレスから踏み台の22番だけ。C さんの PC は、踏み台のホスト鍵を、前につないだときに保存した鍵の一覧（known_hosts）と照らしてから、公開鍵認証で入る。","legs":[[["cpc","net","vpn","fw","fumi"],"SSH 接続","踏み台につなぐ中","踏み台サーバ（22番）","SSH（TCP 22番。VPN のトンネルの中）","VPN 装置がトンネルをほどいて社内へ流す。VPN の側から FW を通れるのは、踏み台の22番だけ"],[["fumi","fw","vpn","net","cpc"],"ホスト鍵","サーバの身元を受け取る中","C さんの PC","SSH の鍵交換（ホスト鍵と、その秘密鍵での署名）","PC が known_hosts に保存した鍵と照らす。初めてなら、ホスト鍵のフィンガープリント（鍵のハッシュ値）を、管理者から別の手段で知らされた値と照らしてから保存する"],[["cpc","net","vpn","fw","fumi"],"公開鍵認証の署名","利用者を確かめてもらう中","踏み台サーバ","SSH 公開鍵認証（手元の秘密鍵で署名）","踏み台は、登録してある C さんの公開鍵で署名を確かめる。パスワードは流れない"]],"r":{"cpc":"踏み台のホスト鍵を、known_hosts に保存した鍵と照らす。違えば警告が出る。それは、なりすましや中間者の、別のサーバにつないだことを疑う印。無視して進み、相手が偽のサーバだった場合は、操作の中身を偽のサーバに渡す。パスワード認証なら、パスワードも渡す。","net":"経路の途中。中身は VPN の暗号文。","vpn":"トンネルをほどいて、中の通信を社内へ流す。送信元は、② で配った VPN 用のアドレス（トンネル方式で、VPN 装置が送信元を変換しない設定の場合）。","fw":"VPN 用のアドレスから、踏み台の TCP 22番への通信だけを許可する。社内のほかのサーバへは、直接届かない。外からの入口を踏み台の1か所に絞るので、記録もそこでまとめて取れる。","fumi":"ホスト鍵の秘密鍵で鍵交換に署名し、本物の踏み台だと示す。C さんの署名を、登録してある公開鍵で確かめて入れる。誰が・いつ入ったかを記録する。"},"cards":["S06-2","S05-3"]},{"t":"④ 踏み台から RADIUS サーバへ","star":["fumi","社内のサーバへは必ず踏み台を通し、誰が・いつ・何をしたかをそこで記録する（S06-3）"],"o":"C さんは踏み台から、RADIUS サーバへ SSH でつなぐ。秘密鍵は、C さんの PC の SSH エージェント（秘密鍵を持ち、頼まれた署名だけを作るプログラム）に置いたまま。RADIUS サーバが求める署名は、踏み台が C さんの PC の SSH エージェントに頼んで作ってもらう（SSH Agent Forwarding）。直した設定のファイルは、FTP（File Transfer Protocol）ではなく、SSH の中を通る SFTP（SSH File Transfer Protocol）で、踏み台から送る。","legs":[[["fumi","fw","radius"],"SSH 接続","踏み台からサーバへつなぐ中","RADIUS サーバ（22番）","SSH（TCP 22番。送信元は踏み台）","FW は、RADIUS サーバの22番へは踏み台からの通信だけを通す。RADIUS サーバのホスト鍵は、踏み台の known_hosts と照らす"],[["fumi","fw","vpn","net","cpc"],"署名して","署名を頼まれる中","C さんの PC（SSH エージェント）","SSH Agent Forwarding（③ の SSH の接続の中を戻る）","RADIUS サーバに署名を求められた踏み台が、署名だけを C さんの PC の SSH エージェントに頼む。踏み台には秘密鍵を置かない"],[["cpc","net","vpn","fw","fumi","fw","radius"],"署名","署名を届ける中","RADIUS サーバ","SSH 公開鍵認証（署名は踏み台が中継）","RADIUS サーバは、登録してある C さんの公開鍵で確かめて入れる"],[["fumi","fw","radius"],"直した設定ファイル","設定を送る中","RADIUS サーバ","SFTP（SSH の中で送る。FTP は使わない）","C さんが踏み台に置いた設定を、踏み台から SFTP で送る（FTP なら ID・パスワードも中身も平文）。踏み台に操作の記録の仕組みを入れておけば、打ったコマンドと送ったファイルが残る"]],"r":{"fumi":"社内のサーバへの入口を1か所にする。操作の記録の仕組みを入れておけば、誰が・いつ・何をしたか（打ったコマンド・送ったファイル）をここで残せる。秘密鍵は置かず、署名は C さんの PC の SSH エージェントに頼む。ただし攻撃者に踏み台の管理者の権限を取られると、C さんがつないでいる間は、攻撃者もこの中継で C さんの PC に署名を作らせ、C さんとしてほかのサーバに入れる。OpenSSH は、より安全な代わりに ProxyJump（-J：踏み台は暗号のまま中継するだけ）を挙げる。その形だと、操作の中身は暗号のまま踏み台を通るので、踏み台では記録しにくい。","fw":"踏み台から RADIUS サーバの TCP 22番だけを許可する。VPN 用のアドレスから RADIUS サーバへは、直接届かない。FTP を通すなら、制御用の21番に加えて、データ用の接続（パッシブモードでは、サーバの高い番号のポート）も開ける必要がある。","radius":"ホスト鍵で本物のサーバだと示し、C さんの署名を、登録してある公開鍵で確かめる。直した設定は SFTP で受け取る。SSH の中を通るので、認証の情報もファイルの中身も暗号化される。","vpn":"③ の SSH の通信を、トンネルに入れて C さんの PC との間で運ぶ。","net":"経路の途中。中身は VPN の暗号文。","cpc":"SSH エージェントが、手元の秘密鍵で署名だけを作って返す。秘密鍵そのものは PC の外に出ない。"},"cards":["S06-3","S06-2","S07-4"]},{"t":"⑤ 無線 LAN（802.1X）","star":["ap","認証が通るまで EAP 以外を通さず、RADIUS サーバと話すのは端末ではなく AP 自身（S06-1）"],"o":"RADIUS サーバは、④ で C さんが直した設定で動いている。翌朝、社員の B さんが、会社の PC を社内の無線 LAN につなぐ。無線 AP は、つなぐ前の認証（IEEE 802.1X）のための EAP（Extensible Authentication Protocol）だけを通し、RADIUS サーバに中継する。この会社は、端末の証明書で確かめる EAP-TLS を使う。","legs":[[["bpc","ap","fw","radius"],"名乗る（EAP）","無線 LAN に入ろうとする中","RADIUS サーバ（UDP 1812番）","EAPOL（EAP over LAN）→ AP が RADIUS Access-Request に入れて中継","PC（サプリカント）が名乗り出る。AP（オーセンティケータ）は自分では判定せず、RADIUS サーバに回す"],[["radius","fw","ap","bpc"],"サーバ証明書","サーバの証明書を確かめる中","B さんの PC","EAP-TLS（Start → PC の ClientHello → ServerHello・Certificate・CertificateRequest。RADIUS Access-Challenge → EAPOL）","RADIUS サーバが自分の証明書を出し、PC の証明書を求める（TLS 1.2 の順。② の TLS 1.3 では、求めるのが先）。PC はサーバの証明書を確かめる"],[["bpc","ap","fw","radius"],"クライアント証明書＋署名","端末を確かめてもらう中","RADIUS サーバ","EAP-TLS（Certificate・CertificateVerify）","会社の認証局が発行した証明書と、取り出せない秘密鍵での署名を返す"],[["radius","fw","ap","bpc"],"通ってよし","つなぐ許可を受け取り、AP と鍵を作る中","B さんの PC","RADIUS Access-Accept → EAP-Success、4ウェイハンドシェイク（WPA2／WPA3 Enterprise。WPA：Wi-Fi Protected Access）","RADIUS サーバが鍵のもとを AP に渡し、AP と PC が無線の暗号鍵を作る。ここから DHCP（Dynamic Host Configuration Protocol）の通信が通る"]],"r":{"bpc":"サプリカントとして EAP で名乗る。RADIUS サーバの証明書を確かめ、自分のクライアント証明書を出して、取り出せない秘密鍵で署名する。認証が通るまでは、DHCP（Dynamic Host Configuration Protocol）で IP アドレスももらえない。","ap":"オーセンティケータとして、認証が通るまで EAP 以外の通信を止める。EAP を RADIUS に入れてサーバへ中継する。Access-Accept と鍵のもとが来たら、PC と4ウェイハンドシェイクで無線の暗号鍵を作り、それから通信を通す。MAC（Media Access Control）アドレス認証だけなら、攻撃者が電波から正規の端末の MAC アドレスを拾い、自分の端末をその値に書き換えれば通ってしまう。","fw":"事務の LAN の AP から RADIUS サーバへは、UDP 1812番だけを許可する。","radius":"認証サーバとして、PC の証明書が会社の認証局までたどれるか、署名が正しいか、失効していないかを確かめる。通れば Access-Accept と、無線の暗号化に使う鍵のもとを AP に返す。④ で C さんが直した設定で動いている。"},"cards":["S06-1","S03-3"]},{"t":"⑥ VPN 装置をねらう攻撃","star":["vpn","乗っ取られた VPN 装置は、社内に被害が無くても、ほかの組織への攻撃の中継拠点（ORB）にされる（S06-3）"],"o":"攻撃者が、パッチの当たっていない VPN 装置の脆弱性を突いて乗っ取る。VPN 装置そのものから社内のサーバへの通信は、FW のルールに無いので止まる。ただし装置を通る ID・パスワードを盗まれ、VPN 用のアドレスで踏み台の22番に届かれるおそれは残る（踏み台は公開鍵認証で、秘密鍵は C さんの PC にしか無い）。攻撃者は装置を、ほかの組織を攻撃する中継拠点（ORB：Operational Relay Box）にも使う。","legs":[[["bad","net","vpn"],"細工した要求","VPN 装置をねらう中","VPN 装置（443番）","HTTPS（パッチの当たっていない脆弱性を突く要求）","インターネットから見える入口なので、探せば見つかる。脆弱性を突いて、装置を乗っ取る"],[["vpn","fw"],"社内へ","社内のサーバに届こうとする中","RADIUS サーバ","TCP（VPN 装置から社内のサーバへ）","FW のルールに無いので止まる（セグメントを分け、間の通信を最小にしてある）。ただし VPN 用のアドレスを名乗れば、踏み台の22番には届くおそれがある"],[["bad","net","vpn","net","other"],"攻撃の中継","ほかの組織を攻撃する中","ほかの組織のサーバ","攻撃者 → 乗っ取った VPN 装置 → ほかの組織のサーバ（ORB）","ほかの組織のサーバから見える送信元は、この会社の VPN 装置のアドレス。攻撃者のアドレスは見えない"]],"r":{"bad":"インターネットから、パッチの当たっていない VPN 装置を探して、脆弱性を突く。乗っ取った装置を経由して、ほかの組織へ攻撃を送る。","net":"経路の途中。","vpn":"インターネットから見える境界の機器なので、脆弱性が公表されると、すぐに悪用されることがある。乗っ取られると、装置を通る ID・パスワードを盗まれるおそれがある。社内に被害が無くても、ほかの組織への攻撃の中継拠点にされる。パッチをすぐ当て、通信を見張る（可視化・監視の強化）。この会社の作りは境界での防御。アクセスのたびに利用者と端末を確かめ直すのが、ゼロトラストの考え方。","fw":"VPN 装置から社内のセグメントへの直接の通信は、ルールに無いので止める。VPN の側から通すのは、VPN 用のアドレスから踏み台の22番だけ。入口を乗っ取られても、奥への通り道は限られる。ただし攻撃者が VPN 用のアドレスを名乗ると、踏み台の22番には届くおそれがある。","other":"攻撃を受ける。見える送信元は、この会社の VPN 装置のアドレス。攻撃者のアドレスは見えない。"},"cards":["S06-3","S05-3"]}]},{"group":"1","scene":"4","title":"攻撃者が名前・回線・証明書をねらう（DNS の悪用・サイトを止める DDoS・偽の証明書）","goal":"攻撃者がねらう3つ（A さんの PC からの情報の持ち出し ①〜③、会社の Web サイトを止める大量の通信 ④⑤、偽の証明書を使った偽のサイト ⑥⑦）を、守る側がそれぞれ見つけて止める","focus":"どの仕組みが、どの区間を守り、どこで見つけて、どこで止めるか。DNSSEC（DNS Security Extensions）は応答の改ざんを見つけ、DoT（DNS over TLS）・DoH（DNS over HTTPS）はふつうの使い方では PC との間を暗号化し、DNS を悪用する通信はキャッシュ DNS のログで見つけて名前で止める。DDoS（Distributed Denial of Service）は、回線の手前の CDN（Content Delivery Network）・DDoS 対策サービスで吸収する。偽の証明書は CT（Certificate Transparency）のログで見つけて認証局（CA：Certification Authority）に失効させ、失効は OCSP（Online Certificate Status Protocol）か CRL（Certificate Revocation List）で確かめる","example":"月曜の朝、社員の A さんが、取引先から届いた注文を確かめるため、取引先のサイト www.example.jp を開く。A さんの PC には先週開いた添付ファイルからマルウェアが入っている。マルウェアは攻撃者の C&C（Command and Control）サーバ c2.attacker.example から命令を受けながら、社内の情報を外へ持ち出そうとしているが、まだ誰も気づいていない。同じ週、攻撃者は会社の Web サイト www.example.com を大量の通信で止めようとし、さらに www.example.com の偽の証明書を手に入れて、偽のサイトへ人を呼び込もうとする。守る側の備えは4つ。キャッシュ DNS は DNSSEC の検証をし、社内の PC とは DoT で話す。FW（ファイアウォール）は社内の PC から外への DNS（53番）を止め、Web（80・443番）は通す。Web サイトは CDN を通して公開している。情報システム部の管理者は、キャッシュ DNS のログと、自社の名前で出る証明書を見張っている","note":"example.jp・example.com・attacker.example と、203.0.113.10・198.51.100.7・198.51.100.8 は、説明用に取っておかれた名前とアドレス（実在しない）","zones":[[6,6,226,272,"#EEEDFE","社内 LAN","#3C3489"],[150,286,226,90,"#FAEEDA","DMZ","#633806"],[236,4,326,108,"#E1F5EE","社外のサーバ","#085041"],[566,4,110,216,"#FAECE7","攻撃者の手元","#712B13"],[480,246,196,130,"#F1EFE8","悪用される機器","#444441"]],"nodes":{"pc":{"x":50,"y":60,"label":"A さんの PC","type":"pc"},"adm":{"x":50,"y":170,"label":"管理者","type":"user"},"sw":{"x":160,"y":120,"label":"スイッチ","type":"sw"},"sink":{"x":160,"y":230,"label":"シンクホール","type":"srv"},"fw":{"x":265,"y":170,"label":"FW","type":"fw"},"dns":{"x":215,"y":320,"label":"キャッシュ DNS","type":"srv"},"web":{"x":320,"y":320,"label":"Web（オリジン）","type":"srv"},"net":{"x":400,"y":190,"label":"インターネット","type":"net"},"adns":{"x":290,"y":55,"label":"取引先の権威 DNS","type":"srv"},"ca":{"x":400,"y":55,"label":"認証局（CA）","type":"srv"},"ct":{"x":510,"y":55,"label":"CT ログ","type":"db"},"badns":{"x":620,"y":55,"label":"攻撃者の権威 DNS","type":"srv"},"bad":{"x":630,"y":160,"label":"攻撃者","type":"bad"},"bot":{"x":635,"y":270,"label":"ボットネット","type":"pc"},"open":{"x":530,"y":330,"label":"オープンリゾルバ","type":"srv"},"cdn":{"x":420,"y":330,"label":"CDN","type":"srv"}},"edges":[["pc","sw"],["adm","sw"],["sink","sw"],["sw","fw"],["fw","dns"],["fw","web"],["fw","net"],["net","adns"],["net","ca"],["net","ct"],["net","badns"],["net","bad"],["bad","badns"],["net","bot"],["net","open"],["net","cdn"]],"route":[["dns","が PC からの問い合わせを DoT（DNS over TLS）で受け、権威 DNS の答えの署名を確かめる",[["DNS","L7"],["TLS（Transport Layer Security。DoT）","L5〜6 相当"],["DNSSEC（DNS Security Extensions）","L7"]]],["pc","で、マルウェアがデータを名前に入れて問い合わせ、キャッシュ DNS が攻撃者の権威 DNS へ中継する",[["DNS","L7"],["DNS トンネリング","L7"]]],["adm","がキャッシュ DNS のログで DNS トンネリングを見つけ、attacker.example の下の名前を、自分で用意したサーバ（シンクホール）に向ける（IP アドレスではなく名前で止める）",[["DNS","L7"],["WHOIS（ドメイン名の登録情報を調べる）","L7"],["DNS シンクホール","L7"]]],["bot","（攻撃者が操る、乗っ取られた多数の機器）が送信元を www.example.com の IP アドレスに偽り、外からの問い合わせにも答える DNS サーバ（オープンリゾルバ）に問い合わせて、大きな応答を www.example.com へ集める。CDN（Content Delivery Network）が回線の手前で吸収する",[["IP（送信元の偽装）","L3"],["UDP","L4"],["DNS リフレクション","L7"]]],["bot","が正しい形の GET を大量に送る。CDN が分散して受け、会社の本来の Web サーバ（オリジン）は CDN からの通信だけを受ける",[["HTTPS","L7"],["CDN","L7"]]],["bad","が認証局（CA：Certification Authority）をだまして証明書を手に入れる。CT（Certificate Transparency）ログに載った発行を、管理者が見つける",[["CT","L7"]]],["pc","が証明書の失効を OCSP（Online Certificate Status Protocol）か CRL（Certificate Revocation List）で確かめ、失効していれば接続を止める",[["TLS","L5〜6 相当"],["OCSP","L7"],["CRL",""]]]],"steps":[{"t":"① DoT と DNSSEC","star":["dns","署名を確かめるのはキャッシュ DNS で、DoT・DoH が守る区間（ふつうの使い方では PC との間）とは違う（S01-4）"],"o":"まず、ふだんの名前解決。A さんが取引先のサイトを開く。PC とキャッシュ DNS の間は DoT で暗号化し、キャッシュ DNS は権威 DNS の答えを DNSSEC の署名で確かめる。","legs":[[["pc","sw","fw","dns"],"A は？（暗号）","名前を引いてもらう中","キャッシュ DNS","DoT（TCP 853番）で再帰的クエリ","「www.example.jp の A レコードは？」。PC とキャッシュ DNS の間は TLS で暗号化される"],[["dns","fw","net","adns"],"A は？","外へ聞きに行く中","権威 DNS（example.jp）","DNS 非再帰的クエリ（UDP 53番。署名も求める）","ここから先は、ふつうの DNS。暗号化はされない（ルート → jp → example.jp とたどる。図は最後の1回だけ）"],[["adns","net","fw","dns"],"A＋署名","署名付きの答えを持ち帰る中","キャッシュ DNS","DNS 応答：A レコードと、その署名（RRSIG：Resource Record Signature）。鍵の DNSKEY もここで引く。DS（Delegation Signer）は先に jp の権威 DNS から受け取っている","RRSIG を DNSKEY で、DNSKEY を親の jp の DS で確かめ、ルートまで信頼をたどる。途中で書き換えられていれば、ここで分かる"],[["dns","fw","sw","pc"],"203.0.113.10（暗号）","確かめた答えを渡す中","A さんの PC","DoT の応答","署名のあるゾーンでは、検証に通った答えだけを返す（署名の無いゾーンの答えは、確かめずに返す）。DNSSEC は中身を隠さないので、暗号化は DoT の役目"]],"r":{"pc":"スタブリゾルバ（自分では名前を調べず、キャッシュ DNS に頼む側）として、社内のキャッシュ DNS に DoT で聞く。LAN の上で、問い合わせと答えを盗み見られたり書き換えられたりしない。PC から外への 443番は通るので、ブラウザが社外の DoH サーバを直接使う設定だと、社内のキャッシュ DNS のログと、悪い名前の遮断を通らない。","sw":"MAC アドレスを見て転送するだけ。DoT なので、中身は暗号文。","fw":"LAN から DMZ のキャッシュ DNS への DoT（853番）と、キャッシュ DNS から外への DNS（53番）を通す。PC から外への DNS は通さない。","dns":"フルサービスリゾルバ。PC とは DoT、権威 DNS とは平文の DNS で話す。RRSIG から DNSKEY・DS をたどってルートの鍵（トラストアンカー）まで確かめ、通らない応答は捨てて PC に SERVFAIL を返す。ルートの鍵は、あらかじめ設定してあり、ルートの鍵が替わったら更新する。","net":"経路の途中。キャッシュ DNS と権威 DNS の間は平文なので、中身は読める。書き換えれば、署名の検証で見つかる。","adns":"example.jp のゾーンを持つ。A レコードに署名（RRSIG）を付けて返し、署名を確かめる公開鍵（DNSKEY）も置く。その鍵のハッシュ（DS）は親の jp のゾーンに載っていて、jp の鍵で署名されている。"},"cards":["S01-4"]},{"t":"② DNS トンネリング","star":["dns","社内の PC の問い合わせを攻撃者の権威 DNS まで中継してしまう立場で、誰が何を引いたかの記録もここに残る（S01-5）"],"o":"A さんの PC のマルウェアが、盗んだデータを名前に入れて問い合わせる。社内のキャッシュ DNS がそれを攻撃者の権威 DNS へ中継し、応答の TXT レコードで命令が返ってくる（DNS トンネリング）。① の DoT と DNSSEC は盗み見と書き換えへの備えで、名前にデータを入れる使い方は止めない。","legs":[[["pc","sw","fw","dns"],"データ入りの名前","名前に入れて送り出し中","キャッシュ DNS","DNS 再帰的クエリ（DoT の中で。TXT。k7f2q9x4m1.attacker.example など）","盗んだデータを小さく分けて符号化し、名前の前の方に入れる。名前は長く、文字は不規則"],[["dns","fw","net","badns"],"データ入りの名前","外へ中継中","攻撃者の権威 DNS（attacker.example）","DNS 非再帰的クエリ（UDP 53番）","毎回ちがう名前なのでキャッシュに無く、毎回、攻撃者の権威 DNS まで届く"],[["badns","net","fw","dns"],"TXT：命令","命令を持ち帰る中","キャッシュ DNS","DNS 応答（TXT レコードに命令）","攻撃者は名前からデータを取り出し、答えに次の命令を入れる"],[["dns","fw","sw","pc"],"TXT：命令","命令を渡す中","A さんの PC","DoT の応答（TXT レコードに命令）","DNS の中だけで、情報が出て、命令が入った"]],"r":{"pc":"マルウェアが、盗んだデータを分けて符号化し、名前に入れて問い合わせる。PC から外への DNS は FW が止めているので、社内のキャッシュ DNS に頼む。","sw":"MAC アドレスを見て転送するだけ。","fw":"PC から外への DNS は止めるが、キャッシュ DNS から外への DNS（53番）は通す。名前の中にデータが入っていても、FW には普通の DNS に見える。","dns":"いつもの名前解決と同じように、attacker.example の権威 DNS に聞きに行き、答えを PC に返す。時刻・問い合わせ元・名前・種類がログに残る。","net":"経路の途中。","badns":"攻撃者が持つ attacker.example の権威 DNS。届いた名前からデータを取り出して攻撃者に渡し、TXT レコードに命令を入れて返す。このゾーンの A レコードも、攻撃者が自由に書き換えられる。"},"cards":["S01-5"]},{"t":"③ 見つけて止める","star":["sink","名前で止めるので、攻撃者が IP アドレスを替えても効き、ここにつないできた端末がそのまま感染端末の一覧になる（S01-5）"],"o":"マルウェアは DNS トンネリングとは別に、c2.attacker.example を引いて、C&C サーバに 443番でもつないでいる。管理者はキャッシュ DNS のログで異常に気づき、まず C&C サーバの IP アドレスを FW で止めるが、攻撃者は A レコードを付け替えて逃げる。そこで attacker.example の下の名前には、管理者が用意したサーバ（シンクホール）の IP アドレスを返すようにし（DNS シンクホール）、つないできた端末を感染した端末と見分ける。","legs":[[["dns","fw","sw","adm"],"ログ","記録を見せる中","管理者","キャッシュ DNS のログ（時刻・問い合わせ元・名前・種類）","A さんの PC から attacker.example への、長く不規則な名前の問い合わせが大量。管理者は、まず C&C サーバの IP アドレスを FW で止める"],[["bad","badns"],"A を付け替え","接続先を替え中","攻撃者の権威 DNS","ゾーンの書き換え（c2.attacker.example の A：198.51.100.7 → 198.51.100.8）","管理者が FW に入れた IP アドレスの遮断は、これで古くなる"],[["dns","fw","sw","pc"],"シンクホールの IP","用意した答えを返す中","A さんの PC","DoT の応答（c2.attacker.example の A＝シンクホールの IP アドレス）","attacker.example の下の名前は、攻撃者の権威 DNS に聞かずに答える。トンネリングの問い合わせも、もう攻撃者に届かない"],[["pc","sw","sink"],"つなぎに来た","C&C サーバのつもりでつなぎ中","シンクホール","TCP SYN（443番）","つないできた送信元の IP アドレスで、感染した端末が分かる"]],"r":{"dns":"ログに、時刻・問い合わせ元・名前・種類が残る。管理者の設定で、attacker.example の下の名前には、攻撃者の権威 DNS に聞かずにシンクホールの IP アドレスを返す。","fw":"キャッシュ DNS から社内への通信を通す。管理者が先に入れた C&C サーバの IP アドレスの遮断は、A レコードを付け替えられると効かなくなる。","sw":"MAC アドレスを見て転送するだけ。シンクホールへの接続は社内で終わり、FW を通らない。","adm":"ログで、同じドメインへの大量の問い合わせと、長く不規則なサブドメインを見つける。WHOIS（ドメイン名や IP アドレスの登録情報を調べるプロトコル。.com などの gTLD では後継の RDAP：Registration Data Access Protocol）で attacker.example の登録者と登録日を調べると、数日前に登録されたばかり。止めるのは、IP アドレスではなく名前にする。","bad":"攻撃者の権威 DNS で、C&C サーバの名前（c2.attacker.example）の A レコードを書き換え、接続先の IP アドレスを次々に替える。","badns":"c2.attacker.example の A レコードが新しい IP アドレスに変わる。シンクホールを設定したあとは、社内からの問い合わせがここまで届かない。","pc":"マルウェアが c2.attacker.example を引き、返ってきたシンクホールの IP アドレスにつなぎに行く。IP アドレスを直接使って通信するマルウェアには、DNS シンクホールは効かない。","sink":"管理者が用意したサーバ。つないできた端末の送信元 IP アドレスと時刻を記録し、それが感染した端末の一覧になる。"},"cards":["S01-5"]},{"t":"④ DNS リフレクション","star":["open","外からの再帰的な問い合わせに答える DNS は、DDoS の踏み台（攻撃の中継に悪用される機器）になる（S20-1）"],"o":"攻撃者の命令で、ボットネットが送信元を www.example.com の IP アドレスに偽り、多数のオープンリゾルバに問い合わせる。大きな応答が全部その IP アドレスに届くが、その IP アドレスは CDN のものなので、回線の手前で吸収される。","legs":[[["bad","net","bot"],"攻撃の命令","ボットネットに命令中","ボットネット","C&C の命令（標的と時刻）","標的は www.example.com"],[["bot","net","open"],"問い合わせ（偽の送信元）","送信元を偽って問い合わせ中","オープンリゾルバ（多数）","DNS クエリ（UDP 53番。送信元 IP アドレス＝www.example.com の IP アドレス）","UDP は接続をつくらないので、DNS サーバは送信元を確かめず、偽りの送信元へ応答を返す"],[["open","net","cdn"],"大きな応答","標的へ集まる中","CDN（www.example.com の IP アドレス）","DNS 応答（問い合わせより大きい）","多数のオープンリゾルバの応答が全部標的に届き、量が増える。CDN が分散した多数のサーバで受ける"],[["bot","net","fw"],"外から再帰的クエリ","会社の DNS も使えるか試し中","会社のキャッシュ DNS","DNS 再帰的クエリ（外から、UDP 53番）","FW が通さない。キャッシュ DNS も社内からの問い合わせにしか答えないので、自社は踏み台（攻撃の中継に悪用される機器）にならない（図は FW まで）"]],"r":{"bad":"ボットネットに命令を出すだけ。標的からは、攻撃者の IP アドレスは見えない。自分でボットネットを持たなくても、攻撃を代行するサービスに頼めば同じことができる。","net":"経路の途中。送信元を確かめるフィルタ（BCP 38）の無い経路では、送信元を偽ったパケットも、そのまま運ばれる。","bot":"乗っ取られた IoT（Internet of Things）機器や PC の集まり。命令を受けると、送信元 IP アドレスを標的のものに偽って、多数の DNS サーバに問い合わせる。","open":"外からの再帰的な問い合わせにも答える DNS サーバ（オープンリゾルバ）。送信元が偽りだと知らずに、問い合わせより大きい応答をそこへ返す。標的から見ると、攻撃元はこのサーバたちに見える。NTP（Network Time Protocol）サーバも同じ形で使われる。","cdn":"www.example.com の IP アドレスは CDN のもの。応答の山を、会社の回線の手前で、分散した多数のサーバで受けて吸収する。会社の回線とオリジンには届かない。CDN が受けるのは、CDN の IP アドレスあての通信。会社の IP アドレスを直接狙われた場合は、ISP（Internet Service Provider）や DDoS 対策サービスで吸収する。","fw":"外からキャッシュ DNS への問い合わせは、ルールで通さない。"},"cards":["S20-1"]},{"t":"⑤ HTTP GET フラッド","star":["cdn","回線の手前で、分散した多数のサーバがオリジンの代わりに答える（S20-1）"],"o":"ボットネットが www.example.com に、正しい形の GET を大量に送る（HTTP GET フラッド）。CDN が分散した多数のサーバで受けてキャッシュから答え、オリジンは CDN からの通信だけを受ける。","legs":[[["bot","net","cdn"],"GET /（大量）","正しい形の要求を大量に送り中","CDN（www.example.com）","HTTPS（GET / を大量に）","1件ずつは普通の要求。FW のルールでは区別できない"],[["cdn","net","fw","web"],"キャッシュに無い分","オリジンへ取りに行く中","会社の Web サーバ（オリジン）","HTTPS（CDN からオリジンへ）","同じ URL なら、ほとんどはキャッシュから CDN が答える。毎回ちがうクエリ文字列を付けられると、オリジンまで届く"],[["bot","net","fw"],"オリジンへ直接","CDN を通さずに狙い中","会社の Web サーバ（オリジン）","HTTPS（オリジンの IP アドレスへ直接）","FW が CDN 以外からの通信を落とす。回線を超える量なら FW では止められないので、オリジンの IP アドレスを知られないようにする（図は FW まで）"]],"r":{"bot":"1台ずつは少なくても、数が多いので合わせると大量になる。オリジンの IP アドレスを知ると、CDN を通さずに直接狙う。","net":"経路の途中。","cdn":"利用者が www.example.com を引くと、近くのキャッシュサーバ（エッジサーバ）の IP アドレスが返る。そのサーバがオリジンの代わりに答え、大量の要求も分散した多数のサーバで受ける。多くのサイトが同じ IP アドレスを共有するので、IP アドレスだけでは1つのサイトを指せない。","fw":"オリジンへは CDN からの通信だけを通す。HTTP GET フラッドは正しい形の要求なので、FW のルールでは普通の通信と区別できない。会社の回線より多い量が来ると、FW や WAF（Web Application Firewall）の手前で回線が埋まり、自社の機器では止められない。","web":"CDN から来る、キャッシュに無い分の要求にだけ答える。同じ URL への要求なら、処理の量が抑えられる。"},"cards":["S20-1"]},{"t":"⑥ 偽の証明書と CT","star":["ct","攻撃者に出た証明書もログに載るので、ドメインの持ち主が見張れば、知らない発行を見つけられる（S03-2）"],"o":"攻撃者が CA をだまして、www.example.com の証明書を手に入れる。CA は発行する証明書を CT ログに載せるので、ログを見張っていた管理者が、頼んでいない発行に気づく。","legs":[[["bad","net","ca"],"証明書の申請","証明書を申し込み中","認証局（CA）","CSR（Certificate Signing Request）：攻撃者の公開鍵と www.example.com","CA がドメインの確認をだまされると、他人のドメインの証明書が出てしまう"],[["ca","net","ct"],"発行の記録","公開のログに載せ中","CT ログ","CT ログへの登録 → SCT（Signed Certificate Timestamp）が返る","主なブラウザは、公的な CA が出した証明書に SCT が無いと受け入れない。だから攻撃者に出す証明書も、ログに載る"],[["ca","net","bad"],"証明書（SCT 付き）","証明書を渡す中","攻撃者","発行された証明書（www.example.com）","名前・チェーン・期限の検証は、本物と同じように通る"],[["ct","net","fw","sw","adm"],"知らない発行","見張りの結果が届く中","管理者","HTTPS（CT ログの記録を番号の順に取り出し、example.com の名前のものを手元で絞る）","自社も、使っている CDN も頼んでいない www.example.com の証明書が、きのう出ている"]],"r":{"bad":"自分で作った鍵の組で、www.example.com の証明書を申し込む。手に入れた証明書は、名前・チェーン・期限の検証を全部通る。","net":"経路の途中。","ca":"ドメインの確認をだまされ、他人のドメインの証明書を出してしまう。発行する証明書を CT ログに載せ、返ってきた SCT を付けて渡す。","ct":"追記しかできない公開のログ。載った記録はあとから消せず、誰でも取り出して調べられる。登録を受けると SCT を返す。","fw":"管理者の PC から外への HTTPS なので通す。","sw":"MAC アドレスを見て転送するだけ。","adm":"example.com の名前で出た証明書を、CT ログで見張っている。自社と、使っている CDN が申し込んだ覚えの無い発行を見つけたら、CA に知らせて失効を頼む。"},"cards":["S03-2"]},{"t":"⑦ 失効を確かめる","star":["pc","失効は署名と期限の検証とは別の手順で、発行元が出す失効の情報（CRL・OCSP）を見ないと分からない（S03-2）"],"o":"管理者が CA に失効を頼み、CA が証明書を失効させる。そのあと A さんが自社のサイト www.example.com を開こうとして、攻撃者のサーバ（偽の www.example.com）につながる（どう誘導されたかは、この場面では扱わない）。A さんの PC は OCSP で確かめる設定なので、CA に状態を聞き、revoked と返ってきたので接続を止める。","legs":[[["adm","sw","fw","net","ca"],"失効して","失効を頼み中","認証局（CA）","失効の依頼（CA の手続き）","CA は証明書を失効させ、CRL に載せる。OCSP を出している CA なら、OCSP でも revoked と答える"],[["bad","net","fw","sw","pc"],"偽の証明書","偽のサイトが証明書を出し中","A さんの PC","TLS ServerHello・Certificate（偽の www.example.com から）","攻撃者のサーバ（偽の www.example.com）が、手に入れた証明書を出す。名前・チェーン・期限は合っている"],[["pc","sw","fw","net","ca"],"失効してる？","証明書の状態を聞き中","認証局（CA）の OCSP レスポンダ","OCSP 要求（HTTP。発行者とシリアル番号で証明書を指す）","署名と期限の検証とは別に、発行元に聞く"],[["ca","net","fw","sw","pc"],"revoked","状態を受け取る中","A さんの PC","OCSP 応答（revoked。CA か、CA が指名したレスポンダの署名付き）","失効していると分かったので、接続を止める。答えは good・revoked・unknown のどれか"]],"r":{"adm":"CA に失効を頼む。自社の証明書の秘密鍵が漏れたときも、同じ手続きで失効させる。","sw":"MAC アドレスを見て転送するだけ。","fw":"社内から外への HTTP・HTTPS なので通す。届いた証明書が偽物かどうかは、FW には分からない。","net":"経路の途中。","ca":"失効させた証明書を、CA が署名した失効の一覧（CRL）に載せ、OCSP の問い合わせには1枚ずつ状態を答える。OCSP ステープリングでは、サーバが自分の証明書の OCSP の応答を添えて渡す。","bad":"偽の www.example.com を立て、手に入れた証明書を出す。失効を確かめない利用者には、期限まで本物に見える。","pc":"名前・チェーン・期限の検証は通る。そのうえで OCSP で状態を聞くか CRL を取りに行き、失効が分かれば接続を止める。今の主なブラウザは、接続のたびには CA に聞かず、ブラウザの作り手が CA の CRL を集めて配る一覧で確かめる。OCSP の答えが返らないと、そのままつなぐ実装もある。"},"cards":["S03-2"]}]},{"group":"2","scene":"5","title":"通販サイトにログインして、配送先を変える（セッション・Cookie・認可・CSRF など）","goal":"A さんの注文と配送先は、A さん本人の操作でだけ見えて、変えられる（注文の番号を書き換えた他人にも、罠のサイトにも渡らない）。セッション ID を盗まれると A さんとして通ってしまうので、ログアウトでサーバ側のセッションを消して止める","focus":"通販サイト・A さんのブラウザ・攻撃者の立場で見る。誰かを見分けるのはセッション ID、何をしてよいかを決めるのはサーバの認可、別のオリジンに中身を読ませないのはブラウザ。罠のサイトが、A さんのブラウザから通販サイトへ勝手に送らせる CSRF（Cross-Site Request Forgery）は、ページに埋めたトークンで止める。セッション ID そのものを盗まれると、認可もトークンも A さんとして通る","example":"休みの日、A さんは通販サイト（https://shop.example.jp）で、カートに入れておいた母への贈り物を買う前に、配送先を実家に変えようとしている。ログインして、前の注文で実家の住所を確かめてから変える。その途中で、SNS（Social Networking Service）に流れてきた「セール情報」のリンクを、別のタブで開いてしまった。そこは攻撃者が置いた罠のサイト（https://sale.example.com）だった。攻撃者は、自分もこの通販サイトの会員になり、注文の番号を書き換えて他人の注文をのぞけないか試している。A さんのセッション ID を盗んで、A さんになりすますこともねらう","note":"shop.example.jp と sale.example.com は、説明用に取っておかれた名前（実在のサイトではない）。注文の番号も説明用","zones":[[16,40,230,300,"#EEEDFE","A さんの手元","#3C3489"],[280,176,104,104,"#E6F1FB","",""],[430,16,246,150,"#E1F5EE","通販サイト（shop.example.jp）","#085041"],[430,184,246,186,"#FAECE7","攻撃者の手元","#712B13"]],"nodes":{"user":{"x":70,"y":120,"label":"A さん","type":"user","labelPos":"above"},"pc":{"x":160,"y":220,"label":"A さんのブラウザ","type":"pc"},"net":{"x":330,"y":220,"label":"インターネット","type":"net"},"web":{"x":490,"y":105,"label":"通販サイト","type":"srv","labelPos":"above"},"db":{"x":610,"y":105,"label":"会員・注文の DB","type":"db"},"trap":{"x":500,"y":300,"label":"罠のサイト","type":"srv"},"bad":{"x":610,"y":240,"label":"攻撃者","type":"bad"}},"edges":[["user","pc"],["pc","net"],["net","web"],["web","db"],["net","trap"],["net","bad"],["trap","bad"]],"route":[["user","が ID とパスワードでログインする。通販サイトがログイン前のセッション ID を捨てて新しく作り、HttpOnly（スクリプトから読ませない）などを付けた Cookie で渡す",[["HTTPS","L7"],["Set-Cookie","L7"]]],["web","が、ログイン中の利用者と注文の持ち主を毎回照らす。注文の番号を書き換えた攻撃者には見せない",[["HTTPS","L7"],["アクセス制御（認可）",""]]],["web","が変更の画面に CSRF（Cross-Site Request Forgery）対策用トークンを埋め、送られたトークンを、セッションに持っておいたトークンと照らしてから書き換える",[["HTTPS","L7"],["CSRF 対策用トークン",""]]],["pc","で、罠のページのスクリプトが通販サイトの注文履歴を取りに行く。オリジン（スキーム・ホスト・ポートの組）が違うので、ブラウザが中身をスクリプトに渡さない",[["HTTPS","L7"],["同一オリジンポリシ",""],["CORS（Cross-Origin Resource Sharing）","L7"]]],["pc","が、罠のページに仕込んだフォームで配送先の変更を送らされる。SameSite=Lax の Cookie は付かず、トークンも無いので、通販サイトが断る",[["HTTPS","L7"],["CSRF 対策用トークン",""],["SameSite","L7"]]],["bad","が盗んだセッション ID で A さんになりすます。A さんがログアウトしてサーバ側のセッションが消えると、そのセッション ID は使えなくなる",[["HTTPS","L7"],["Cookie","L7"]]]],"steps":[{"t":"① ログイン","star":["web","ログインのときにセッション ID を作り直さないと、攻撃者が先に A さんに使わせたセッション ID が、そのままログイン後のセッション ID になる（セッション固定。S08-2）"],"o":"A さんはログインの前から、カート用のセッション ID を Cookie で持っている。ID とパスワードでログインすると、通販サイトは DB（データベース）の会員情報と照らし、ログイン前のセッション ID を無効にして、新しいセッション ID を作る。新しいセッション ID は、HttpOnly（スクリプトから読ませない）・Secure（HTTPS のときだけ送る）・SameSite=Lax（別のサイトから始まった POST には付けない）を付けた Cookie で渡す。","legs":[[["user","pc","net","web","db"],"ID・パスワード","ログインする中","通販サイト → 会員・注文の DB","HTTPS POST /login（ID・パスワード。Cookie にはログイン前のセッション ID）","「配送先を実家に変えてから買うので、ログインします」"],[["web","net","pc"],"新しいセッション ID","ログイン済みの印を受け取る中","A さんのブラウザ","HTTP Set-Cookie: セッション ID=（新しい乱数）; HttpOnly; Secure; SameSite=Lax","ログイン前のセッション ID は、もう使えない。Cookie に入るのはセッション ID だけで、利用者・権限はサーバ側にある"]],"r":{"user":"ID とパスワードを入れるだけ。セッション ID も Cookie の属性も、A さんには見えない。","pc":"ID とパスワードを、ログイン前のセッション ID の Cookie と一緒に送る。届いた新しいセッション ID を、属性どおりに扱う。HttpOnly＝ページの JavaScript（document.cookie）から読ませない。XSS（Cross-Site Scripting）で動いたスクリプトにも読まれないが、XSS そのものは止めない。Secure＝HTTPS の通信にだけ付ける（暗号化そのものではない）。SameSite=Lax＝別のサイトから始まったリクエストには、リンクなどでのページ全体の移動（GET のような安全なメソッド）のときだけ付ける。","net":"経路の途中。中身は TLS で暗号化されている。Secure の無い Cookie は、http:// の通信に平文で載り、ここで盗聴されうる。","web":"照合に成功したら、ログイン前のセッション ID を無効にし、推測できない十分長い乱数で新しいセッション ID を作る。セッション情報（セッション ID → A さん・権限）はサーバ側に置き、ブラウザにはセッション ID だけを Set-Cookie で渡す。作り直さないと、攻撃者が先に取ったセッション ID を A さんに使わせてログインさせ、攻撃者もそのセッション ID でログイン後の状態に入れる（セッション固定）。セッション ID は URL に書かない。","db":"会員の情報を出して、ID とパスワードの照合に使わせる。"},"cards":["S08-2","S08-3"]},{"t":"② 注文履歴と認可","star":["web","認証（誰か）と認可（何をしてよいか）は別の処理なので、ログインしていても、その注文を見てよい人かをサーバ側で毎回確かめる（S08-1）"],"o":"A さんが前の注文を開く。通販サイトは、セッション ID からログイン中の利用者を引き、注文の持ち主を DB で引いて照らす。自分のアカウントでログインした攻撃者が、自分の注文の番号（1002）を、A さんの注文の番号（1001）に書き換えて送っても、持ち主が違うので見せない。","legs":[[["pc","net","web","db"],"注文 1001 を見たい","注文履歴を開く中","通販サイト → 会員・注文の DB","HTTPS GET /orders?id=1001（Cookie にセッション ID）","セッション ID から A さんを引き、注文 1001 の持ち主を DB で引く。どちらも A さん"],[["web","net","pc"],"注文 1001 の画面","画面を受け取る中","A さんのブラウザ","HTTP 200（HTML（HyperText Markup Language）の画面）","前の注文の商品と、そのときの配送先（実家の住所）が出る"],[["bad","net","web","db"],"番号を 1001 に","他人の注文をのぞこうとする中","通販サイト → 会員・注文の DB","HTTPS GET /orders?id=1001（Cookie には攻撃者自身のセッション ID）","自分の注文 1002 の番号を、1つ前に書き換えただけ。ログインは本物"],[["web","net","bad"],"見せない","断られる中","攻撃者","HTTP 403 Forbidden","ログイン中の利用者は攻撃者、注文 1001 の持ち主は A さん。合わないので拒否する"]],"r":{"pc":"注文の番号を付けて、注文履歴を頼む。Cookie のセッション ID は、ブラウザが自動で付ける。","net":"経路の途中。中身は暗号文。","web":"(1) セッション ID からログイン中の利用者を引く → (2) 頼まれた注文の持ち主を DB で引く → (3) 両方を照らし、合わなければ拒否する。URL のクエリ文字列・フォーム・hidden の値は利用者が書き換えられるので、それだけで対象を決めない。番号を推測できない乱数にするのは総当たりを止める上乗せで、照合の代わりにならない。管理者だけの機能も、画面に出さないだけでなく、呼ばれたときに権限を見て拒否する。","db":"注文の番号から、持ち主の会員を返す。SQL（Structured Query Language）で引くなら、取り出す条件に「その利用者が見てよい範囲」も入れる。","bad":"自分のアカウントでログインしているので、セッション ID は正しい（認証は通る）。リクエストの番号を書き換えるだけで、他人のデータに届くかを試す（パラメタの改ざん）。番号が連番なら、総当たりで全件をねらう。"},"cards":["S08-1"]},{"t":"③ 配送先の変更","star":["web","トークンを A さんのセッションに結び付けないと、攻撃者が自分のアカウントで取ったトークンを罠のページに仕込んだフォームに入れ、A さんのブラウザから送らせても通る（S09-3）"],"o":"A さんが配送先を実家に変える。通販サイトは変更の画面を返すとき、CSRF 対策用トークンを作って A さんのセッションに結び付け、フォームの hidden（画面に出ない入力欄）に埋め込む。送られてきたトークンを、セッションに持っておいたトークンと照らしてから、配送先を書き換える。","legs":[[["pc","net","web"],"変更の画面","変更の画面を開く中","通販サイト","HTTPS GET /address/edit（Cookie にセッション ID）","「配送先を実家に変えたい」"],[["web","net","pc"],"フォーム＋トークン","フォームを受け取る中","A さんのブラウザ","HTTP 200（フォームの hidden に CSRF 対策用トークン）","トークンは推測できない乱数。同じ値を、A さんのセッションにも持っておく"],[["pc","net","web","db"],"新しい配送先＋トークン","変更を送る中","通販サイト → 会員・注文の DB","HTTPS POST /address（Cookie にセッション ID、本文に新しい住所と hidden のトークン）","送られたトークンが、セッションに持っておいたトークンと合った。XSS（Cross-Site Scripting）が無い限り、通販サイトのページから送られたと分かるので、配送先を書き換える"]],"r":{"pc":"変更の画面を表示する。A さんが送信を押すと、hidden のトークンも一緒に送る。Cookie はブラウザが自動で付ける。","net":"経路の途中。中身は暗号文。","web":"変更の画面を返すたびに、推測できないトークンを作り、A さんのセッションに結び付けて持つ。送られてきた hidden の値を、セッションに持っておいたトークンと照らし、合ったときだけ処理する。「自分が発行した値か」だけを見ると、攻撃者が自分のアカウントで取ったトークンを罠のページに仕込んだフォームに入れ、A さんのブラウザから送らせても通る。書き込める項目（住所・氏名など）は許可リストで決める。送られた値をそのまま会員の項目に書く作りだと、権限の項目を足して送られ、権限を上げられる（マスアサインメント）。","db":"A さんの配送先を、実家の住所に書き換える。"},"cards":["S09-3","S08-1"]},{"t":"④ 同一オリジンポリシ","star":["pc","ブラウザが止めるのは、別のオリジンの応答を読むことで、リクエストを送ることは止めない（S08-4）"],"o":"A さんが、通販サイトにログインしたまま、SNS のリンクから罠のサイトを開いた。ページのスクリプトが、通販サイトの注文履歴を取りに行く。オリジン（スキーム・ホスト・ポートの組）が違うので（sale.example.com と shop.example.jp はホストが違う）、ブラウザは応答の中身をスクリプトに渡さない（同一オリジンポリシ）。","legs":[[["user","pc","net","trap"],"ページを開く","リンクを開く中","罠のサイト（https://sale.example.com）","HTTPS GET（SNS の投稿のリンク）","「セール情報」のつもりで、別のタブで開いた"],[["trap","net","pc"],"ページ＋スクリプト","罠のページを受け取る中","A さんのブラウザ","HTTP 200（HTML と JavaScript）","見た目はセールの案内。裏でスクリプトが動き出す"],[["pc","net","web"],"注文履歴を読みたい","スクリプトが取りに行く中","通販サイト（https://shop.example.jp）","fetch（JavaScript から通信する関数）で GET /orders（別のオリジンへ。既定では Cookie を付けない）","リクエストは届く。通販サイトには、ログインしていない人からのリクエストに見える"],[["web","net","pc"],"応答（渡さない）","応答が戻る中","A さんのブラウザ","HTTP 応答（Access-Control-Allow-Origin が無い）","Cookie が付かないので、返るのは未ログインの画面。仮に Cookie 付きで送らせても、通販サイトが CORS（Cross-Origin Resource Sharing）の許可のヘッダを返さない限り、ブラウザは中身をスクリプトに見せない"]],"r":{"user":"通販サイトにログインしたまま、別のタブで罠のサイトを開く。裏で動くスクリプトは見えない。","pc":"オリジンは、スキーム・ホスト・ポートの組。https://sale.example.com と https://shop.example.jp は別のオリジンなので（https:// と http:// の違いだけでも別）、罠のページのスクリプトに、通販サイトの応答の中身を渡さない。fetch や XMLHttpRequest は、既定では別のオリジンへ Cookie を付けない。止めるのは読むことだけで、フォームの送信や画像の読込みでリクエストを送らせることは止めない（⑤）。","net":"経路の途中。","trap":"攻撃者が置いたページを返す。ページのスクリプトは、自分のオリジンのものと、相手が CORS で許したものしか読めない。通販サイトのページの中で攻撃者のスクリプトを動かす XSS だと、この制限は効かない。","web":"Cookie の無いリクエストなので、ログインしていない人向けの応答を返す。CORS のヘッダで読ませてよいオリジンを許していないので、ブラウザが罠のページに中身を見せない。許すオリジンは、必要なものだけに絞る。"},"cards":["S08-4"]},{"t":"⑤ CSRF","star":["web","罠のページは通販サイトの変更の画面を読めない（④）のでトークンを手に入れられず、通販サイトはトークンが無い・合わないリクエストを処理しない（S09-3）"],"o":"罠のページには、通販サイトの配送先の変更へ送るフォームが仕込んであり、スクリプトで自動送信される。配送先を攻撃者の住所に変えて、次の荷物を横取りするねらい。攻撃者は応答を読めないので、ねらうのは配送先の変更のように、実行されること自体が被害になる操作。","legs":[[["pc","net","web"],"配送先の変更（偽）","勝手に送らされる中","通販サイト（POST /address）","HTTPS POST（罠のページに仕込んだフォームの自動送信。hidden のトークンは無い）","A さんは何も押していない。SameSite=Lax なので、別のサイトから始まった POST に Cookie は付かない"],[["web","net","pc"],"受け付けない","断られる中","A さんのブラウザ","HTTP 403 Forbidden（セッションの Cookie も、トークンも無い）","配送先は変わらない（Cookie が付く場合も、トークンが無いので断る）。罠のページは、この応答も読めない"]],"r":{"pc":"罠のページに仕込んだフォームを、スクリプトが通販サイトへ送る。宛先のサイトの Cookie を自動で付けるかは、SameSite の値で決まる。Lax なので、別のサイトから始まった POST には付けない（None だと付く。None には Secure が要る）。","net":"経路の途中。","web":"配送先の変更は、hidden のトークンを、A さんのセッションに持っておいたトークンと照らしてから処理する。このリクエストには、Cookie も正しいトークンも無いので処理しない。Cookie が付く場合（SameSite=None、同じサイトの別のサブドメインからの送信、変更を GET でも受け付ける作り）は、ログイン中の A さんの操作に見えるが、トークンが無いので止まる。SameSite と、重要な操作の前のパスワードの入れ直しは上乗せ。XSS があると、スクリプトがページのトークンを読めるので、この対策は効かない。"},"cards":["S09-3","S08-3","S08-4"]},{"t":"⑥ セッションハイジャック","star":["bad","セッション ID を知る人は、パスワードを知らなくても A さんとして扱われ、注文を見て、配送先を変えられる（S08-2）"],"o":"攻撃者が、A さんのセッション ID を手に入れたとする（① の HttpOnly と Secure は XSS と盗聴の道をふさぐが、中継型フィッシング（AiTM）では盗まれる）。攻撃者はセッション ID を自分のブラウザの Cookie に入れ、A さんとして通販サイトを使う。サーバ側のセッションが消えるまで、そのセッション ID は使える。","legs":[[["bad","net","web","db"],"盗んだセッション ID","A さんになりすます中","通販サイト → 会員・注文の DB","HTTPS GET /orders（Cookie に A さんのセッション ID）","パスワードは送っていない。それでも通販サイトには、A さんのリクエストに見える"],[["web","net","bad"],"A さんの注文・住所","A さんの情報を受け取る中","攻撃者","HTTP 200（A さんの注文履歴と配送先）","認可の照合も、A さんとして通る"],[["bad","net","web","db"],"配送先＋トークン","配送先を書き換える中","通販サイト → 会員・注文の DB","HTTPS POST /address（A さんのセッション ID ＋ 変更の画面から取ったトークン）","A さんとして変更の画面を開けるので、トークンも手に入る。CSRF 対策用トークンでは止まらない"],[["pc","net","web"],"ログアウト","ログアウトする中","通販サイト","HTTPS POST /logout（Cookie にセッション ID）","買い物を終えて、A さんがログアウトする。サーバ側のセッション情報が消え、同じセッション ID を送っても、もう A さんにはならない"]],"r":{"bad":"盗んだセッション ID を Cookie に入れるだけで、A さんとして扱われる（セッションハイジャック）。セッション ID を盗む経路は、盗聴・XSS・推測・URL に書いたセッション ID の漏えい。中継型フィッシング（AiTM：Adversary-in-the-Middle）でも、多要素認証のあとに本物が発行したセッション ID を盗まれて、同じことになる。","net":"経路の途中。","web":"利用者を見分けるのはセッション ID だけなので、セッション ID が合えば A さんとして扱い、認可の照合も A さんとして通す。重要な操作（配送先の変更など）の前にパスワードを入れ直させると、セッション ID だけを盗んだ攻撃者は変えられない（パスワードも中継で盗む AiTM には効かない）。ログアウトや時間切れのときにサーバ側のセッション情報を消すと、盗まれたセッション ID はそこで使えなくなる。","db":"通販サイトが A さんと判断したリクエストなので、A さんの注文と配送先を返し、書き換える。","pc":"ログアウトを送る。ブラウザの Cookie を消しただけでは、盗まれたセッション ID はサーバ側で生きている。サーバ側で消すから無効になる。"},"cards":["S08-2","S08-3"]}]},{"group":"2","scene":"6","title":"攻撃者が、通販サイトのフォームや URL に命令を仕込む（XSS・SQL インジェクション・SSRF・WAF など）","goal":"会員のなりすましと、カード番号・会員の情報を盗むことをねらって攻撃者が入力に仕込んだ命令が、サイトの各所で動き、運営者が WAF（Web Application Firewall）でしのぎながらアプリを直す","focus":"入力が、どこで命令として解釈されるか（ブラウザ・DB・シェルとヘッダ・サーバ自身の通信・ファイルの読み出し）で、攻撃の名前と対策が決まる。② だけは入力ではなく、サイトが読み込む他社の CDN（Content Delivery Network）のスクリプトを書き換える。CSP（Content Security Policy）では止まらない所を見る。対策の本体は、入力を命令にさせない作り（エスケープ・プレースホルダ・許可リスト）。WAF と CSP は、被害を減らす上乗せ。★ は、入力が命令として動く所と、WAF の立場","example":"攻撃者が、口コミを投稿できる通販サイト https://shop.example.jp を狙う。サイトには、商品の検索・口コミの投稿・問合せフォーム・ログイン後の戻り先への転送・注文の控えのダウンロードがある。口コミには画像を添付できる。口コミに URL を書くと、サーバがその先のページを取ってきて、見出しと冒頭を表示する。決済の画面だけは、入力補助のスクリプトを、他社の CDN（Content Delivery Network：スクリプトや画像を配るサーバ）の cdn.example.com から読み込む。サイトはクラウドの仮想サーバで動く。運営者は先月、手前に WAF を入れた。正規の口コミを止めないか確かめるため、規則に一致しても止めずに記録だけする設定にしてある。A さんは、このサイトでよく買い物をする利用者","note":"shop.example.jp・cdn.example.com・x@example.com は、説明用に取っておかれた名前（実在のサイトではない）","zones":[[10,8,124,116,"#EEEDFE","利用者","#3C3489"],[10,136,124,116,"#FAECE7","攻撃者の手元","#712B13"],[146,4,118,116,"#E1F5EE","他社","#085041"],[282,124,210,130,"#E6F1FB","通販サイト（shop.example.jp）","#0C447C"],[504,8,172,362,"#FAEEDA","外から届かない内部","#633806"]],"nodes":{"pc":{"x":70,"y":84,"label":"A さんのブラウザ","type":"pc","labelPos":"above"},"bad":{"x":70,"y":190,"label":"攻撃者","type":"bad"},"ext":{"x":200,"y":76,"label":"他社の CDN","type":"srv","labelPos":"above"},"net":{"x":200,"y":190,"label":"インターネット","type":"net"},"waf":{"x":330,"y":190,"label":"WAF","type":"fw"},"web":{"x":440,"y":190,"label":"Web アプリ","type":"srv"},"db":{"x":590,"y":80,"label":"商品・会員 DB","type":"db","labelPos":"above"},"inner":{"x":590,"y":190,"label":"内部の管理サーバ","type":"srv"},"imds":{"x":590,"y":310,"label":"IMDS（メタデータ）","type":"box"}},"edges":[["pc","net"],["bad","net"],["ext","net"],["net","waf"],["waf","web"],["web","db"],["web","inner"],["web","imds"]],"route":[["bad","が口コミにスクリプトを仕込み、ほかの利用者のブラウザで動かす（XSS：Cross-Site Scripting）",[["HTTPS","L7"],["格納型 XSS",""],["エスケープ",""]]],["bad","が、決済の画面が読み込む他社のスクリプトを書き換える。CSP（Content Security Policy）で許した読込み元なので、ブラウザが動かす",[["CSP","L7"],["Web スキミング",""]]],["bad","が検索語に SQL（Structured Query Language）を仕込み、DB（データベース）に別の表の中身を出させる",[["HTTPS","L7"],["SQL",""],["プレースホルダ",""]]],["bad","が問合せフォームとログイン後の戻り先の URL に区切り文字を混ぜ、シェルのコマンドとヘッダを足す",[["HTTPS","L7"],["シェル",""],["HTTP ヘッダ","L7"],["メールのヘッダ","L7"]]],["bad","が口コミの URL 欄に内部の URL を書き、Web アプリ自身に取りに行かせる（SSRF：Server-Side Request Forgery）。行き先は内部の管理サーバと IMDS（Instance Metadata Service）",[["HTTP","L7"],["SSRF",""],["IMDS",""]]],["bad","が注文の控えのダウンロードで ../ を使って外のファイルを読み、口コミに画像と名乗る HTML を上げる",[["HTTPS","L7"],["パストラバーサル",""],["URL エンコード",""],["ファイルのアップロード",""]]],["waf","が記録だけの設定から止める設定に変わり、規則に一致した攻撃を止める。検査対象の外に入った攻撃は通るので、運営者がアプリを直す",[["WAF","L7"],["仮想パッチ",""],["プレースホルダ",""]]]],"steps":[{"t":"① 格納型 XSS","star":["pc","スクリプトが動くのは、ページを見た人のブラウザで、サイトと同じオリジンの中なので、HttpOnly の付いていない Cookie もページの中身も読める（S09-1）"],"o":"攻撃者が、口コミの本文にスクリプトを書いて投稿する。アプリは本文をそのまま保存し、商品のページの HTML に埋め込んで返すので、ページを開いた A さんのブラウザでスクリプトが動く（XSS：Cross-Site Scripting のうち、格納型）。","legs":[[["bad","net","waf","web"],"口コミ＋<script>","口コミにスクリプトを仕込み中","Web アプリ（口コミの投稿）","HTTPS POST（口コミの本文に <script>…<\/script>）","「とても良い品でした」の後ろに、Cookie を外へ送るスクリプトを付けて投稿する"],[["web","db"],"口コミの本文","そのまま保存中","商品・会員 DB（口コミの表）","DB への書き込み（本文をそのまま保存）","保存するときに弾かなくても、出力するときにエスケープすれば、スクリプトとしては動かない"],[["db","web","waf","net","pc"],"スクリプト入りのページ","ページを配り中","A さんのブラウザ","HTTPS 応答（商品のページの HTML に、口コミの本文がそのまま入る）","A さんが商品のページを開くと、口コミの中の <script> がページの一部として届く"],[["pc","net","bad"],"A さんの Cookie","セッション ID を外へ送り中","攻撃者","HTTPS（スクリプトが document.cookie を読み、攻撃者へ送る）","このセッション ID で、攻撃者が A さんになりすます。Cookie に HttpOnly が付いていれば、スクリプトからは読めない（S08-3）"]],"r":{"bad":"口コミの本文にスクリプトを書いて投稿する。格納型なので、一度保存させれば、ページを見た人全員のブラウザで動く。","net":"経路の途中。","waf":"HTTPS を復号して、本文の <script> を規則と照らす。一致しても、記録だけの設定なので通す。","web":"口コミの本文を、エスケープせずに HTML に埋め込んで返す。直すなら、出力するときに、埋め込み先に合わせてエスケープする（< を &lt;、> を &gt;、\" を &quot;、' を &#39;、& を &amp;）。攻撃の書き方は、埋め込み先で変わる。要素の中なら <script> を書く。属性値の中なら \" で属性を閉じて、別の属性を足す。リンクの href なら javascript: で始まる URL を入れる。href に出す URL は http・https で始まるものだけにする（javascript: はエスケープしても動く）。","db":"受け取った本文を、そのまま口コミの表に保存する。保存されたスクリプトは、ページが表示されるたびに配られる。","pc":"サイトのページの一部として、スクリプトを動かす。サイトと同じオリジンの中で動く。できること：HttpOnly の付いていない Cookie を外へ送る・偽の入力フォームを出す・ページの CSRF（Cross-Site Request Forgery）対策用トークンを読む・管理者が見れば管理者の権限で管理機能を呼ぶ。XSS には、反射型（リクエストの値がその場で返る）・格納型・DOM（Document Object Model）ベース（ブラウザ側のスクリプトが innerHTML などで画面を書き換えるときに入る）がある。DOM ベースは、textContent などの文字として入れる方法で防ぐ。"},"cards":["S09-1"]},{"t":"② Web スキミング（CSP の抜け道）","star":["pc","CSP を守るのはブラウザで、許した読込み元のファイルが書き換えられると、CSP では止まらない（S09-2）"],"o":"決済の画面には CSP のヘッダが付き、読み込んでよいスクリプトを自社と他社の CDN（cdn.example.com）に絞っている。① のようにスクリプトを HTML に直接書いて差し込んでも、CSP のあるこの画面では動かない。そこで攻撃者は、許された他社の CDN のスクリプトを書き換え、A さんが入力したカード番号を盗む（Web スキミング）。","legs":[[["bad","net","ext"],"スクリプトを書き換え","他社の CDN を乗っ取り中","他社の CDN（cdn.example.com）","CDN の入力補助のスクリプト（x.js）を上書きする","入力欄の値を外へ送る処理を足す。自社のサーバには何も触らない"],[["web","waf","net","pc"],"決済の画面＋CSP","決済の画面を返し中","A さんのブラウザ","HTTP 応答ヘッダ Content-Security-Policy: script-src 'self' https://cdn.example.com","「スクリプトは、自社と cdn.example.com のファイルだけ動かして。HTML に直接書いたものは動かさないで」"],[["ext","net","pc"],"書き換えられた x.js","スクリプトを受け取る中","A さんのブラウザ","HTTPS 応答（決済の画面の <script src=\"https://cdn.example.com/x.js\"> で読み込む）","CSP で許した読込み元なので、ブラウザは、中身が変わっていても動かす"],[["pc","net","bad"],"カード番号","入力を外へ送り中","攻撃者","HTTPS（書き換えられたスクリプトが、カード番号の入力欄の値を送る）","A さんには、いつもの決済の画面にしか見えない"]],"r":{"bad":"自社のサイトではなく、サイトが読み込む他社の CDN を狙う。そのスクリプトを読み込む全部のサイトの利用者から、入力を盗める。","net":"経路の途中。","ext":"自社の外にあるので、自社の管理も監視も届かない。書き換えられると、決済の画面が開かれるたびに、書き換えた中身が配られる。","web":"決済の画面に CSP のヘッダを付けて返す。script-src 'self' は同じオリジンのファイルだけを許し、HTML に直接書いたスクリプト（インラインスクリプト）も止める。default-src は、個別に指定していない読込みの種類（script-src・img-src・connect-src など）に代わりに効く。frame-ancestors には効かない。他社の CDN のファイルが書き換えられても、自社のサーバからは見えない。ダウンロードして自社のサーバに置けば、外のサーバの改ざんの影響を受けない（更新は自分で追う）。CSP の script-src のほかに、ヘッダでブラウザに守らせるもの：枠（iframe）への表示を止める X-Frame-Options（DENY・SAMEORIGIN）と CSP の frame-ancestors（クリックジャッキングを防ぐ）、中身から種類を推測させない X-Content-Type-Options: nosniff。","waf":"通るのは、自社のサイトとのやりとりだけ。他社の CDN の改ざんも、A さんのブラウザから攻撃者への送信も、WAF を通らないので見えない。","pc":"CSP に従って、許していない読込み元のスクリプトとインラインスクリプトを止める。許した読込み元から来たスクリプトは、中身が書き換えられていても動かす。ページの script の integrity 属性に SRI（Subresource Integrity）のハッシュ値を書いておけば、ブラウザが届いたファイルのハッシュ値と照らし、違えば動かさない。他社の CDN から読むときは、CDN が CORS（Cross-Origin Resource Sharing）で読込みを許していることが要る。他社が正規に更新した場合も止まるので、そのときはハッシュ値を書き直す。"},"cards":["S09-2"]},{"t":"③ SQL インジェクション","star":["db","DB にはどこまでが値かが分からないので、値はプレースホルダで分けて渡す（S09-4）"],"o":"攻撃者が、商品の検索欄に ' で始まる文字列を入れる。アプリは入力を文字列のまま SQL（Structured Query Language）文につなぐので、' で値が閉じ、後ろが命令として DB に読まれる。","legs":[[["bad","net","waf","web"],"' UNION SELECT …","検索欄に SQL を仕込み中","Web アプリ（商品の検索）","HTTPS GET（検索語に ' UNION SELECT …）","' で値を閉じ、別の表を読む命令を後ろに足す"],[["web","db"],"つないだ SQL 文","書き換わった SQL 文を送り中","DB","SQL：… WHERE name = '' UNION SELECT …","入力を文字列のままつないだので、DB には、どこまでが値か分からない"],[["db","web","waf","net","bad"],"会員の表の中身","検索結果として返し中","攻撃者","HTTPS 応答（検索結果の画面に、会員の表の中身が並ぶ）","画面に出ない作りでも、真と偽の条件で応答が変わるのを見て、少しずつ読み出せる（ブラインド SQL インジェクション）"]],"r":{"bad":"検索語の ' で値を閉じ、後ろに命令を足す。' OR '1'='1 なら条件がいつも真になって全件が、UNION SELECT なら別の表の中身が、同じ画面に出る。","net":"経路の途中。","waf":"URL のクエリ文字列（検索語）の ' や UNION SELECT を規則と照らす。一致しても、記録だけの設定なので通す。","web":"入力を文字列としてつないで SQL 文を作る（WHERE name = ' ＋入力＋ '）。直すなら、SQL のひな形と値を分けて DB に渡す。ひな形の ? をプレースホルダと呼び、Java なら PreparedStatement に set〜 で値を結び付ける（バインド）ので、値は命令として解釈されない。","db":"届いた SQL 文を、そのまま実行する。Web アプリが DB に接続するアカウントに会員の表を読む権限があるので、読めてしまう。権限を最小にしておけば、成功したときの被害が減る。"},"cards":["S09-4"]},{"t":"④ OS コマンド・ヘッダインジェクション","star":["web","入力を区切り文字ごとシェルやヘッダの文字列につなぐのは Web アプリで、シェルは ; など、ヘッダは改行が区切りになる（S09-5）"],"o":"攻撃者が、命令の区切りになる文字を入力に混ぜて、3か所に命令を足す。問合せのアドレス欄からシェルのコマンド、件名からメールのヘッダ、ログイン後の戻り先の URL から HTTP のヘッダ。シェルの区切りは ;、ヘッダの区切りは改行の CR（Carriage Return）と LF（Line Feed）で、URL では %0D%0A と書く。","legs":[[["bad","net","waf","web"],"アドレス欄に ; 〜","シェルにコマンドを仕込み中","Web アプリ（問合せフォーム）","HTTPS POST（メールアドレス欄に x@example.com; 別のコマンド）","アプリは、この値をつないだ文字列をシェルに渡して、メールを送るコマンドを動かす。; の後ろが、別のコマンドとして動く（OS コマンドインジェクション）"],[["bad","net","waf","web"],"件名に改行＋Bcc","メールのヘッダを足し中","Web アプリ（問合せフォーム）","HTTPS POST（件名欄に お問合せ%0D%0ABcc: 多数の宛先）","改行のあとが Bcc のヘッダとして読まれ、サイトが第三者へメールを送ってしまう（メールヘッダインジェクション）"],[["pc","net","waf","web"],"罠の URL","罠の URL を開き中","Web アプリ（ログイン後の戻り先）","HTTPS GET（戻り先の値に %0D%0ASet-Cookie: …）","攻撃者が、戻り先の値に改行と Set-Cookie を入れた URL を口コミに書いておき、A さんがそれを開く。アプリは戻り先の値を、転送先を示す Location ヘッダにそのまま入れる"],[["web","waf","net","pc"],"Set-Cookie 入りの応答","ヘッダの増えた応答を返し中","A さんのブラウザ","HTTP 応答（Location: … の後ろに、改行で Set-Cookie: 攻撃者の決めた値）","A さんのブラウザが、攻撃者の決めた Cookie を覚える（HTTP ヘッダインジェクション）"]],"r":{"bad":"入力に、命令の区切りになる文字を混ぜる。シェルなら ;・|・&、HTTP やメールのヘッダなら改行（%0D%0A）。","net":"経路の途中。","waf":"; に続くコマンドや %0D%0A を規則と照らす。一致しても、記録だけの設定なので通す。","web":"入力を区切り文字ごと、シェルのコマンドとメールのヘッダの文字列につないでいる。Location ヘッダも、入力をつないだ文字列として自分で書き出している。; の後ろのコマンドは、Web アプリの実行権限で動く（OS コマンドインジェクション）。直すなら、シェルを経由しない API（Application Programming Interface）でメールを送る（シェルを使うなら、使える文字を許可リストで絞る）。ヘッダは、実行環境に用意されたヘッダ出力用の API で出す。自分で出すなら、値から CR も LF も1文字ずつ取り除く（%0D%0A の組だけを探すのでは足りない）。アプリの権限を最小にしておけば、乗っ取られたときの被害が減る。別の例：ログに書くだけの文字列でも、Log4j 2 の 2.14.1 までの版は ${jndi:…} を解釈して、外のサーバからコードを読み込んで動かす（Log4Shell。JNDI：Java Naming and Directory Interface）。版を上げて防ぐ。","pc":"応答に足された Set-Cookie を、本物のヘッダとして受け入れる。足された Set-Cookie の値は、攻撃者が先に取ったセッション ID。A さんがそのままログインすると、攻撃者もその ID でログイン後の状態に入れる（セッション固定）。ログインのときに ID を作り直せば防げる（S08-2）。"},"cards":["S09-5"]},{"t":"⑤ SSRF","star":["web","リクエストは、外から届かない内部と同じ側にいるサーバ自身から出るので、内部に届く（S09-6）"],"o":"攻撃者が、口コミの URL 欄に、外からは届かない内部の管理サーバや IMDS（Instance Metadata Service：仮想サーバの中から、そのサーバの設定や一時的な認証情報を取れるサービス）の URL を書く。リンク先を取りに行くのは Web アプリ自身なので、リクエストは外から届かない内部と同じ側から出て、内部に届く（SSRF：Server-Side Request Forgery）。","legs":[[["bad","net","waf","web","inner"],"URL＝内部の管理サーバ","サーバに取りに行かせ中","内部の管理サーバ","HTTPS POST（口コミの URL 欄に、内部の管理サーバの URL）→ Web アプリが HTTP GET で取りに行く","外からは届かない所へ、Web アプリ自身が取りに行く"],[["inner","web","waf","net","bad"],"管理サーバの画面","取ってきた中身を返し中","攻撃者","HTTP 応答 → 口コミの見出しと冒頭の表示","相手が内部の Web アプリなので、管理サーバは答える。その中身が、見出しとして攻撃者に見える"],[["bad","net","waf","web","imds"],"URL＝IMDS","メタデータを取りに行かせ中","IMDS","HTTPS POST（URL 欄に IMDS の URL）→ Web アプリが HTTP GET で取りに行く","仮想サーバの中からしか届かない所。トークンの無い GET にも答える設定のままなので、URL だけで答える"],[["imds","web","waf","net","bad"],"一時的な認証情報","認証情報を返し中","攻撃者","HTTP 応答（仮想サーバに付けた権限の、一時的な認証情報）→ 見出しと冒頭の表示","この認証情報で、攻撃者が、その権限の範囲でクラウドを操作できる"]],"r":{"bad":"URL 欄の値を、内部の管理サーバや IMDS の URL に変える。許可された先からのリダイレクトで、内部へ飛ばすこともある。","net":"経路の途中。","waf":"URL 欄に書かれた内部のアドレスを規則と照らす。一致しても、記録だけの設定なので通す。Web アプリから内部への通信は、WAF を通らない。","web":"利用者が書いた URL を、そのまま取りに行く。リクエストは、外から届かない内部と同じ側にいる自分から出るので、内部に届く。直すなら、取りに行く先を許可リストで固定する（ホスト名だけでなく、名前解決した先の IP アドレスが内部でないかも見る）。利用者が変えられる値から URL を組み立てない。リダイレクトに従わない。サーバから内部への通信を、FW（ファイアウォール。図には無い）で必要な先だけに絞る。","inner":"外からは届かない前提で置いている管理サーバ。リクエストの送信元が内部の Web アプリなので、そのまま答える。","imds":"仮想サーバの中から聞かれると、そのサーバの設定と、付けた権限の一時的な認証情報を返す。ここでは、トークンの無い GET にも答える設定のままなので、URL を渡されるだけで答える。AWS（Amazon Web Services）なら、IMDSv1 を有効にしたままの状態。IMDSv2 のトークン方式だけを受け付けると、SSRF で読まれにくくなる。トークン方式では、先に PUT でトークンを取り、それをヘッダに付けた要求にだけ答える。サーバに付ける権限を役割に要る分だけにしておけば、漏れたときの被害が減る。"},"cards":["S09-6"]},{"t":"⑥ パストラバーサル・偽の画像","star":["web","ファイル名をパスにつなぐのも、上げたファイルを公開するのも Web アプリで、../ を照らすなら URL デコードと正規化のあとの形で照らす（S09-7）"],"o":"攻撃者が、注文の控えのダウンロードで、ファイル名に ../ を入れて決まったディレクトリの外へ出る（パストラバーサル。ディレクトリトラバーサルとも呼ぶ）。口コミの画像の添付では、画像と名乗って中身が HTML のファイルを上げ、誰でも取れる URL に置かせる。","legs":[[["bad","net","waf","web"],"file=..%2f..%2f〜","決まったディレクトリの外を指し中","Web アプリ（注文の控えのダウンロード）","HTTPS GET（file= の値に、..%2f..%2f で始まる設定ファイルのパス）","Web アプリの ../ の照合は、受け取った URL の文字列（デコードの前）にかかる作りなので、../ を ..%2f と書くとすり抜ける"],[["web","waf","net","bad"],"設定ファイル","見せてはいけないファイルを返し中","攻撃者","HTTPS 応答（決まったディレクトリの外にある設定ファイル）","DB の接続のパスワードが書かれた設定ファイルが読めた"],[["bad","net","waf","web"],"画像と名乗る HTML","口コミに添付中","Web アプリ（口コミの画像）","HTTPS POST（multipart/form-data。Content-Type: image/jpeg）","名前は photo.html、中身は HTML とスクリプト。Content-Type の宣言は、送る側が自由に書ける"],[["web","waf","net","pc"],"photo.html","上げたファイルを配り中","A さんのブラウザ","HTTPS 応答（誰でも取れる公開の URL。拡張子から text/html として返る）","口コミの「写真はこちら」のリンクから A さんが開くと、サイトと同じオリジンでスクリプトが動く"]],"r":{"bad":"../ で上の階層へ出る。..%2f・%2e%2e%2f のように URL エンコードして、デコードの前の文字列にかかる照合をすり抜ける。アップロードでは、宣言と違う中身のファイルを上げる。ファイル名を hidden の値で送る作りでも、利用者は書き換えられる。","net":"経路の途中。","waf":"クエリ文字列の ../ や、アップロードの中のスクリプトを規則と照らす。一致しても、記録だけの設定なので通す。","web":"入力のファイル名を、決まったディレクトリの後ろにつなぐ。../ を探す照合を、受け取った URL の文字列（デコードの前）にかけ、ファイルを開くときはデコードしたあとの値を使っている。そのため ..%2f を見逃す。OS は ../ を解いたパスでファイルを開くので、外のファイルが読める。直すなら、ファイル名を入力から作らず、番号で引く。作るなら、basename などでファイル名だけを取り出してから、決まったディレクトリにつなぐ。../ を照らすなら、URL デコードとパスの正規化（../ を解いた最後の形にする）を済ませた形で照らす。アップロードは、拡張子・Content-Type・中身の形式が合っているかを確かめ、Web サーバがそのまま配る場所の外（か別のホスト）に置き、アプリを通して返す。","
