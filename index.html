pc":"公開の URL のファイルを、サイトのページとして開く。サイトと同じオリジンなので、① と同じように、HttpOnly の付いていない Cookie や、ページの中身を読まれる。"},"cards":["S09-7"]},{"t":"⑦ WAF","star":["waf","アプリを直すまでの暫定の対策で、何を検査対象にしたかと規則の漏れが聞かれる（S09-8）"],"o":"運営者が、WAF の記録で ①・③〜⑥ の攻撃に気づく（② は WAF を通らないので、記録に無い）。アプリを直すまでの間、WAF を、記録だけの設定から、規則に一致したら止める設定に切り替え、攻撃の形の規則を足す（仮想パッチ）。WAF は規則に一致した攻撃を止めるが、検査対象の外に入れた攻撃は通すので、アプリを直す。ここでは ③ の SQL インジェクションで見る（値はプレースホルダで渡す）。ほかの攻撃は、それぞれの手順の直し方でアプリを直す。","legs":[[["bad","net","waf"],"' UNION SELECT …","同じ攻撃を送り中","Web アプリ（商品の検索）","HTTPS GET（検索語に ③ と同じ文字列）","WAF の規則に一致。403 Forbidden を返して止め、記録に残す"],[["bad","net","waf","web"],"Cookie に仕込む","検査対象の外へ入れ中","Web アプリ（商品の検索）","HTTPS GET（前回の検索語を覚えておく Cookie に、同じ文字列を入れる）","WAF は Cookie を検査対象に入れていないので通す。アプリは Cookie の値も SQL 文につないでいるので、会員の表の中身が返る"],[["web","db"],"ひな形＋値","直したアプリで問い合わせ中","DB","SQL のひな形（WHERE name = ?）と値を別に渡す（PreparedStatement）","アプリを直したあとは、どこから入った文字列も値として扱われ、命令にならない。ゴール"]],"r":{"bad":"止められたら、表記を変える（大文字小文字の混在・URL エンコード・二重エンコード）か、検査対象に入っていない所（ヘッダ・Cookie など）に入れる。","net":"経路の途中。","waf":"Web サーバの手前で、サーバ証明書と秘密鍵を持って HTTPS を終端し（復号し）、検査対象に決めた所を、攻撃の形を書いた規則（シグネチャ・正規表現）と照らす。一致したら止めるか記録する。検査対象にできるのは URL・クエリ文字列・本文・ヘッダ・Cookie。このサイトの WAF は、Cookie を検査対象に入れていなかった。検査対象から外した所と、規則が拾えない表記は通る。攻撃の文字列が入りうる所を全部検査対象にし、規則が表記の揺れを拾えるかを確かめる。規則を足して攻撃の通信を止めるのは、アプリをすぐに直せない間のつなぎ（仮想パッチ）。アプリの対策の代わりにはならない。","web":"Cookie の値も SQL 文につないでいたので、WAF をすり抜けた値で、会員の表の中身が返った。直したあとは、どの入力の値もプレースホルダで渡す。","db":"直したあとは、ひな形と値が別々に届く。値の中の ' や UNION SELECT も、ただの文字として比べる。"},"cards":["S09-8","S09-4"]}]},{"group":"2","scene":"7","title":"会社の ID で、社内外のサービスにログインする（SAML・OAuth・API・Kerberos）","goal":"A さんが IdP（Identity Provider）の1つの ID で業務の SaaS（Software as a Service）と印刷サービスに、ドメインのチケットで社内のファイルサーバに入れる。攻撃者が書き換えたトークンや横取りした認可コードははねられ、チケットを暗号化する鍵を盗んで偽造したチケットは鍵を2回変えるまで通り、退職のあとは新しいログインが止まる","focus":"ログインの結果を、誰が作り、どこを通して、誰が確かめるか。SAML（Security Assertion Markup Language）はブラウザが署名付きのアサーションを運ぶ。OAuth と OpenID Connect はブラウザが認可コードだけを運び、サーバどうしでトークンに換える。Kerberos はチケットを見せて入る。IdP・サービス・API・ドメインコントローラのそれぞれの立場で見る","example":"社員の A さんの会社は、ログインを IDaaS（Identity as a Service）の IdP（Identity Provider）に集めている。朝、A さんは会社の PC に Windows のドメインのアカウントでサインインし、日報を書くため、業務の SaaS（Software as a Service）を開いて、IdP で PC のパスキーを使ってログインする。昼は、広報のポスターを刷るため、社外の印刷サービスで「会社の ID でログイン」を押し、会社の写真の API（Application Programming Interface）から写真を読む権限だけを印刷サービスに渡す。午後は、ポスターの元の原稿を取りに、社内のファイルサーバを開く。こちらは Windows のドメインのチケットで入る。ある日、攻撃者が写真の API に書き換えたトークンを送り、社内に入り込んでドメインのチケットの偽造もねらう。やがて A さんは退職する","note":"idp.example.jp と print.example.com は、説明用に取っておかれた名前（実在のサービスではない）","zones":[[16,84,256,288,"#EEEDFE","社内 LAN","#3C3489"],[288,126,110,110,"#FAECE7","攻撃者の手元","#712B13"],[282,280,116,76,"#E6F1FB","",""],[410,4,266,226,"#E1F5EE","会社が使うクラウド","#085041"],[500,258,166,114,"#FAEEDA","社外のサービス","#633806"]],"nodes":{"user":{"x":70,"y":330,"label":"A さん","type":"user","labelPos":"above"},"pc":{"x":200,"y":280,"label":"A さんの PC","type":"pc"},"fs":{"x":80,"y":210,"label":"ファイルサーバ","type":"srv","labelPos":"above"},"dc":{"x":200,"y":160,"label":"ドメインコントローラ","type":"srv","labelPos":"above"},"bad":{"x":330,"y":200,"label":"攻撃者","type":"bad","labelPos":"above"},"net":{"x":340,"y":310,"label":"インターネット","type":"net"},"idp":{"x":460,"y":130,"label":"IdP（IDaaS）","type":"srv","labelPos":"above"},"saas":{"x":620,"y":60,"label":"業務の SaaS","type":"srv","labelPos":"above"},"api":{"x":620,"y":190,"label":"写真の API","type":"srv","labelPos":"above"},"print":{"x":560,"y":320,"label":"印刷サービス","type":"srv"}},"edges":[["user","pc"],["pc","dc"],["pc","fs"],["pc","net"],["dc","bad"],["fs","bad"],["bad","net"],["net","idp"],["net","saas"],["net","api"],["net","print"]],"route":[["saas","が A さんを IdP（IDaaS：Identity as a Service）へ回す。IdP がパスキーで認証し、署名したアサーション（認証の結果）をブラウザ経由で SaaS に届ける",[["SAML（Security Assertion Markup Language）","L7"],["WebAuthn（Web Authentication）","L7"],["デジタル署名",""]]],["print","が、照らすための値を付けてブラウザを IdP へ回し、A さんの同意のあと認可コードを受け取る",[["OAuth 2.0","L7"],["OpenID Connect（OIDC）","L7"]]],["print","が認可コードと、② で作った秘密の値を IdP に直接送り、アクセストークンと ID トークンに換える。ID トークンを確かめて A さんをログインさせる",[["OAuth 2.0（PKCE：Proof Key for Code Exchange）","L7"],["ID トークン（JWT：JSON Web Token）",""]]],["print","がアクセストークンを付けて写真の API（Application Programming Interface）を呼ぶ。API は署名を確かめ、署名を外した偽のトークンをはねる",[["OAuth 2.0（アクセストークン）","L7"],["HTTPS","L7"],["JWT（デジタル署名）",""]]],["pc","がドメインコントローラから TGT（Ticket Granting Ticket）と ST（Service Ticket）をもらい、ST を見せてファイルサーバに入る",[["Kerberos","L7"]]],["bad","が TGT を暗号化する鍵（krbtgt の鍵）を盗んで TGT を偽造し、好きな利用者としてファイルサーバに入る",[["Kerberos","L7"]]],["idp","で A さんのアカウントを消すと、SAML・OpenID Connect でつないだサービスに新しくはログインできなくなる",[["SAML","L7"],["OpenID Connect","L7"],["OAuth 2.0（アクセストークン）","L7"]]]],"steps":[{"t":"① SAML","star":["saas","署名・宛先・期限を確かめるのは SP で、ここを飛ばすと、書き換えたアサーションで入られる（S11-1）"],"o":"朝、A さんが業務の SaaS を開く。SaaS は自分ではパスワードを持たず、SP（Service Provider）として、SAML（Security Assertion Markup Language）で A さんのブラウザを IdP へ回す。IdP がパスキーで A さんを確かめ、署名したアサーション（認証の結果）を SAML 応答に入れて、ブラウザに持たせて SaaS へ送る。","legs":[[["pc","net","saas"],"開く","業務の SaaS を開く中","業務の SaaS","HTTPS（ログインしていない状態でページを開く）","SaaS には A さんのパスワードが無い。ログインは IdP に任せる"],[["saas","net","pc","net","idp"],"SAML 認証要求","IdP へ回される中","IdP（IDaaS）","HTTP リダイレクト（SAMLRequest を URL に載せる）","SaaS が作った認証要求が、ブラウザを通って IdP に届く"],[["user","pc","net","idp"],"パスキーの署名","IdP にログインする中","IdP（IDaaS）","WebAuthn（Web Authentication。IdP のチャレンジとオリジン https://idp.example.jp を含むデータに、PC の認証器の秘密鍵で署名）","ここは SAML の外で、A さんが顔か PIN（Personal Identification Number）で認証器を開け、IdP が自分で確かめる。フィッシングの偽サイトで同じ操作をしても、オリジンが違うので、本物で通る署名は作れない"],[["idp","net","pc","net","saas"],"署名付きアサーション","アサーションを SaaS へ運ぶ中","業務の SaaS","HTTP POST（IdP が署名したアサーションを、自動送信のフォームで送る）","SaaS は IdP の公開鍵で IdP の署名を確かめる（パスキーの署名は IdP だけが見る）。宛先と期限も見てから、A さんをログインさせる"]],"r":{"pc":"SaaS のリダイレクトに従って IdP へ移り、IdP が返したフォームを自動で SaaS へ送る。アサーションはブラウザを通るので、利用者や攻撃者が書き換えようと思えば書き換えられる。SAML のメッセージを HTTP でどう運ぶかの決まりをバインディングという。行きは URL に載せ（HTTP Redirect）、帰りはフォームで送る（HTTP POST）。","net":"経路の途中。中身は暗号文（HTTPS）。","saas":"SP。認証要求を作り、ブラウザを IdP へ回す。戻ったアサーションの署名を、前もって IdP から受け取った設定（メタデータ）の中の証明書（公開鍵）で確かめ、宛先（Audience）が自分か・期限内かも見る。署名を確かめないと書き換えたアサーションで、宛先を見ないと別の SP 向けのアサーションで入られる。SP から始まるこの形が SP-Initiated。IdP の画面（ポータル）のサービス一覧から始める形は IdP-Initiated。","idp":"どの方式で認証するかは IdP が決め、SaaS は認証の結果（アサーション）だけを受け取る。A さんをパスキーで確かめ、誰がいつ認証したかを書いたアサーションに、IdP の秘密鍵で署名する。認証を IdP に集めたので、ここをパスキーだけにし、ほかのログイン方法とサービス側のパスワードを残さなければ、つないだサービスのログインは、偽サイトへの中継で破られにくくなる。逆に、IdP の1つのアカウントを取られると全部に入られるので、ログインをパスキーにするだけでなく、ログインできる送信元（社内の出口の IP（Internet Protocol）アドレスなど）も絞る。IdP が止まると、全部のサービスにログインできなくなる（可用性）。","user":"顔か PIN で、PC の認証器を開ける。"},"cards":["S11-1","S11-3"]},{"t":"② OAuth・OIDC の認可","star":["print","state を作って覚え、戻った値と照らすのはクライアントで、照らさないと、攻撃者が送り込んだ認可コードを受け入れる（S11-2）"],"o":"昼、A さんが社外の印刷サービスで「会社の ID でログイン」を押す。印刷サービスは OAuth 2.0 のクライアントとして、state・PKCE（Proof Key for Code Exchange）の code_challenge・nonce を付けて、ブラウザを IdP の認可エンドポイントへ回す。許す範囲（scope）に openid を入れるので、OIDC（OpenID Connect）のログインも兼ねる。ブラウザが運ぶのは認可コードだけで、トークンはまだ出ない。","legs":[[["user","pc","net","print"],"会社の ID でログイン","ログインを始める中","印刷サービス","HTTPS（「会社の ID でログイン」のボタン）","印刷サービスには、A さんのパスワードを渡さない"],[["print","net","pc","net","idp"],"認可要求","IdP へ回される中","IdP（認可エンドポイント）","HTTP 302 → 認可要求（response_type=code・client_id・redirect_uri・scope=openid photo.read・state・code_challenge・code_challenge_method=S256・nonce）","印刷サービスは、state・code_verifier（検証コード）・nonce を作って覚えておく。code_verifier はそのまま送らず、ハッシュ値（code_challenge）だけを送る"],[["user","pc","net","idp"],"同意（写真を読む）","IdP で同意する中","IdP（認可エンドポイント）","HTTPS（同意の画面）","「印刷サービスに、写真を読むことだけ許す」。① で IdP にログインしたセッションが残っていれば、パスキーの認証は省かれ、同意だけを聞かれる（SSO：Single Sign-On）"],[["idp","net","pc","net","print"],"認可コード＋state","印刷サービスへ戻す中","印刷サービス（https://print.example.com/callback）","HTTP 302（code と state を、クエリ文字列に載せて redirect_uri へ）","印刷サービスが、戻った state を覚えた値と照らす。合わなければ、攻撃者が送り込んだ認可コードとみて捨てる"]],"r":{"user":"リソースオーナー（権限を与える利用者）。印刷サービスに渡す権限が「写真を読む」だけかを見て、同意する。","pc":"302 に従って、印刷サービスから IdP へ、IdP から印刷サービスへ移る。認可コードと state は URL に載って、ブラウザを通る。","net":"経路の途中。","print":"クライアント（OIDC では RP：Relying Party）。推測できない state・code_verifier（検証コード）・nonce を作ってセッションに覚える。code_verifier の SHA-256 のハッシュ値を BASE64URL で符号化したものが code_challenge（code_challenge_method=S256）。IdP へ回すときは、client_id・redirect_uri・scope に加えて、state・code_challenge・nonce を付ける。戻った state が覚えた値と違えば、攻撃者が自分の認可コードを送り込んだもの（OAuth の CSRF：Cross-Site Request Forgery）とみて捨てる。","idp":"認可サーバ（OIDC では OP：OpenID Provider）。A さんのログインを確かめ、印刷サービスに許す範囲（scope）の同意をとる。code_challenge と nonce を、出す認可コードに結び付けて覚える。"},"cards":["S11-2"]},{"t":"③ OAuth・OIDC のトークン","star":["idp","PKCE を照らすのは認可サーバで、認可コードを換えに来たのが、② の認可要求を出したのと同じ相手（code_verifier を持つ者）かを見る（S11-2）"],"o":"印刷サービスが、受け取った認可コードを IdP のトークンエンドポイントで2つのトークンに換える。ID トークンは「誰がログインしたか」、アクセストークンは「写真を読んでよい」の印。ここはブラウザを通らない、サーバどうしのやりとり。印刷サービスは ID トークン（JWT：JSON Web Token。JSON＝JavaScript Object Notation）を確かめてから A さんをログインさせる。","legs":[[["print","net","idp"],"認可コード＋検証コード","トークンに換える中","IdP（トークンエンドポイント）","HTTPS POST（grant_type=authorization_code・code・redirect_uri（② と同じ値）・code_verifier・クライアント認証）","ブラウザを通さず、印刷サービスから IdP へ直接送る"],[["idp","net","print"],"アクセストークン・ID トークン","トークンを受け取る中","印刷サービス","HTTPS（アクセストークンと ID トークン。この場面では、どちらも IdP が署名した JWT）","IdP は、code_verifier の SHA-256（Secure Hash Algorithm）のハッシュ値が ② の code_challenge と合うかを確かめてから出す。認可コードを横取りした者は code_verifier を知らないので、換えられない"],[["print","net","pc"],"ログイン済み","ログインを通された中","A さんの PC","HTTP Set-Cookie（印刷サービスのセッション ID）","ID トークンの署名と、中の nonce が ② で覚えた値かを確かめて、A さんとしてログインさせた。トークンそのものはブラウザに渡さない"]],"r":{"print":"認可コードと code_verifier を、トークンエンドポイントへ直接送る。受け取った ID トークンの署名・発行者（iss）・宛先（aud）・期限（exp）を確かめ、中の nonce が ② で覚えた値と同じかを照らす。ログインに使うのは ID トークン。アクセストークンは「何をしてよいか」の印で、「誰か」の証明ではない。","net":"経路の途中。中身は暗号文（HTTPS）。","idp":"認可コードが自分の出したもので、まだ使われていないか、redirect_uri が ② と同じかを確かめる。code_verifier の SHA-256 のハッシュ値を ② の code_challenge と照らし、合えば、アクセストークンと ID トークンに署名して返す。認可コードを横取りした攻撃者は code_verifier を知らないので、トークンに換えられない。","pc":"印刷サービスのセッション Cookie を受け取る。トークンは印刷サービスのサーバに残り、ブラウザには届かない。"},"cards":["S11-2"]},{"t":"④ OAuth で API を呼ぶ","star":["api","トークンが言う alg を信じると、署名の無い偽のトークンで誰にでもなれるので、受け入れる alg はサーバの側で固定する（S11-4）"],"o":"印刷サービスが、アクセストークンを付けて会社の写真の API を呼ぶ。API は JWT の署名を確かめてから、中の利用者・権限・期限を読む。攻撃者は、手に入れた JWT の中身を書き換え、署名を外して試しに来る。","legs":[[["print","net","api"],"Bearer トークン","写真を取りに行く中","写真の API","HTTPS GET（Authorization: Bearer <アクセストークン>）","Bearer は「持っている人が使える」形のトークン。印刷サービスは A さんのパスワードを知らないまま、許された写真だけを読む"],[["api","net","print"],"写真","写真を受け取る中","印刷サービス","HTTP 200（写真のデータ）","API は署名・期限・scope を確かめ、その写真を A さんが見てよいかも確かめてから返す"],[["bad","net","api"],"alg=none の JWT","書き換えたトークンを試す中","写真の API","HTTPS（ヘッダの alg を none にし、利用者と権限を書き換えた、署名の無い JWT）","署名だけの JWT の中身は BASE64URL で符号化しただけなので、誰でも読めて書き換えられる"],[["api","net","bad"],"401 拒否","はねられる中","攻撃者","HTTP 401 Unauthorized","API は受け入れる alg を、IdP が使う署名の方式だけに固定している。none の JWT は通さない"]],"r":{"print":"アクセストークンを Authorization ヘッダに入れて API を呼ぶ。Bearer トークンは、持っている人なら誰でも使えるので漏らさない。","net":"経路の途中。","api":"リソースサーバ。サーバ側にセッションを持たず（ステートレス）、JWT の署名を IdP の公開鍵で確かめ、発行者（iss）が IdP か・宛先（aud）が自分か・期限（exp）を見てから、中の利用者・scope を読む。受け入れる alg は自分の側で固定し、トークンのヘッダが言う alg を信じない。利用者が分かっても、その写真を読んでよいかの認可は毎回する。決まった値の API キーだけで呼ばせる形だと、漏れたキーは誰でも使え、誰が呼んだかも見分けられない。","bad":"署名だけの JWT は、ヘッダ・ペイロード・署名を BASE64URL で符号化して「.」でつないだもので、暗号化ではない。中身を読んで利用者と権限を書き換え、alg を none にして署名を外す。none を受け入れる実装なら、好きな利用者・権限になれる。"},"cards":["S11-4"]},{"t":"⑤ Kerberos","star":["dc","TGT を暗号化する krbtgt の鍵を持つのはドメインコントローラだけで、ここで鍵を取られると、どの利用者の TGT も作られる（⑥。S11-5）"],"o":"A さんは朝、会社の PC に Windows のドメインのアカウントでサインインした。このドメインのアカウントは、①〜④ の IdP の ID とは別のもの。サインインのとき、ドメインコントローラが KDC（Key Distribution Center）として、TGT（Ticket Granting Ticket）を出す。午後にファイルサーバを開くと、TGT を見せてファイルサーバ用の ST（Service Ticket）をもらい、ST で入る。","legs":[[["pc","dc"],"認証要求","朝、サインインする中","ドメインコントローラ（KDC）","Kerberos AS-REQ（AS：Authentication Service への要求。A さんのパスワードから作った鍵で、今の時刻を暗号化して付ける）","パスワードそのものはネットワークに流さない"],[["dc","pc"],"TGT","TGT を受け取る中","A さんの PC","Kerberos AS-REP（TGT は krbtgt アカウントの鍵で暗号化してある）","PC には TGT の中身が読めない。読めるのは KDC だけ"],[["pc","dc"],"TGT＋行き先","午後、ST を頼む中","ドメインコントローラ（KDC）","Kerberos TGS-REQ（TGS：Ticket Granting Service への要求。TGT を見せ、ファイルサーバ用の ST を頼む）","TGT があるので、パスワードを打ち直さずに済む"],[["dc","pc","fs"],"ST","ST を見せて入る中","ファイルサーバ","Kerberos TGS-REP → AP-REQ（AP：Application。ファイルサーバの鍵で暗号化した ST と、セッション鍵（ST と一緒に受け取った鍵）で時刻を暗号化したオーセンティケータを渡す）","ファイルサーバは自分の鍵で ST を復号できれば、KDC が出したものと分かる"]],"r":{"pc":"サインインのとき、パスワードから作った鍵で時刻を暗号化して送り、TGT を受け取る。ファイルサーバを開くと、TGT を見せて ST をもらい、ST をファイルサーバへ渡す。TGT も ST も、PC の側では中身を読めない。","dc":"KDC。自分が持つ、A さんのパスワードから作った鍵で、要求の時刻を復号して確かめる。TGT は krbtgt アカウントの鍵で暗号化して出す。TGT が来たら krbtgt の鍵で復号して中の利用者を読み、ファイルサーバの鍵で暗号化した ST を出す。","fs":"ST を自分の鍵で復号し、中の利用者と期限を読む。復号できれば KDC が出したものと分かるので、ドメインコントローラに問い合わせなくても A さんを入れられる。A さんのパスワードは受け取らない。"},"cards":["S11-5"]},{"t":"⑥ ゴールデンチケット（Kerberos）","star":["bad","ゴールデンチケットは TGT の偽造で、そのまま通じるのは Kerberos のチケットを信じる所だけ（S11-5）"],"o":"攻撃者が社内に入り込み、ドメインの管理者の権限を奪って、ドメインコントローラから krbtgt アカウントのパスワードのハッシュ値を盗んだ。このハッシュ値が、⑤ で TGT を暗号化していた krbtgt の鍵。これで、好きな利用者・権限の TGT を自分で作れる（ゴールデンチケット）。気づいた管理者が krbtgt のパスワードを2回変えると、盗んだ鍵の TGT は通らなくなる。","legs":[[["dc","bad"],"krbtgt のハッシュ値","鍵を盗まれる中","攻撃者","ドメインの管理者の権限で、ドメインコントローラのアカウント情報から読み出す","これが TGT を暗号化している鍵。手元で TGT を作れる"],[["bad","dc"],"偽造した TGT","偽の TGT を見せる中","ドメインコントローラ（KDC）","Kerberos TGS-REQ（盗んだ鍵で作った TGT。利用者・グループ・期限を好きに書く）","本物の鍵で暗号化してあるので、ドメインコントローラは本物と見分けられない"],[["dc","bad","fs"],"ST","ST を見せて入る中","ファイルサーバ","Kerberos TGS-REP → AP-REQ","ファイルサーバから見れば、正しく出された ST。TGT に書いた権限のまま中身を読める"],[["bad","dc"],"古い鍵の TGT","もう一度試す中","ドメインコントローラ（KDC）","Kerberos TGS-REQ（盗んだ鍵で作った TGT）","管理者が krbtgt のパスワードを2回変えたあと。古い鍵で作った TGT は復号できず、はねる"]],"r":{"dc":"TGT が krbtgt の鍵で復号できれば、中に書かれた利用者と権限をそのまま信じる。だから krbtgt の鍵を盗まれないよう、ドメインコントローラへの侵入を防ぎ、管理者の権限を絞る。偽造が疑われたら krbtgt のパスワードを2回変える（1回目のあと、チケットの期限が切れるのを待ってから2回目）。ドメインコントローラは1つ前の鍵で作った TGT も受け入れるので、1回では盗まれた鍵が生き残る。","bad":"盗んだ鍵で、好きな利用者・グループ・期限の TGT を手元で作る。その利用者のパスワードを知らなくても、利用者がパスワードを変えても使える。チケットがそのまま通じるのは、Kerberos のチケットを信じる所だけ。この場面では、IdP でログインする ①〜④ のサービスには、これでは直接は入れない（ドメインのアカウントは IdP の外にあるため）。","fs":"ST を自分の鍵で復号できるので、正しい ST として受け入れる。元の TGT が偽造されたものかは、ファイルサーバには分からない。"},"cards":["S11-5"]},{"t":"⑦ 退職で止める","star":["idp","1つの ID で全部に入れる分、IdP で止めれば、つないだサービスの新しいログインは全部止まり、取られれば全部に入られる（S11-3）"],"o":"A さんが退職した。情報システム部が、IdP の A さんのアカウントと登録したパスキーを消す。SaaS も印刷サービスも、新しいログインは IdP を通るので、まとめて止まる。ただし、もう出ているアクセストークンとログイン済みのセッションは、この場面では期限まで使える。ドメインのアカウント（⑤）は IdP の外にあるので、別に無効にする。","legs":[[["pc","net","saas"],"開く","ログインを試す中","業務の SaaS","HTTPS（A さんの ID でページを開く）","退職のあと、誰かが A さんの ID でログインしようとしても…"],[["saas","net","pc","net","idp"],"SAML 認証要求","IdP へ回される中","IdP（IDaaS）","HTTP リダイレクト（SAMLRequest）","① と同じく、ログインは IdP に回される"],[["idp","net","pc"],"ログインできない","はねられる中","A さんの PC","HTTP 応答（アカウントが無いので、アサーションを出さない）","IdP が認証しないので、SaaS にも印刷サービスにも、新しくは入れない"],[["print","net","api"],"前に出たトークン","④ のトークンが期限まで使われる中","写真の API","HTTPS（Authorization: Bearer <退職の前に出たアクセストークン>）","この場面の API は IdP に問い合わせず、署名と期限を自分で確かめる。期限までは通るので、期限を短くしておく"]],"r":{"pc":"いつもどおり SaaS から IdP へ回されるが、IdP でログインできない。","net":"経路の途中。","saas":"ログインは IdP に任せているので、IdP が認証しなければ入れない。ただし、IdP を通らない SaaS 独自のアカウント・パスワードが残っていると、IdP で止めても使える。すでにログイン済みのセッションも、この場面では SaaS の期限までは残る。","idp":"A さんのアカウントとパスキーを消したので、認証しない。SAML のアサーションも、OIDC の認可コード・トークンも、新しくは出さない。1か所で止めれば、つないだ全部のサービスに新しく入れなくなる。","print":"退職の前に受け取ったアクセストークンで、API を呼ぶ。IdP でログインし直しても、新しいトークンはもう受け取れない。","api":"この場面の API は IdP に問い合わせず、トークンの署名と期限を自分で確かめるので、期限が切れるまでは通してしまう。アクセストークンの期限を短くしておくと、止まるまでの時間が短くなる。"},"cards":["S11-3"]}]},{"group":"4","scene":"13","title":"経費精算サービスに登録して、ログインを守る（身元確認・パスワード・多要素認証・フィッシング・パスキー）","goal":"A さん本人だけが、A さんとしてログインできる（偽の画面が中継したログインも通らない）","focus":"攻撃者は、登録・保存・ログイン・再設定のうち、いちばん弱い所をねらう。経費精算サービスと認証情報の保管・A さんのスマホ（認証アプリ）・偽のログイン画面・A さんの PC（認証器）のそれぞれの立場で、何を確かめていて、何を区別できないかを見る","example":"出張の交通費を精算するため、社員の A さんは、会社が使い始めたクラウドの経費精算サービス（https://keihi.example.jp）に登録する。精算金は A さん名義の口座へ振り込まれるので、なりすまされると振込先を書き換えられうる。そこでサービスは、登録のときに、A さんが実在の本人かを、オンラインの身元確認 eKYC（electronic Know Your Customer）で確かめる。A さんは、パスワードと、スマホの認証アプリが出すワンタイムパスワード OTP（One-Time Password）でログインする。ひと月後、A さんはパスワードを忘れて決め直したが、よその通販サイトと同じパスワードにしてしまった。攻撃者は、その通販サイトから漏れた ID とパスワードの組で、ログインを試す。次は、精算の不備を知らせるふりをしたメールで、偽のログイン画面へ誘う。そのあと会社は、ログインをパスキーに切り替え、パスワード＋OTP でのログインを止める","note":"keihi.example.jp と keihi.example.com は、説明用に取っておかれた名前（実在のサービスではない）","zones":[[16,16,230,344,"#EEEDFE","A さんの手元","#3C3489"],[282,130,116,112,"#E6F1FB","",""],[430,16,246,150,"#E1F5EE","クラウド","#085041"],[430,184,246,180,"#FAECE7","攻撃者の手元","#712B13"]],"nodes":{"user":{"x":60,"y":110,"label":"A さん","type":"user","labelPos":"above"},"pc":{"x":190,"y":180,"label":"A さんの PC","type":"pc","labelPos":"above"},"phone":{"x":60,"y":280,"label":"A さんのスマホ","type":"phone"},"net":{"x":340,"y":180,"label":"インターネット","type":"net","labelPos":"above"},"srv":{"x":500,"y":100,"label":"経費精算サービス","type":"srv","labelPos":"above"},"db":{"x":620,"y":100,"label":"認証情報の保管","type":"db"},"fake":{"x":610,"y":250,"label":"偽のログイン画面","type":"srv","labelPos":"above"},"bad":{"x":480,"y":310,"label":"攻撃者","type":"bad"}},"edges":[["user","pc"],["user","phone"],["pc","phone"],["pc","net"],["phone","net"],["net","srv"],["srv","db"],["net","fake"],["net","bad"],["fake","bad"]],"route":[["user","がスマホで本人確認書類と顔を撮り、実在の本人だと確かめてもらう",[["eKYC（身元確認）",""],["HTTPS（Hypertext Transfer Protocol Secure）","L7"]]],["srv","がパスワードに A さん用のソルト（ランダムな値）を付けてハッシュ値にし、保管する",[["ソルト付きハッシュ",""],["ストレッチング（計算の繰り返し）",""]]],["user","がパスワードと、認証アプリの OTP（One-Time Password）でログインする",[["HTTPS","L7"],["TOTP（Time-based One-Time Password）",""]]],["user","がパスワードを忘れ、登録した宛先に届いた URL から決め直す",[["HTTPS","L7"],["SMTP（Simple Mail Transfer Protocol）","L7"]]],["bad","が、よそで漏れた ID とパスワードの組を、1組ずつそのまま試す",[["HTTPS","L7"]]],["bad","が偽のログイン画面で、ID・パスワード・OTP をその場で本物のサービスへ中継し、セッション Cookie を奪う",[["HTTPS","L7"],["TOTP",""],["Cookie","L7"]]],["pc","に組み込まれた認証器が、パスキー（サイトごとの鍵）で、チャレンジ（毎回変わるランダムな値）に署名する。偽の画面からは、本物で通る署名が返らない",[["WebAuthn（Web Authentication）","L7"],["デジタル署名",""]]]],"steps":[{"t":"① 身元確認","star":["srv","身元確認（登録のとき実在の本人か）と当人認証（ログインのとき登録した本人か）を分けて問われる（S10-6）"],"o":"A さんがスマホで、写真付きの本人確認書類と自分の顔を撮って送る。サービスが、書類の顔写真といま撮った顔を照らして実在の本人だと確かめ、その本人に ID（A さんのメールアドレス）を結び付ける。","legs":[[["user","phone","net","srv"],"書類と顔の画像","身元を確かめてもらう中","経費精算サービス","eKYC（本人確認書類＋その場で撮った顔）を HTTPS で送る","「写真付きの書類と、いまの私の顔です」"],[["srv","net","phone"],"登録できた","登録の結果を受け取る中","A さんのスマホ","HTTPS（登録の完了）","確かめた本人に ID を結び付けた。次は、この ID で使う認証の材料を決める"]],"r":{"user":"写真付きの本人確認書類と、自分の顔を、スマホのカメラでその場で撮る。","phone":"撮った画像を TLS で暗号化して送り、登録の結果を受け取る。","net":"経路の途中。中身は暗号文。","srv":"書類の顔写真と、いま撮った顔を照らす。事前に用意した写真や動画ではなく、その場で撮ったものか（ライブネス）も確かめる。ここが弱いと、他人の書類でその人になりすまして登録した攻撃者も、あとのログインでは正規の利用者として通ってしまう。書類の IC チップを読み取る方式は、書類の偽造に強い。"},"cards":["S10-6"]},{"t":"② パスワードの保存","star":["db","保管の中身が盗まれても、ソルトとストレッチング（計算の繰り返し）で、パスワードの割り出しを遅らせる所（S10-2）"],"o":"① で身元を確かめた ID に結び付けて、A さんが PC のブラウザからパスワードを決める。サービスはパスワードそのものを保存せず、A さん用のソルトを付けたハッシュ値にして保管する。","legs":[[["pc","net","srv"],"ID・パスワード","パスワードを決める中","経費精算サービス","HTTPS（TLS で暗号化して送る）","① で身元を確かめた A さんの ID に、このパスワードを結び付ける。経路の上では暗号文で、サービスには復号した平文のパスワードが届く"],[["srv","db"],"ソルト・ハッシュ値","保管する中","認証情報の保管","ハッシュ関数（ソルト＋パスワード。計算を何度も繰り返す）","パスワードそのものは残さない。ソルトとハッシュ値を並べて置く"]],"r":{"pc":"ID とパスワードを、TLS で暗号化して送る。","net":"経路の途中。中身は暗号文。","srv":"A さん用のソルト（ランダムな値）を作り、パスワードと連結してハッシュ値を計算する。計算を何度も繰り返して（ストレッチング）、1回の試行を遅くする。ログインのときは、保存したソルトと入力を連結して同じ計算をし、一致を見る。","db":"ソルトとハッシュ値を並べて持つ。ソルトは照合に要るので秘密にしない。盗まれても、ソルトがあるので事前に計算した表（レインボーテーブル）が使えず、同じパスワードの利用者もまとめては分からない。"},"cards":["S10-2"]},{"t":"③ 多要素認証","star":["phone","OTP はシークレットと時刻だけで決まるので、シークレットを持つスマホが「所持」の証になり、シークレットが漏れれば誰でも同じ値を作れる（S10-4）"],"o":"A さんが認証アプリを設定し、パスワード（知識）とスマホの OTP（所持）でログインする。TOTP（Time-based One-Time Password）では、アプリとサービスが、最初に共有した秘密の値（シークレット）と今の時刻から、同じ値を計算する。","legs":[[["srv","net","pc","phone"],"シークレット（QR）","認証アプリを設定する中","A さんのスマホ（認証アプリ）","TOTP の初期設定（シークレットを QR コードで渡す）","パスワードでログインした後の設定画面に出た QR コードを、スマホの認証アプリで読む。サービスとアプリが同じシークレットを持つ"],[["pc","net","srv","db"],"ID・パスワード","1つ目の要素を送る中","経費精算サービス → 認証情報の保管","HTTPS（ID・パスワード）","保存したソルトで同じ計算をして、ハッシュ値が一致するかを見る"],[["phone","user","pc","net","srv"],"OTP 6桁","2つ目の要素を入れる中","経費精算サービス","TOTP（シークレット＋今の時刻から計算。ふつうは30秒ごとに変わる）","A さんがアプリの6桁を読んで、PC に打ち込む。サービスも同じ計算をして照らす"],[["srv","net","pc"],"ログイン済み","セッション Cookie を受け取る中","A さんの PC","HTTP Set-Cookie（セッション ID）","知識と所持の2つがそろった。ここからは、セッション ID を入れた Cookie（セッション Cookie）で「ログイン済み」を示す"]],"r":{"srv":"QR コードでシークレットを渡す。ログインでは、まずパスワードを照らし、次にシークレットと今の時刻から OTP を計算して入力と照らす。違う種類（知識と所持）を組み合わせるので多要素認証になる。パスワードに秘密の質問を足すような同じ種類の重ねがけは多段階認証で、多要素認証にはならない。","net":"経路の途中。中身は暗号文。","pc":"QR コードを画面に出す。パスワードと OTP を TLS で送り、最後にセッション Cookie を受け取る。","phone":"認証アプリが QR コードからシークレットを取り込む。以後は、シークレットと今の時刻から、OTP を出す（ふつうは30秒ごとに変わる6桁）。計算に通信は要らない。","user":"アプリに出た6桁を読んで、PC に打ち込む。","db":"A さんのソルトとハッシュ値を出して、照合に使わせる。TOTP のシークレットも、ここに持つ。照合のたびに計算に使うのでハッシュ値にはできず、暗号化して持つ。漏れると OTP を作られる。"},"cards":["S10-4"]},{"t":"④ パスワードの再設定","star":["srv","再設定の URL を受け取った人は、今のパスワードを知らなくても決め直せるので、ここがログインより弱い入口になりやすい（S10-3）"],"o":"ひと月後、A さんはパスワードを忘れた。サービスはパスワードを送らず、登録してある宛先に、使い捨て・期限付きの再設定 URL を送る。","legs":[[["pc","net","srv"],"忘れた：アドレス","再設定を頼む中","経費精算サービス","HTTPS（「パスワードを忘れた」の画面にメールアドレスを入れる）","画面には、登録があってもなくても同じ「メールを送信しました」が出る"],[["srv","net","pc"],"再設定 URL","メールを受け取る中","A さんのメール（登録してある宛先）","メール（推測できない値を含む、1回だけ・期限付きの URL）","A さんの PC のメールに届く。サービスは SMTP で送り、PC は IMAP（Internet Message Access Protocol）などで受け取る（メールサーバは図では省いた）"],[["pc","net","srv","db"],"新しいパスワード","パスワードを決め直す中","経費精算サービス → 認証情報の保管","HTTPS（URL の値＋新しいパスワード）","サービスは URL の値と期限を確かめて、その URL を無効にする。保存のときと同じく、ソルトを付けて繰り返し計算し、ハッシュ値を作り直す"]],"r":{"pc":"「忘れた」の画面にメールアドレスを入れる。届いたメールの URL を開き、新しいパスワードを決める。","net":"経路の途中。","srv":"登録の有無にかかわらず、同じ表示を返し、応答の時間もそろえる（違うと、登録済みの ID を攻撃者に教える）。登録してある宛先にだけ、推測できない値を含む URL を送る。URL を受け取った人は、今のパスワードを知らなくても決め直せるので、1回だけ・短い期限で使えるようにする。","db":"新しいパスワードのソルトとハッシュ値に置き換える。"},"cards":["S10-3"]},{"t":"⑤ パスワードリスト攻撃","star":["srv","同じ ID の連続失敗を数えるロックは、ID ごとに1回しか試さない攻撃には効かない（S10-1）"],"o":"攻撃者はまず「忘れた」の画面で、どのメールアドレスが登録済みかを探る（同じ表示しか返らないので、この画面からは絞れない）。次に、よその通販サイトから漏れた ID とパスワードの組を、1組ずつ（1つの ID に1回ずつ）試す。A さんは決め直したパスワードを、その通販サイトでも使っていた。","legs":[[["bad","net","srv"],"登録済み？","ID の有無を探る中","経費精算サービス（「忘れた」の画面）","HTTPS（漏れたメールアドレスを次々に入れる）","表示が違えば、登録済みの ID だけに候補を絞れる"],[["srv","net","bad"],"同じ表示","答えを受け取る中","攻撃者","HTTP 応答（登録の有無で同じ文面）","「メールを送信しました」しか返らない。この画面の表示からは、どれが登録済みか見分けられない"],[["bad","net","srv","db"],"漏れた ID・パスワード","ログインを試す中","経費精算サービス → 認証情報の保管","HTTPS（よそで漏れた組を、ID ごとに1回ずつ）","1つの ID に1回ずつなので、アカウントロックにかからない。A さんの組は一致した"],[["srv","net","bad"],"OTP を入れて","2つ目の要素を求められる中","攻撃者","HTTP 応答（OTP の入力画面）","パスワードは当たった。でも A さんのスマホが無いので、OTP が作れず先に進めない"]],"r":{"bad":"よそで漏れた ID とパスワードの組を、そのまま試す（使い回しが前提）。1つの ID でパスワードを変えるのが総当たり・辞書攻撃、1つのパスワードで ID を変えるのが逆総当たり攻撃。","net":"経路の途中。","srv":"アカウントロックは同じ ID の連続失敗を数えるので、ID ごとに1回しか試さない攻撃には効かない。効くのは、多要素認証・パスワードの使い回しをさせないこと（サービスの側では、漏れたパスワードの一覧と照らして登録を断る）・ログインできるアクセス元 IP（Internet Protocol）アドレスの制限。オンラインの試行なので、失敗の記録はここに残る。","db":"保存したソルトとハッシュ値で照らされ、A さんの組は使い回しのために一致する。盗まれたハッシュ値を攻撃者が手元で計算する（オフライン）なら、試行はサービスに届かず、ロックも失敗の記録も起きない。そのときに効くのが ② のソルトとストレッチング。"},"cards":["S10-1","S10-3"]},{"t":"⑥ 中継型フィッシング","star":["fake","利用者と本物のサービスの間に入って中継するので、OTP があっても破られる（S10-5）"],"o":"A さんに、サービスを装った「先月の精算に不備があります。こちらから再申請してください」というメールが届き、A さんはリンクから偽のログイン画面（https://keihi.example.com）を開いた。偽の画面は、間に入る AiTM（Adversary-in-the-Middle）の手口で、ID・パスワード・OTP をその場で本物のサービスへ流し、本物が発行したセッション Cookie を奪う。","legs":[[["pc","net","fake","net","srv"],"ID・パスワード","偽の画面に入れてしまう中","偽のログイン画面 → 本物","HTTPS（偽のドメインと TLS を結ぶ。受け取った値はそのまま本物へ）","見た目は本物そっくりで、違うのはドメインだけ。本物が OTP を求めると、偽の画面も OTP の欄を出す"],[["phone","user","pc","net","fake","net","srv"],"OTP 6桁","OTP を中継される中","偽のログイン画面 → 本物","TOTP（有効時間のうちに中継）","A さんが読んで入れた6桁を、攻撃者が有効時間のうちに本物へ流す"],[["srv","net","fake","bad"],"セッション Cookie","ログイン済みの印を奪われる中","攻撃者","HTTP Set-Cookie（本物が発行したセッション ID）","パスワードも OTP も正しいので、本物はログインを通す。受け取ったのは偽の画面"],[["bad","net","srv"],"奪った Cookie","A さんになりすます中","経費精算サービス","HTTPS（Cookie ヘッダにセッション ID）","認証を済ませた状態のまま使われる。多要素認証の強さは、もう関係ない"]],"r":{"pc":"メールのリンクから偽の画面を開く。TLS は偽のドメインとの間で正しく結ばれる。暗号化されていても、相手が偽物なら守れない。","user":"アプリに出た6桁を読んで、偽の画面に打ち込む。OTP も SMS（Short Message Service）の確認コードも、人が読んで入れる値なので、どのサイトに入れたかは区別されない。","phone":"いつもどおり、シークレットと時刻から OTP を出す。どのサイトで使われるかは知らない。","net":"経路の途中。","fake":"本物そっくりの画面で ID・パスワード・OTP を受け取り、その場で本物へ流す。本物が返したセッション Cookie も受け取って、攻撃者に渡す。","srv":"届いたパスワードも OTP も正しいので、ログインを通して Cookie を発行する。見える送信元は、A さんの PC ではなく、偽の画面のサーバの IP アドレス。","bad":"受け取ったセッション Cookie を自分のブラウザに入れ、A さんとして経費精算サービスに入り、振込先の口座を書き換える。"},"cards":["S10-5"]},{"t":"⑦ パスキー","star":["pc","署名にオリジンが入り、鍵もサイトごとなので、偽の画面では本物で通る署名が作れない（S10-4・S10-5）"],"o":"中継型フィッシングの被害を受けて、会社は、ログインを FIDO（Fast IDentity Online）のパスキーに切り替え、パスワード＋OTP でのログインを止めた。PC に組み込まれた認証器が、サイトごとに鍵ペアを持つ。ログインでは、顔か PIN（Personal Identification Number）で A さんを確かめてから、サービスが送るチャレンジ（毎回変わるランダムな値）とオリジン（スキーム・ホスト名・ポートの組。ここでは https://keihi.example.jp）を含むデータに、そのサイト用の秘密鍵で署名する。この手順が WebAuthn（Web Authentication）。","legs":[[["pc","net","srv","db"],"公開鍵","パスキーを登録する中","経費精算サービス → 認証情報の保管","WebAuthn の登録（このサイト用の鍵ペアを作り、公開鍵だけ送る）","PC に組み込まれた認証器なので、秘密鍵は PC の外に出ない（パスキーには、複数の端末で同期する形もある）"],[["srv","net","pc"],"チャレンジ","ログインの問いを受け取る中","A さんの PC","WebAuthn（サービスが毎回作るランダムな値）","毎回違う値なので、前の署名は使い回せない"],[["pc","net","srv"],"署名","署名を返す中","経費精算サービス","WebAuthn（チャレンジ＋オリジン https://keihi.example.jp に秘密鍵で署名）","A さんが顔か PIN で本人だと示すと（利用者確認）、認証器が署名する。サービスは公開鍵で検証する"],[["srv","net","fake","net","pc"],"チャレンジ（中継）","偽の画面から試される中","A さんの PC","WebAuthn（ブラウザが渡すのは、いま開いている偽のオリジン https://keihi.example.com）","認証器に、偽のドメイン用の鍵は無い。本物で通る署名は作れず、中継するものが返らない"]],"r":{"pc":"組み込みの認証器が、サイトごとに鍵ペアを作り、公開鍵だけを登録する。ログインでは、顔か PIN で A さんを確かめてから（顔の情報や PIN は PC の中で照らし、サービスへは送らない）、チャレンジとオリジンを含むデータに秘密鍵で署名する。偽の画面では、ブラウザが偽のオリジンを渡すので、本物用の鍵は使われない。ただし、ログインした後の PC をマルウェアに握られると、A さんとして通信される。","net":"経路の途中。","srv":"毎回ランダムなチャレンジを送る。返ってきた署名を登録した公開鍵で検証し、署名の中のオリジンが自分のもの（https://keihi.example.jp）かも確かめる。パスワード＋OTP の道を残すと、偽の画面はそちらだけを出して ⑥ と同じ中継をする。","db":"A さんの公開鍵を持つ。公開鍵は漏れても、署名は作れない。","fake":"本物からチャレンジを取ってきて、A さんのブラウザに渡す。でも本物で通る署名は返ってこない。仮に署名が作れても、中のオリジンが偽物なので、本物の検証で落ちる。"},"cards":["S10-4","S10-5"]}]},{"group":"4","scene":"14","title":"取引先に見積書を送り、注文を受けるまで（暗号・ハッシュ・メッセージ認証コード・署名・鍵の保管）","goal":"見積書が B さんにだけ読める形で届き、B さんが「書き換えられていない・A さんが作った」と確かめられ、続く注文も、受注サーバが「書き換えられていない・購買サーバから来た」と確かめてから受け付ける","focus":"どの鍵を誰が持ち、何に使うか（見積書を暗号化する共通鍵・公開鍵・秘密鍵・注文に付ける HMAC の鍵）。攻撃者には何ができて、何ができないか","example":"月末、営業の A さんが、取引先の B さんに来期の見積書（PDF）をメールで送る。B さんからは先週、署名付きのメールで見積の依頼が来ている。金額は B さん以外に見せたくない。途中で書き換えられては困るし、A さんが出したものだと示したい。そこで、メールソフトの S/MIME（Secure/Multipurpose Internet Mail Extensions）で署名と暗号化をする。方式は、CRYPTREC（Cryptography Research and Evaluation Committees）暗号リストから選ぶ決まりになっている。A さんと B さんの秘密鍵はそれぞれの PC の TPM（Trusted Platform Module）に、2人の証明書を出す認証局の秘密鍵は HSM（Hardware Security Module）に入っている。B さんが見積を承認すると、取引先の購買サーバから A さんの会社の受注サーバへ、HMAC（Hash-based Message Authentication Code）を付けた注文が届く。インターネットには、偽の公開鍵や偽の見積書・注文を送りつけてくる攻撃者がいる","note":"a@example.jp・b@example.com は、説明用に取っておかれた名前（実在のアドレスではない）","zones":[[16,16,136,356,"#EEEDFE","A さんの会社","#3C3489"],[176,16,230,118,"#FAEEDA","信頼する第三者","#633806"],[286,182,108,84,"#E6F1FB","",""],[422,68,100,122,"#FAECE7","攻撃者の手元","#712B13"],[528,16,136,356,"#E1F5EE","取引先","#085041"]],"nodes":{"ua":{"x":70,"y":110,"label":"A さん","type":"user","labelPos":"above"},"pca":{"x":70,"y":215,"label":"A さんの PC","type":"pc"},"sva":{"x":70,"y":325,"label":"受注サーバ","type":"srv"},"ca":{"x":230,"y":80,"label":"認証局","type":"srv"},"hsm":{"x":350,"y":80,"label":"HSM","type":"box"},"net":{"x":340,"y":215,"label":"インターネット","type":"net"},"bad":{"x":480,"y":130,"label":"攻撃者","type":"bad"},"ub":{"x":610,"y":110,"label":"B さん","type":"user","labelPos":"above"},"pcb":{"x":610,"y":215,"label":"B さんの PC","type":"pc"},"svb":{"x":610,"y":325,"label":"購買サーバ","type":"srv"}},"edges":[["ua","pca"],["pca","net"],["sva","net"],["ca","net"],["ca","hsm"],["bad","net"],["pcb","net"],["svb","net"],["ub","pcb"]],"route":[["ua","が守ることを決め、方式を CRYPTREC（Cryptography Research and Evaluation Committees）暗号リストから選ぶ",[["CRYPTREC 暗号リスト",""]]],["pca","が TPM（Trusted Platform Module）の中で鍵ペアを作り、認証局（CA：Certification Authority）から証明書をもらう。認証局は HSM（Hardware Security Module）の中の秘密鍵で署名する",[["CSR（Certificate Signing Request）",""],["X.509 証明書",""]]],["pca","が B さんの証明書を認証局までたどって確かめ、攻撃者がすり替えた公開鍵をはじく",[["証明書の検証",""]]],["pca","が見積書のハッシュ値を、TPM の中の A さんの秘密鍵で署名する",[["SHA-256（Secure Hash Algorithm）",""],["ECDSA（Elliptic Curve Digital Signature Algorithm）",""]]],["pca","が見積書を共通鍵で暗号化し、その鍵を B さんの暗号化用の公開鍵で包んで送る",[["AES（Advanced Encryption Standard）",""],["RSA-OAEP（Optimal Asymmetric Encryption Padding）",""],["S/MIME（Secure/Multipurpose Internet Mail Extensions）","L7"]]],["pcb","が TPM の中の暗号化用の秘密鍵で共通鍵を取り出して復号し、A さんの公開鍵で署名を検証する",[["RSA-OAEP",""],["AES",""],["ECDSA",""]]],["svb","が、受注サーバと共有する HMAC（Hash-based Message Authentication Code）の鍵で、注文に HMAC を付けて送る。受注サーバが同じ HMAC の鍵で計算し直して比べる",[["HMAC-SHA256",""],["HTTPS","L7"]]]],"steps":[{"t":"① 方式を選ぶ","star":["pca","全体の強さは、鍵の長さ・鍵の置き場・暗号化していない区間のうち、いちばん弱い所で決まる（S04-4）"],"o":"A さんは守ること（金額を B さんだけに見せる・書き換えに気づける・A さんが作ったと示せる）を決め、メールソフトの方式を、CRYPTREC 暗号リスト（電子政府推奨暗号リスト・推奨候補暗号リスト・運用監視暗号リストの3つ）のうち電子政府推奨暗号リストから選ぶ。暗号化は AES（Advanced Encryption Standard）と、共通鍵を包む RSA-OAEP（Optimal Asymmetric Encryption Padding）、署名はハッシュ関数 SHA-256（Secure Hash Algorithm）と ECDSA（Elliptic Curve Digital Signature Algorithm）にする。","legs":[[["ua","pca"],"方式の設定","使う暗号を選び中","A さんの PC（メールソフト）","AES・SHA-256・ECDSA・RSA-OAEP（電子政府推奨暗号リスト）","MD5（Message Digest 5）はどのリストにも無い。SHA-1 は運用監視暗号リストで、互換性を保つためだけに使ってよい"],[["pca","ua"],"弱い所の点検","点検の結果を見せ中","A さん","鍵の長さ・鍵の置き場・暗号化していない区間","いちばん弱い所の例：暗号化したファイルとパスワードを同じメールで送ると、両方を盗めば読める"]],"r":{"ua":"守ること（金額を B さんだけに見せる・書き換えに気づける・A さんが作ったと示せる）を先に決め、合う方式を電子政府推奨暗号リストで確かめる。","pca":"署名と暗号化の方式を、リストにあるものに設定する。全体の強さは、鍵の長さ・鍵の置き場・暗号化していない区間のうち、いちばん弱い所で決まる。"},"cards":["S04-4"]},{"t":"② 鍵と証明書","star":["hsm","秘密鍵は書き出せない装置の中で作り、署名も中で行う（S04-3）"],"o":"A さんの PC は TPM の中で署名用の鍵ペアを作り、公開鍵を CSR（Certificate Signing Request）に入れて認証局に送る。認証局は HSM の中の秘密鍵で A さんの証明書に署名して返す（B さんも同じ手順で、署名用（ECDSA）の証明書と、共通鍵を受け取る暗号化用（RSA）の証明書を持っている。鍵ペアは用途ごとに分ける）。","legs":[[["pca","net","ca"],"CSR（公開鍵）","証明書を申し込み中","認証局","CSR（a@example.jp・A さんの公開鍵。TPM の秘密鍵で署名）","送るのは公開鍵だけ。秘密鍵は、平文では TPM の外に出ない"],[["ca","hsm"],"署名して","証明書への署名を頼み中","HSM","署名する証明書の中身（名前・公開鍵・期限）","認証局の秘密鍵は HSM の中にあり、平文では取り出せない"],[["hsm","ca"],"署名の値","署名を返し中","認証局","証明書の中身への署名の値","鍵は HSM の中のまま"],[["ca","net","pca"],"A さんの証明書","証明書を届け中","A さんの PC","X.509 証明書（認証局の署名付き）","A さんの名前と公開鍵が、認証局の署名で結び付いた"]],"r":{"pca":"TPM の中で鍵ペアを作る。秘密鍵は、平文では TPM から書き出せない。秘密鍵を持っていることを示すため、CSR にもその秘密鍵で署名して送る。","net":"経路の途中。通るのは CSR と証明書（どちらも公開してよい情報）だけで、秘密鍵は通らない。","ca":"申し込んだのが A さん本人かを確かめ、名前・公開鍵・期限を証明書にまとめる。署名に使う秘密鍵はサーバのディスクに置かず、HSM の中で署名させる。","hsm":"認証局の秘密鍵を中で作り、しまったまま署名する。鍵そのものは外に出さず、こじ開けて読もうとする攻撃にも耐える（耐タンパ性）。返すのは署名の値だけ。"},"cards":["S04-3"]},{"t":"③ 相手の公開鍵","star":["bad","包む公開鍵をすり替えられると、攻撃者が中身を取り出せる（S04-3）"],"o":"見積書を B さんだけに読ませるには、B さんの暗号化用の公開鍵が要る。攻撃者が自分の公開鍵を B さんのものと偽って送ってくるが、A さんの PC は証明書を、信頼する認証局までたどって確かめ、本物だけを使う。","legs":[[["bad","net","pca"],"偽の公開鍵","すり替えを試み中","A さんの PC","攻撃者が自分で作った証明書（名前は b@example.com と偽る。認証局の署名は無い）","「B さんの公開鍵はこれ」。これで包ませれば、攻撃者が自分の秘密鍵で共通鍵を取り出せる"],[["pcb","net","pca"],"B さんの証明書","本物の証明書を届け中","A さんの PC","署名付きメールに付いた、B さんの暗号化用の X.509 証明書（RSA の公開鍵・認証局の署名付き）","先週 B さんから届いた、署名付きの見積依頼のメールに、B さんの暗号化用の証明書も付いていた"]],"r":{"bad":"自分の鍵ペアを作り、名前を b@example.com と偽った証明書を送る。信頼される認証局の署名は付けられない。","net":"経路の途中。証明書は公開してよい情報なので、暗号化しなくてよい。","pca":"届いた証明書の署名を、信頼する認証局の公開鍵で検証し、名前・期限・用途（共通鍵を包む用か）と、失効していないかを確かめる。攻撃者の証明書は認証局までたどれないので使わない。合格した B さんの暗号化用の証明書の公開鍵だけを使う。","pcb":"先週、署名付きの見積依頼のメールに、自分の暗号化用の証明書も付けて送った。秘密鍵は、平文では TPM の外に出さない。"},"cards":["S04-3"]},{"t":"④ 署名する","star":["pca","署名は作った人の秘密鍵、検証はその公開鍵（S04-1）"],"o":"A さんが署名を指示して PIN（Personal Identification Number）を入れると、PC は見積書のハッシュ値を SHA-256 で計算し、TPM の中の A さんの秘密鍵（ECDSA）で署名する。","legs":[[["ua","pca"],"署名して","署名を指示中","A さんの PC（TPM）","SHA-256 でハッシュ値 → ECDSA で署名（TPM の中）","「この見積書に署名して」。PIN が合うと、TPM が中の秘密鍵を使う"]],"r":{"ua":"署名を指示し、PIN を入れる。秘密鍵そのものは、A さんにも見えない。","pca":"見積書のハッシュ値を計算し、TPM に署名させる。出てくるのは署名の値だけ。ハッシュ値を付けるだけだと、攻撃者は中身を書き換えてハッシュ値も計算し直せるので、秘密鍵で署名する。"},"cards":["S04-1"]},{"t":"⑤ 暗号化して送る","star":["pca","包むのは受け手（B さん）の暗号化用の公開鍵。開けるのは B さんの秘密鍵だけ（S04-3）"],"o":"A さんの PC は1通ごとに乱数で共通鍵を作り、見積書・署名・A さんの証明書を AES で暗号化し、その共通鍵を B さんの暗号化用の公開鍵（RSA-OAEP）で包んで送る。攻撃者も、攻撃者が作った偽の見積書を B さんに送ってくる。","legs":[[["pca","net","pcb"],"暗号化した見積書","B さんへ送り中","B さんの PC","S/MIME（AES の暗号文 ＋ RSA-OAEP で包んだ共通鍵）","包んだ共通鍵を開けられるのは B さんの秘密鍵だけ。だから暗号文と同じメールで送ってよい"],[["bad","net","pcb"],"偽の見積書","偽物を送りつけ中","B さんの PC","攻撃者が作った偽の見積書（B さんの公開鍵で暗号化。自分で計算したハッシュ値を付ける）","「A さんからの見積書だよ」。B さんの公開鍵は誰でも手に入るので、B さん宛ての暗号化はできる"]],"r":{"pca":"共通鍵を1通ごとに作り、中身を AES で暗号化する。公開鍵暗号は処理が遅いので、公開鍵で包むのは短い共通鍵だけにする。","net":"経路の途中。見えるのは暗号文・包んだ共通鍵と、差出人・宛先・件名などのヘッダ（S/MIME はふつう外側のヘッダを暗号化しない）。メールサーバ（図では省いた）に着いた後も、本文と添付は暗号文のまま。","bad":"B さんの公開鍵で偽の見積書を暗号化し、自分で計算したハッシュ値を付ける。A さんの秘密鍵は TPM の中にあるので、A さんの署名は作れない。","pcb":"2通が届く。どちらも B さんの公開鍵で包まれているので、暗号だけでは差出人を区別できない。"},"cards":["S04-3"]},{"t":"⑥ 開いて確かめる","star":["pcb","署名の検証で、改ざんが無いことと A さんが作ったことが分かる（S04-1）"],"o":"B さんの PC は、TPM の中の B さんの暗号化用の秘密鍵で共通鍵を取り出して復号する。A さんの証明書を、信頼する認証局までたどって確かめ、自分で計算したハッシュ値と A さんの公開鍵で署名を検証する。","legs":[[["pcb","ub"],"署名は有効：A さん","検証の結果を見せ中","B さん","RSA-OAEP で共通鍵を取り出す（TPM の中）→ AES で復号 → SHA-256 → ECDSA で検証","合格。書き換えられておらず、A さんの秘密鍵で署名されている"],[["pcb","ub"],"偽物：検証できず","警告を見せ中","B さん","A さんの署名が無い（付いているのはハッシュ値だけで、作った人を確かめられない）","攻撃者が作った偽の見積書は、A さんの署名を確かめられないので使わない"]],"r":{"pcb":"包まれた共通鍵を、TPM の中の暗号化用の秘密鍵で取り出す（秘密鍵は、平文では外に出ない）。復号した見積書のハッシュ値を自分で計算し、A さんの公開鍵で署名を検証する。A さんの証明書も、名前（a@example.jp）・期限・用途と、失効していないかを確かめる。","ub":"署名が有効と出た見積書だけを使う。検証できない見積書は使わず、A さんに別の経路で確かめる。"},"cards":["S04-1","S04-3"]},{"t":"⑦ 注文に HMAC","star":["sva","HMAC の鍵を2台で持つので、どちらが作ったかは第三者に示せない（S04-2）"],"o":"B さんが見積を承認すると、取引先の購買サーバが受注サーバへ API（Application Programming Interface）で注文を送る。2台だけが前もって共有している HMAC の鍵で HMAC を付け、受注サーバは同じ HMAC の鍵で計算し直して比べる。","legs":[[["svb","net","sva"],"注文＋HMAC","注文を送り中","受注サーバ","HTTPS の API（注文データ ＋ HMAC-SHA256 の値）","計算し直した値と一致。書き換えられておらず、HMAC の鍵を持つ購買サーバが作ったと分かる"],[["bad","net","sva"],"偽の注文","偽の注文を送りつけ中","受注サーバ","勝手に作った注文データ（金額も自分で決めた）＋ でたらめの HMAC の値","HMAC の鍵を知らないので、正しい HMAC を作れない。計算し直すと一致せず、受け付けない"]],"r":{"svb":"注文データと HMAC の鍵から HMAC を計算して付ける。HMAC の鍵はサーバの中だけに置き、データには入れない。","net":"経路の途中。TLS（Transport Layer Security）が守るのは通信の区間だけ。HMAC はデータそのものに付くので、受け取った後でも確かめられる。","sva":"届いた注文データから、購買サーバと同じ HMAC の鍵で HMAC を計算し直し、付いていた値と比べる。一致すれば、改ざんが無く、HMAC の鍵を持つ相手が作ったと分かる。HMAC の鍵は2台が持つので、どちらが作ったかを第三者には示せない（否認防止にならない）。","bad":"受注サーバの API に届くことはできるが、HMAC の鍵を知らないので、偽の注文に正しい HMAC の値を付けられない。"},"cards":["S04-2"]}]},{"group":"5","scene":"15","title":"マルウェアが入ってから、広がって暗号化されるまで（標的型メール・C&C・居座り・ランサムウェア・検知）","goal":"攻撃者が A さんの PC を入口にマルウェアを入れ、C&C（Command and Control）サーバから命令を送って社内に広げ、情報を盗んでからファイルを暗号化する","focus":"入口（①②）・端末（③）・社内（⑤⑥）・出口（④⑦）の段ごとに、どの検知の仕組みが効き、どこで見逃すか。見る仕組みは、メールサーバのサンドボックスと定義ファイル、EDR（Endpoint Detection and Response）、FW（ファイアウォール）に付いた IPS（Intrusion Prevention System）。社内どうしの通信は FW を通らず、C&C 通信も持ち出しも、内から外への HTTPS で FW を通る","example":"社員の A さんに、取引先を名乗るメールが届いた。「請求書の金額が変わったので、こちらのページで確かめてほしい」とあり、リンクが1つだけ付いている。リンク先は、攻撃者が改ざんした別の会社の正規サイト（www.example.com）で、A さんには取引先のページに見える。同じ差出人からの添付付きのメールは、少し前にメールサーバが止めていた。A さんがリンクを開くと「ロボットでないことの確認」の画面が出て、A さんは確認の欄を押し、書かれた手順どおりにキーを押した。同じ部署の B さんは、ファイルサーバの管理者も兼ねている。A さんは週に1回、ネットワークにつながない設計用の PC へ、USB メモリで図面を運ぶ。会社の PC とサーバには EDR が入り、FW には IPS の機能がある。攻撃者のねらいは、社内のファイルを盗んでから暗号化し、「払わなければ盗んだ情報を公開する」と脅して金を取ること。図は、攻撃者がメールを送ってから、ファイルサーバが暗号化されるまでを、攻撃者の側から追う","note":"www.example.com と 198.51.100.7 は、説明用に取っておかれた名前とアドレス（実在のサイトではない）。場面16 は、この場面とは別の日の、別の件（入口も、EDR が気づく時点も違う）","zones":[[6,14,156,106,"#F1EFE8","ネットにつながない区画","#444441"],[6,126,382,248,"#EEEDFE","社内 LAN","#3C3489"],[340,4,132,112,"#FAEEDA","DMZ","#633806"],[576,8,100,222,"#FAECE7","攻撃者の手元","#712B13"],[470,236,206,140,"#E1F5EE","社外のサーバ","#085041"]],"nodes":{"iso":{"x":52,"y":70,"label":"設計用の PC","type":"pc"},"usb":{"x":215,"y":60,"label":"USB メモリ","type":"box","labelPos":"above"},"pc":{"x":160,"y":180,"label":"A さんの PC","type":"pc"},"sw":{"x":270,"y":180,"label":"スイッチ","type":"sw","labelPos":"above"},"pcb":{"x":140,"y":300,"label":"B さんの PC","type":"pc"},"fs":{"x":250,"y":300,"label":"ファイルサーバ","type":"srv"},"edr":{"x":355,"y":300,"label":"EDR の管理画面","type":"box"},"fw":{"x":420,"y":180,"label":"FW（IPS 付き）","type":"fw"},"mail":{"x":420,"y":60,"label":"メールサーバ","type":"srv","labelPos":"above"},"net":{"x":525,"y":180,"label":"インターネット","type":"net"},"bad":{"x":630,"y":66,"label":"攻撃者","type":"bad"},"c2":{"x":630,"y":180,"label":"C&C サーバ","type":"srv"},"web":{"x":610,"y":300,"label":"改ざんされたサイト","type":"srv"}},"edges":[["iso","usb"],["usb","pc"],["pc","sw"],["sw","pcb"],["sw","fs"],["sw","edr"],["sw","fw"],["fw","mail"],["fw","net"],["net","bad"],["net","c2"],["net","web"]],"route":[["bad","が取引先を装ってメールを送る。メールサーバが添付を、定義ファイルとサンドボックス（隔離した仮想環境）で調べる",[["SMTP（Simple Mail Transfer Protocol）","L7"],["パターンマッチング（定義ファイルと照合）",""],["サンドボックス",""]]],["pc","が偽の確認画面（CAPTCHA：人か機械かを見分ける画面）を開き、A さんが貼り付けたコマンドでマルウェアの本体を落とす",[["HTTPS","L7"],["PowerShell",""]]],["pc","で、マルウェアがタスクと自動起動に自分を登録して居座る。EDR（端末の監視）が動きを記録する",[["永続化",""],["EDR",""]]],["pc","が C&C サーバへ自分から接続し、命令と追加のツールを受け取る",[["TLS","L5〜6 相当"],["HTTPS","L7"]]],["pc","で、マルウェアが盗んだ管理者の認証情報で B さんの PC に入り、そこで見つけたファイルサーバの管理者の認証情報で、ファイルサーバにも広がる",[["SMB（Server Message Block）","L7"]]],["pc","で、マルウェアが USB メモリに複製を置き、設計用の PC（ネットワークにつながない）に入る",[["USB 接続",""],["パターンマッチング（定義ファイルと照合）",""]]],["pc","がファイルサーバの情報を C&C サーバへ送り出し、そのあとファイルサーバを暗号化させる。EDR が振る舞いで止める",[["SMB","L7"],["HTTPS","L7"],["EDR",""]]]],"steps":[{"t":"① 標的型メール","star":["mail","添付は定義ファイルとサンドボックスで止められても、リンクだけのメールは、ファイルの検査に何も引っかからずに届く（S14-2）"],"o":"攻撃者が取引先を装って A さんにメールを送る。メールサーバは、添付を定義ファイルと照らし、定義に無いものはサンドボックスで動かして判定する。添付付きの1通目は止まり、リンクだけの2通目は A さんに届く。","legs":[[["bad","net","fw","mail"],"添付付きメール","取引先を装って送り込み中","メールサーバ（A さん宛て）","SMTP（Simple Mail Transfer Protocol。25番）。添付は請求書を装ったファイル","定義ファイルには無い新種。メールサーバがサンドボックスで動かすと、外へ通信しようとしたので、このメールを止めた"],[["bad","net","fw","mail"],"リンクだけのメール","手口を変えて送り込み中","メールサーバ（A さん宛て）","SMTP（25番）。本文に URL が1つだけ","添付が無いので、ファイルの検査にはかける物が無い。リンク先は改ざんされた正規のサイトなので、URL の評判の検査も通ることがある"],[["mail","fw","sw","pc"],"リンクだけのメール","A さんの受信箱へ届く中","A さんの PC","IMAP（Internet Message Access Protocol）で受信","「請求書の金額が変わりました。こちらで確かめてください」"]],"r":{"bad":"取引先を名乗って、A さん宛てにメールを送る。添付付きが止められても、手口を変えて送り直せる。","net":"経路の途中。","fw":"外からメールサーバへの SMTP（25番）と、社内の PC からメールサーバへの受信を許可しているので通す。添付の中身を調べるのは、メールサーバの役目。","mail":"添付を定義ファイルと照らす（パターンマッチング）。一致しない1通目は、隔離した仮想環境（サンドボックス）で動かし、振る舞いで判定して止めた。2通目は添付が無いので、ファイルの検査には何も引っかからない。仮想環境だと気づいて動きを止めるマルウェアや、パスワード付きの圧縮ファイルも、ここをすり抜ける。","sw":"MAC アドレスを見て転送するだけ。中身は見ない。","pc":"リンクだけのメールを受け取る。添付が無いので、PC のマルウェア対策ソフトにも何も引っかからない。"},"cards":["S14-2"]},{"t":"② 偽の CAPTCHA","star":["pc","利用者が自分でコマンドを貼り付けて実行するので、添付ファイルの検査を一度も経由しない（S12-1）"],"o":"A さんがリンクを開くと、改ざんされたサイトが偽の CAPTCHA（人か機械かを見分ける画面）を出す。確認の欄を押し、指示どおりにキーを押すと、PowerShell のコマンドが動き、マルウェアの本体が落ちてくる。この手口を ClickFix と呼ぶ。","legs":[[["pc","sw","fw","net","web"],"ページを開く","メールのリンク先へ行く中","改ざんされたサイト（www.example.com）","HTTPS（GET。メールの URL）","取引先のページだと思って開く"],[["web","net","fw","sw","pc"],"偽の確認画面","確認画面を受け取る中","A さんの PC","HTTPS 応答（偽の CAPTCHA。確認の欄を押すと、ページの JavaScript がコマンドをクリップボードに写す）","「ロボットでないことを確かめます。Windows キー＋R、Ctrl＋V、Enter の順に押してください」"],[["pc","sw","fw","net","web"],"本体の要求","PowerShell が取りに行く中","改ざんされたサイト","HTTPS（PowerShell のダウンロード）","Windows キー＋R で「ファイル名を指定して実行」が開き、Ctrl＋V で、欄を押したときに写されたコマンドが貼られ、Enter で動いた"],[["web","net","fw","sw","pc"],"マルウェア本体","本体を受け取る中","A さんの PC","HTTPS 応答（実行ファイル）","メールの検査は一度も受けていない。定義ファイルに無い新種なので、PC のマルウェア対策ソフトも見逃す"]],"r":{"pc":"メールのリンクを開き、偽の確認画面の指示どおりに、A さんが自分でコマンドを貼り付けて実行する。動いた PowerShell が本体を落とす。PowerShell などの実行を監視・制限していれば、ここで止められる。","sw":"MAC アドレスを見て転送するだけ。中身は見ない。","fw":"社内から外への HTTPS（443番）は許可しているので通す。中身は TLS で暗号化されていて、IPS には見えない（復号して検査しない限り）。","net":"経路の途中。","web":"正規のサイトが改ざんされ、偽の確認画面とマルウェアの本体を置かれている。見た目は普通のサイト。CAPTCHA は Completely Automated Public Turing test to tell Computers and Humans Apart の略。"},"cards":["S12-1"]},{"t":"③ 居座り","star":["edr","アラートが出なくても、タスクや自動起動への登録の記録が残り、あとでたどる手がかりになる（S12-2・S14-1）"],"o":"マルウェアは、再起動しても動くように、タスクスケジューラと自動起動のレジストリに自分を登録する（永続化）。ルートキットで、ファイルやプロセスをコマンドの結果から隠す。PC に入っている EDR のエージェントは、この登録を記録して管理画面に送る。","legs":[[["pc","sw","edr"],"登録の記録","EDR に動きを知らせる中","EDR の管理画面","EDR のエージェントが送る記録（プロセスの親子関係・コマンドライン・タスクとレジストリの登録・通信）","正規のソフトも同じ場所に登録するので、誤検知を避けて、登録だけではアラートにしていない。記録だけが残る"]],"r":{"pc":"マルウェアが、タスクスケジューラと自動起動のレジストリに自分を登録し、再起動のたびに動く。ルートキットが OS の関数を差し替えると、tasklist などのコマンドを打っても、ファイル・プロセス・通信が出てこない。この PC のコマンドの結果は信用できないので、メモリやディスクを取り出して別の環境で調べる。仕掛けた登録は、あとで感染の痕跡になる。","sw":"MAC アドレスを見て転送するだけ。","edr":"端末のプロセス・ファイル・通信を記録し、検知ルールと照らす。一致すればアラートを出し、止めることもできる。一致しなければアラートは出ないが、記録は残る。しきい値を下げると、正常な動きまでアラートになる（誤検知）。脅威ハンティングは、アラートを待たずに、侵入されている前提でこの記録を探しに行く。"},"cards":["S12-2","S14-1"]},{"t":"④ C&C 通信","star":["fw","外から内への接続は止めるが、内から外への HTTPS は許すので、C&C 通信が通る（S12-1）"],"o":"攻撃者が C&C サーバに命令を置く。A さんの PC は数分おきに自分から C&C サーバへ聞きに行き、その返事で命令と追加のツールを受け取る。","legs":[[["bad","net","c2"],"命令を置く","C&C サーバを操作中","C&C サーバ","HTTPS（攻撃者が C&C サーバを操作）","「社内の端末とアカウントを調べて、認証情報を集めろ」"],[["pc","sw","fw","net","c2"],"命令はある？","自分から聞きに行く中","C&C サーバ（198.51.100.7:443）","HTTPS（内から外へ、数分おき）","外からは入れないので、内側から定期的に聞きに行く"],[["c2","net","fw","sw","pc"],"命令＋ツール","命令を受け取る中","A さんの PC","HTTPS 応答（命令と追加のファイル）","認証情報を盗むツールが届く。キー入力や画面からも情報を集める"]],"r":{"bad":"C&C サーバに命令を置くだけで、社内の PC を動かせる。C&C サーバの IP アドレスを切り替えて、遮断のリストから逃げる。","net":"経路の途中。","c2":"聞きに来た端末に、命令と追加のファイルを返す。命令を受ける端末の集まりがボットネット。","pc":"数分おきに C&C サーバへ接続し、命令と追加のツールを受け取る。A さんの認証情報・キー入力・画面を集め、B さんの PC でも使える管理者の認証情報も手に入れる。","sw":"MAC アドレスを見て転送するだけ。","fw":"外から内への接続は止めるが、内から外への HTTPS は許可しているので通す。付いている IPS は、既知の攻撃の型（シグネチャ）と照らして止める。型に無い新しい C&C の通信は見逃す。中身が TLS で暗号化されていれば中は見えないが、宛先の IP と数分おきの間隔はログに残る。IDS（Intrusion Detection System）は、見つけても管理者に知らせるだけ。"},"cards":["S12-1","S14-1"]},{"t":"⑤ 横展開","star":["pcb","1台目で盗んだ管理者の認証情報で入られるので、ネットワークの分割と権限の最小化が効く（S12-1）"],"o":"マルウェアは、A さんの PC で盗んだ、B さんの PC でも使える管理者の認証情報で B さんの PC に入る。そこで見つけたファイルサーバの管理者の認証情報で、ファイルサーバにも入る。社内どうしの通信は FW を通らない。","legs":[[["pc","sw","pcb"],"PC 管理者の ID・パスワード","となりの PC へ広がり中","B さんの PC","SMB（Server Message Block。445番）で管理共有にコピーし、リモートで実行（B さんの PC の管理者の権限が要る）","A さんの PC で盗んだ、B さんの PC でも使える管理者の認証情報を使う。社内どうしなので FW は通らない"],[["pcb","sw","fs"],"サーバ管理者の ID・パスワード","ファイルサーバへ広がり中","ファイルサーバ","SMB（445番）でコピーし、リモートで実行（管理者の権限）","B さんの PC に残っていた、ファイルサーバの管理者の認証情報で入れた"]],"r":{"pc":"盗んだ管理者の認証情報で、B さんの PC の管理共有に自分を写し、リモートで実行する。","sw":"社内の PC どうし、PC とサーバの間をつなぐ。MAC アドレスを見て転送するだけで、中身は見ない。この通信は FW を通らない。","pcb":"正規の認証情報で入られるので、ログオンは成功に見える。ここで、ファイルサーバの管理者の認証情報を盗まれる。","fs":"管理者の権限で入られる。この権限で書き込める範囲の全部が、あとで暗号化の対象になる。"},"cards":["S12-1"]},{"t":"⑥ もう1つの道：USB メモリ","star":["iso","設計用の PC はネットワークにつながなくても、持ち込む媒体から感染するので、接続の前の検査と、接続できる USB 機器を限ることが対策になる（S12-4）"],"o":"社内 LAN とは別の道でも広がる。A さんが、設計用の PC へ図面を運ぶため、USB メモリに書き出す。マルウェアは自分の複製も一緒に置く。設計用の PC で A さんが図面と間違えて複製を開くと動き、そのあと差される USB メモリにも複製を置く。","legs":[[["pc","usb"],"図面＋複製","USB メモリに書き出し中","USB メモリ","USB 接続（ファイルの書き込み）","A さんが図面を書き出すと、マルウェアが自分の複製も一緒に置く"],[["usb","iso"],"図面＋複製","設計用の PC に差し中","設計用の PC","USB 接続（媒体の中のファイルを開く）","A さんが図面と間違えてマルウェアのファイルを開くと動く（自動実行を止めてある PC では、差しただけでは動かない）"],[["iso","usb"],"複製","次に差された USB メモリへ広がり中","USB メモリ","USB 接続（ファイルの書き込み）","このあと設計用の PC に差す USB メモリにも、複製を置く（図の USB メモリは、差される媒体の代表）"]],"r":{"pc":"差された USB メモリに、マルウェアが自分の複製を置く。PC のマルウェア対策ソフトの定義ファイルには、まだこの新種が無い。","usb":"感染の通り道になる。持ち込む媒体は、接続の前に、最新の定義ファイルにしたマルウェア対策ソフトで検査する。ただし定義ファイルに無い新種は、この検査でも見つからない。検査専用の端末を置き、接続できる USB 機器を限る。","iso":"ネットワークにつながないので、定義ファイルは媒体や手動の操作で更新する。更新が遅れていると、パターンマッチングでは新しいマルウェアを見つけられない。"},"cards":["S12-4","S14-2"]},{"t":"⑦ 持ち出しと暗号化","star":["fs","暗号化の前に盗むので、バックアップがあっても情報の公開は防げない（二重脅迫。S12-3）"],"o":"マルウェアは、暗号化の前に、ファイルサーバの情報を集めて C&C サーバへ送る。そのあとファイルサーバでランサムウェアを動かし、ファイルを暗号化する。攻撃者は「払わなければ盗んだ情報を公開する」と脅す（二重脅迫）。EDR が振る舞いを検知して止めるが、盗まれた情報は戻らない。","legs":[[["fs","sw","pc"],"集めた情報","情報を集め中","A さんの PC","SMB（445番）で読み出す（管理者の権限）","暗号化の前に、まず盗む"],[["pc","sw","fw","net","c2"],"圧縮した情報","外へ送り出し中","C&C サーバ","HTTPS（内から外への大きな送信）","内から外への HTTPS なので、持ち出しも FW を通る"],[["pc","sw","fs"],"暗号化を始めろ","ランサムウェアを動かし中","ファイルサーバ","SMB（445番）でリモート実行（管理者の権限）","ファイルを読み、暗号化した中身を書き戻す。脅迫文「戻したければ払え。払わなければ盗んだ情報を公開する」"],[["fs","sw","edr"],"大量の書き換え","EDR に知らせる中","EDR の管理画面","EDR のアラート（短い時間に多くのファイルを書き換える振る舞い）","EDR がプロセスを止めたが、一部のファイルはもう暗号化され、盗まれた情報は戻らない"]],"r":{"fs":"管理者の権限で、ファイルを読み出される。そのあとランサムウェアが、書き込める範囲のファイルを暗号化して書き戻す。同じネットワークから書き込めるバックアップも狙われる。3-2-1-1-0 ルール：データは3つ、媒体は2種類、1つは別の場所、1つは書き換えられない（immutable）かオフライン、定期的に戻せるか確かめてエラーは 0。WORM（Write Once Read Many）の保管なら、書き換えも削除もできない。","sw":"MAC アドレスを見て転送するだけ。","pc":"ファイルサーバから集めた情報を圧縮して、C&C サーバへ送る。そのあと、ファイルサーバでランサムウェアを動かす。","fw":"内から外への HTTPS は許可しているので、持ち出しも通る。持ち出しを見つけて止めるのは、DLP（Data Loss Prevention）の役目。ただし通信の途中で見る DLP も、TLS を復号しない限り中身は見えない。","net":"経路の途中。","c2":"受け取った情報を攻撃者に渡す。攻撃者は、払わなければリークサイトで公開すると脅す。","edr":"多くのファイルを次々に書き換える振る舞いを検知し、アラートを出してプロセスを止める。止めたのは暗号化が始まってから。盗まれた情報は戻らない。"},"cards":["S12-3","S14-1"]}]},{"group":"5","scene":"16","title":"調べて、止めて、戻す（ログ・時刻・コマンド・証拠保全・CSIRT）","goal":"CSIRT（Computer Security Incident Response Team）が、A さんの PC から始まったインシデントの範囲を決めて止め、きれいな状態に戻して、報告まで終える","focus":"誰が何を見て、何を決めるか。EDR（Endpoint Detection and Response）・SOC（Security Operation Center）・CSIRT（Computer Security Incident Response Team）の分担。どのログに何が残るか。消えやすい順に取る・時刻をそろえる・範囲を決めてから戻す、の3つの順番","example":"場面15 とは別の日の、別の件。火曜の朝 09:12、社員の A さんが、取引先を名乗るメールに付いていた Word の文書を開いた。すると Word（winword.exe）から PowerShell が起動し、外の見慣れない宛先へ通信を始めた。PC に入っている EDR がこれを見つけ、アラートを見た SOC の担当が CSIRT に連絡した。CSIRT は、NIST（National Institute of Standards and Technology）SP（Special Publication）800-61 Rev.2 の4段階（準備 → 検知と分析 → 封じ込め・根絶・復旧 → 事後の活動）に沿って決めておいた手順で、調べて・止めて・戻すまでを進める（Rev.2 は 2025年4月に Rev.3 へ置き換わった）","note":"192.0.2.0/24・198.51.100.7・example.com は、説明用に取っておかれたアドレスと名前（文書の例のために予約されていて、どの会社のものでもない）。PID（Process ID）の 4120 や時刻も説明用の値","zones":[[16,24,92,104,"#F1EFE8","別の場所","#444441"],[116,2,350,130,"#FAEEDA","監視と対応","#633806"],[474,30,96,100,"#E1F5EE","",""],[578,26,100,104,"#E6F1FB","社外","#0C447C"],[16,142,600,234,"#EEEDFE","社内 LAN","#3C3489"]],"nodes":{"bk":{"x":60,"y":95,"label":"バックアップ","type":"db","labelPos":"above"},"edr":{"x":170,"y":90,"label":"EDR の管理画面","type":"box","labelPos":"above"},"soc":{"x":285,"y":54,"label":"SOC の担当","type":"user","labelPos":"above"},"csirt":{"x":400,"y":90,"label":"CSIRT の担当","type":"user","labelPos":"above"},"exec":{"x":520,"y":90,"label":"経営層","type":"user","labelPos":"above"},"gov":{"x":630,"y":100,"label":"国・IPA など","type":"box","labelPos":"above"},"pc":{"x":120,"y":200,"label":"A さんの PC","type":"pc"},"evid":{"x":260,"y":185,"label":"証拠用ディスク","type":"db"},"px":{"x":280,"y":285,"label":"プロキシ","type":"srv","labelPos":"above"},"fw":{"x":110,"y":345,"label":"FW","type":"fw","labelPos":"above"},"log":{"x":420,"y":300,"label":"ログ集約サーバ","type":"db"},"auth":{"x":550,"y":230,"label":"認証サーバ","type":"srv"}},"edges":[["pc","px"],["px","fw"],["pc","edr"],["edr","soc"],["soc","csirt"],["csirt","edr"],["csirt","pc"],["pc","evid"],["evid","csirt"],["px","log"],["fw","log"],["auth","log"],["log","csirt"],["csirt","auth"],["bk","pc"],["csirt","exec"],["exec","gov"]],"route":[["soc","（SOC：Security Operation Center）が EDR（Endpoint Detection and Response）のアラートを確かめ、CSIRT に上げる",[["EDR のアラート",""],["HTTPS（不審な通信）","L7"]]],["csirt","がトリアージで、対応するか・重大度を決め、EDR で A さんの PC をネットワークから切り離す（電源は切らない）",[["トリアージ",""],["EDR の端末隔離",""]]],["csirt","が消えやすいものから先に、メモリを写し、通信とプロセスの今の状態をコマンドで見る",[["揮発性の順序",""],["netstat・tasklist",""]]],["csirt","が電源を切ってディスクを丸ごと複製し、ハッシュ値を取る。複製と EDR の記録で親のプロセスをさかのぼる",[["ディスクイメージ",""],["ハッシュ値（SHA-256）",""],["受け渡しの記録（Chain of Custody）",""]]],["csirt","がプロキシ・FW・認証サーバのログを集め、タイムゾーンをそろえて時刻順に並べる",[["syslog","L7"],["NTP（Network Time Protocol）","L7"]]],["csirt","がアカウントとマルウェアの実行を止め、見つかった痕跡（IoC：Indicator of Compromise）で全部の端末を探して範囲を決める",[["アカウントの無効化",""],["ハッシュ値での実行の禁止",""],["IoC での検索",""]]],["csirt","が A さんの PC を初期化してバックアップから戻し、経営層へ報告する。社外への報告は経営層が決める",[["リストア（3-2-1-1-0 ルール）",""],["インシデントの報告",""]]]],"steps":[{"t":"① 検知と連絡","star":["soc","アラートを見て上げるのは SOC、対応を決めるのは CSIRT（S15-2）"],"o":"A さんの PC で、Word（Office のアプリ）が PowerShell を子プロセスとして起動し、PowerShell がプロキシ経由で外へ通信した。EDR がこの振る舞いを検知し、SOC がアラートを確かめて CSIRT に上げる。","legs":[[["pc","px","fw"],"不審な通信","外へ通信し中","外の宛先（example.com、198.51.100.7 の 443番）","HTTPS（プロキシに CONNECT example.com:443）","プロキシと FW を通るので、両方のログに残る。FW を出て外へ向かう（図は FW まで）"],[["pc","edr"],"振る舞いの記録","記録を送り中","EDR の管理画面","EDR のイベント（プロセスの親子・コマンドライン・通信）","「Word が PowerShell を起動し、PowerShell が外へつないだ」"],[["edr","soc"],"アラート","アラートを出し中","SOC の担当","検知ルールに一致したアラート","SOC が中身を見て、誤検知でないかを確かめる"],[["soc","csirt"],"エスカレーション","CSIRT に上げ中","CSIRT の担当（窓口）","決めておいた連絡の手順（チケット・電話）","「A さんの PC で、外への不審な通信。誤検知ではなさそう」"]],"r":{"pc":"Word の子プロセスとして PowerShell が動き、外へ通信する。中に入っている EDR のエージェントが、プロセスの親子・コマンドライン・通信を記録して管理画面へ送る。","px":"時刻・送信元の PC の IP アドレス（192.0.2.21）・宛先の名前（example.com）・バイト数・User-Agent を記録する。利用者を認証していれば、利用者 ID も残る。User-Agent は送信側が自由に書けるので、正規のブラウザの値にされると紛れる。HTTPS は CONNECT のトンネルなので、復号しない限り、URL のパスは残らない。","fw":"この図で FW を通るのは、プロキシから外への通信。記録は、送信元 IP:ポート → 宛先 IP:ポート と、許可／拒否。送信元はプロキシなので、FW のログだけでは A さんの PC にたどり着けない。","edr":"PC から届いた記録を検知ルールと照らす。「正規のプロセスの子にシェル」という振る舞いに一致したので、アラートを出す。","soc":"アラートを見て、本当の攻撃か誤検知かを確かめ、決めた手順で CSIRT に上げる。この監視を外の事業者に任せるサービスに MDR（Managed Detection and Response）がある。名前のとおり、隔離などの初動の対応まで含むことがある。","csirt":"社内外からの連絡を、ここ1か所で受ける。SOC が確かめたアラートも、社員や社外からの知らせも、ここに集まる。"},"cards":["S15-2","S13-1"]},{"t":"② トリアージと隔離","star":["pc","電源を切るとメモリの中身が消えるので、切り離しても、メモリを取り終えるまでは電源を切らない（S15-1・S13-4）"],"o":"CSIRT が、インシデントとして対応するか・重大度を決める（トリアージ）。広がる前に、09:40 に EDR で A さんの PC をネットワークから切り離す。電源は切らない。","legs":[[["csirt","soc"],"対応する（重大度：高）","判断を伝え中","SOC の担当","トリアージの結果（対応するか・重大度）","分かったことが増えるたびに、重大度を見直す"],[["csirt","edr"],"隔離して","切り離しを指示し中","EDR の管理画面","EDR の端末隔離の操作","「A さんの PC を、ネットワークから外して」"],[["edr","pc"],"隔離","PC を切り離し中","A さんの PC","隔離の命令（EDR の管理画面との通信だけ残す）","ほかの機器と通信できなくなる。電源は入ったままなので、メモリの中身も残る"]],"r":{"csirt":"集まった情報から、インシデントか・重大度を決め、対応の順番をつける（トリアージ）。判断の結果は、知らせてくれた人や関係者に伝える。","soc":"判断の結果を受け取り、同じ宛先や同じ振る舞いのアラートを、引き続き見張る。","edr":"管理画面から、端末をネットワークから隔離する命令を出す。隔離しても管理画面との通信は残るので、記録は届き続ける。","pc":"ほかの機器と通信できなくなり、広がりが止まる。電源は入ったままなので、動いているマルウェアや通信の状態が、メモリに残る。"},"cards":["S15-2","S15-1"]},{"t":"③ 消えやすいものから","star":["csirt","あとから取ると消えているので、消えやすいもの（メモリ・通信・プロセス）を先に、ディスクは後に取る（S13-4）"],"o":"CSIRT の担当が A さんの PC の前で、消えやすいものから取る。まずメモリを丸ごと写し、次に通信とプロセスの今の状態をコマンドで見る。","legs":[[["csirt","pc"],"メモリを取る","メモリを写し中","A さんの PC","メモリの取得ツール（持ち込んだ媒体から動かす）","電源を切ると消えるものから、先に取る"],[["pc","evid"],"メモリの写し","写しを保管し中","証拠用ディスク","メモリダンプ＋ハッシュ値（SHA-256）","取った直後にハッシュ値を記録する。あとで変わっていないことを示すため"],[["csirt","pc"],"netstat・tasklist","今の状態を見る中","A さんの PC","持ち込んだ媒体の netstat -ano → tasklist /fi \"PID eq 4120\"","「どの PID が、どこを相手にしている？」「その PID は何のプログラム？」"],[["pc","csirt"],"PID・プログラム名","結果を持ち帰る中","CSIRT の担当","コマンドの出力（打った時刻と一緒に保存）","PID 4120 は powershell.exe。netstat の表に、プロキシ（192.0.2.5）の 8080番との接続が残っていれば、相手が分かる"]],"r":{"csirt":"揮発性の順序（RFC（Request for Comments）3227）で、メモリ・通信・プロセスのような消えやすいものを先に、ディスクは後に取る。PC の中のプログラムは偽物にされているかもしれないので、ツールは持ち込む。打ったコマンドと時刻も記録する。","pc":"netstat -ano は、通信の相手・状態（LISTENING・ESTABLISHED など）・PID を出す。tasklist は、PID ごとのプログラム名を出す。ルートキットがいると、コマンドの結果そのものが偽られる。","evid":"メモリの写しと、そのハッシュ値を受け取る。PC のディスクに書くと、原本（消されたファイルが残る領域など）を書き換えてしまうことがあるので、外付けの証拠用ディスクに取る。"},"cards":["S13-4","S13-3"]},{"t":"④ 複製と親子","star":["evid","調べるのは複製にし、原本と複製のハッシュ値が同じことで、変わっていないと示す（S13-4）"],"o":"メモリと今の状態を取り終えたので、CSIRT の担当が PC の電源を切ってディスクを取り出し、書き込みを防ぐ装置（ライトブロッカー）を通して丸ごと複製し、ハッシュ値を取る。調べるのは複製の方。EDR の記録で、PID 4120 を起動した親（PPID（Parent Process ID））をさかのぼる。","legs":[[["pc","evid"],"ディスクイメージ","丸ごと複製し中","証拠用ディスク","書き込み防止装置（ライトブロッカー）を通した複製＋ハッシュ値","取り出したディスクを装置につなぎ、原本には書き込まずに複製する。原本と複製のハッシュ値が同じなら、中身も同じ"],[["evid","csirt"],"複製","解析に渡し中","CSIRT の担当","受け渡しの記録（Chain of Custody）","誰が・いつ・何を受け取り、どこに置いたかを、渡すたびに書く"],[["edr","csirt"],"プロセスの親子","記録を見せ中","CSIRT の担当","EDR の記録（PID・PPID・コマンドライン）","「winword.exe → powershell.exe（PID 4120）。コマンドラインは、外からファイルを落とす命令」"]],"r":{"pc":"メモリなどを取り終えたので、電源を切ってディスクを取り出す。ディスクは原本として残し、解析には使わない。原本を直接調べると、ファイルの時刻などの記録が書き換わるおそれがある。","evid":"原本と複製のハッシュ値（SHA-256 など）を記録する。値が同じなら、複製は原本と同じ。証拠は、受け渡しの記録と一緒に保管する。","csirt":"複製で解析する。PPID で親をさかのぼり、正規のプロセス（ここでは Word）の子に PowerShell がいれば、親が悪用された印と見る。","edr":"プロセスの親子・コマンドライン・通信を、ふだんから記録している。だから、CSIRT が ③ でコマンドを打つより前の、09:12 に PowerShell が起動した時点までさかのぼれる。"},"cards":["S13-4","S13-3"]},{"t":"⑤ 時刻をそろえる","star":["log","タイムゾーンをそろえないと、同じ通信が9時間離れた別の出来事に見える（S13-2）"],"o":"プロキシ・FW・認証サーバのログを、ログ集約サーバで時刻順に並べる。先に、時計のずれとタイムゾーンをそろえる。JST は Japan Standard Time（日本標準時）、UTC は Coordinated Universal Time（協定世界時）。つなぐ手がかりは、時刻・IP アドレス・利用者 ID。","legs":[[["px","log"],"プロキシのログ","ログを送り中","ログ集約サーバ","syslog（時刻は JST）","「09:12:05 192.0.2.21 CONNECT example.com:443 送信 2MB」"],[["fw","log"],"FW のログ","ログを送り中","ログ集約サーバ","syslog（時刻は UTC）","「00:12:05 192.0.2.5:50312 → 198.51.100.7:443 許可」"],[["auth","log"],"認証ログ","ログを送り中","ログ集約サーバ","syslog（時刻は JST）","「09:20〜 A さんの ID で、192.0.2.21 からほかのサーバへのログオンの試み」。② の隔離（09:40）より前の記録"],[["log","csirt"],"時刻順の表","並べた結果を渡し中","CSIRT の担当","検索の結果（時刻・IP アドレス・利用者 ID でつないだ表）","9時間ずらすと時刻が同じ。FW の送信元はプロキシ（192.0.2.5）、宛先は example.com の 198.51.100.7 なので、プロキシの 09:12:05 と FW の 00:12:05 は、A さんの PC から始まった1つの通信の、プロキシまでの区間と、プロキシから外への区間"]],"r":{"px":"記録するのは、プロキシを通った通信だけ。どの PC（IP アドレス）が、どの名前へ、何バイト送ったか。時刻は JST で書いている。","fw":"記録するのは、FW をまたいだ通信だけ。送信元 IP:ポート → 宛先 IP:ポート と、許可／拒否。この FW は時刻を UTC で書いている。","auth":"社内のアカウント（Windows のドメインのアカウント）で、ログオンを試みた記録が残る。どのアカウントが・どこから・成功か失敗か。","log":"全部の機器の時計を NTP で合わせておき、ログのタイムゾーンをそろえてから並べる。JST は UTC より9時間進んでいる。ログを別のサーバに集めておくと、攻撃者が機器の上のログを消しても、ここに残る。","csirt":"時刻順の表から、どの端末から始まり、どこへ広げようとしたかをたどる。時刻だけでなく、IP アドレス・ポート・PID・利用者 ID でもつなぐ。"},"cards":["S13-2","S13-1"]},{"t":"⑥ 止めて、範囲を決める","star":["auth","乗っ取られたアカウントなら、その権限で届く範囲を、まず被害の範囲の目安にする（S15-1）"],"o":"⑤ で A さんの ID によるログオンの試みが見つかったので、まず、盗まれたかもしれない A さんのアカウントを止め、PowerShell が落としたマルウェアのファイルのハッシュ値を EDR に登録して実行を止める。次に、見つかった痕跡（IoC。宛先の 198.51.100.7・example.com、そのハッシュ値、A さんの ID）で、全部の端末の通信のログと EDR の記録を探し、被害の範囲を決める。","legs":[[["csirt","auth"],"A さんの ID を止める","アカウントを止め中","認証サーバ","アカウントの無効化","盗まれたかもしれない ID を、いったん使えなくする"],[["csirt","edr"],"ハッシュ値を登録","実行を止め、記録を探し中","EDR の管理画面","実行を禁止するファイルのハッシュ値（SHA-256）・過去の記録の検索","EDR が入っているどの端末でも、同じファイルは動かなくなる。過去の記録も、同じハッシュ値で探す"],[["csirt","log"],"198.51.100.7・A さんの ID","全部を探し中","ログ集約サーバ","ログの検索（宛先・利用者 ID。送信元は絞らない）","A さんの PC だけに絞らずに探す"],[["log","csirt"],"もう1台","結果を受け取り中","CSIRT の担当","検索の結果","B さんの PC にも、同じ宛先への通信があった（図には無い）。② と同じく EDR で切り離し、③④ と同じく証拠を取る"]],"r":{"csirt":"先にアカウントとマルウェアの実行を止めてから、見つかった痕跡（IoC）で全部の端末を探し、範囲を決める。範囲を決めずに戻すと、残った端末からまた入られる。ここでしているのは、アラートを受けて範囲を決める作業。アラートが無くても、侵入されている前提で EDR やログのデータを探しに行くのは、脅威ハンティングという。","log":"1台の感染が分かっても、送信元をその端末に限らずに、同じ痕跡（IoC）で全部のログを探す。ファイルのハッシュ値は、ここに集まるログには無いので、EDR の記録で探す。","auth":"アカウントを無効にすると、その ID ではログオンできなくなる。乗っ取られたアカウントなら、その権限で届く範囲を、まず被害の範囲の目安にする。ほかの資格情報を盗まれたり、権限を上げられたりすると、範囲はもっと広がる。","edr":"登録したハッシュ値と同じファイルは、EDR が入っているどの端末でも実行させない。過去の記録も、同じハッシュ値で探せる。ファイルを少しでも変えられると、ハッシュ値は一致しなくなる。"},"cards":["S15-1","S13-1"]},{"t":"⑦ 戻して報告","star":["bk","ランサムウェアはバックアップもねらうので、少なくとも1つは、ネットワークから離すか書き換えられない形で持つ（S15-1）"],"o":"マルウェアと入口（Word の文書と、それを届けたメール）を取り除いたら、A さんの PC を初期化して OS とソフトを入れ直し、バックアップから戻す。監視しながら使い始める。CSIRT は経営層へ報告し、経営層が国・IPA（Information-technology Promotion Agency：情報処理推進機構）・JPCERT/CC（Japan Computer Emergency Response Team Coordination Center）などへの報告を決める。","legs":[[["bk","pc"],"感染前のデータ","戻し中","A さんの PC（初期化ずみ）","バックアップからのリストア","OS とソフトを入れ直したあとに戻す。感染より前の世代を選ぶ"],[["csirt","exec"],"報告","報告し中","経営層","インシデントの報告（経緯・範囲・対応・これから）","分かったことが増えるたびに、報告し直す"],[["exec","gov"],"社外への報告","社外へ報告し中","国・IPA など","監督省庁・IPA・JPCERT/CC への報告","個人データの漏えい等が、法令で決められた場合（おそれを含む）に当たれば、個人情報保護委員会へも報告する"]],"r":{"bk":"感染に気づくまでに時間がかかると、最新の世代も汚れていることがある。だから世代を分けて持ち、感染より前を選ぶ。ランサムウェアはバックアップもねらうので、少なくとも1つは、ふだんネットワークから切り離すか、書き換えられない形にする。3-2-1-1-0 ルール：データは3つ、媒体は2種類、1つは別の場所、1つは書き換えられない（immutable）かオフライン、定期的に戻せるか確かめてエラーは 0。","pc":"初期化して、OS とソフトを入れ直してから戻す（クリーンビルド）。入口の脆弱性や設定も直してから、監視しながら使い始める。","csirt":"経営層に、経緯・範囲・対応を報告する。そのあと、SP 800-61 の4段階の最後にあたる「事後の活動」として、再発防止を決める。","exec":"会社として、社外への報告と公表を決める。顧客・取引先や、監督省庁・IPA・JPCERT/CC への報告を、1次・2次と段階に分けて行う。個人情報保護委員会への報告が要るのは、要配慮個人情報・財産的被害・不正の目的・1,000人超のどれか（おそれを含む）に当たるとき。速報はおおむね3〜5日以内。確報は30日以内（不正アクセスなど、不正の目的によるおそれがあるときは60日以内）。","gov":"IPA は届出を、JPCERT/CC は対応の依頼を受ける。集まった痕跡（IoC）が共有されると、ほかの組織も同じ攻撃を見つけられる。共有するときは TLP（Traffic Light Protocol）の印で、共有してよい範囲を示す。"},"cards":["S15-1","S15-2"]}]}];

C暗号リストで確かめる。強さはいちばん弱い所で決まる"],"S07-3":["IPアドレスの範囲と特殊な通信","推奨","CIDRで範囲を読む。ブロードキャストはルータを越えない"],"S13-1":["ログの種類と、そこから分かること","推奨","プロキシ・FW・認証・Webのログは、それぞれ見えるもの（誰が・どこへ・何を）が違う"],"S01-5":["DNSを使った攻撃と調査","推奨","攻撃者はDNSを情報の出し入れや接続先の切替えに使う。守る側は名前を手がかりに止める・探す"],"S05-1":["FWのルールの読み方","推奨","送信元・宛先・ポート・動作を上から順に見て、最初に一致した行で決まる"],"S07-1":["ARPとARPスプーフィング","推奨","ARPはIPアドレスからMACアドレスを引く。偽の応答で通信を横取りできる"],"S09-5":["そのほかのインジェクション","推奨","入力がOSコマンドやヘッダなど、別の命令の一部として解釈される"],"S10-5":["フィッシング（中継型を含む）","推奨","偽のサイトで受け取った認証情報を、攻撃者が本物のサイトで使う"],"S11-1":["SAML","推奨","SPに来た利用者をIdPへ回して認証し、IdPが署名した結果をブラウザ経由でSPに渡す"],"S13-2":["時刻の突き合わせ","推奨","別々のログを時刻でつなぐ。タイムゾーンや時計のずれをそろえてから並べる"],"S03-2":["証明書の失効とCT","推奨","失効はCRLかOCSPで確かめる。CTは発行された証明書を公開の記録に載せる"],"S03-3":["クライアント証明書（TLSクライアント認証）","推奨","サーバが利用者側にも証明書を求め、その秘密鍵を持つ端末だけを通す"],"S05-3":["セグメントの分け方と経路","推奨","役割ごとにネットワークを分け、間の通信を最小にする"],"S08-3":["Cookieの属性","推奨","HttpOnly・Secure・SameSiteで、Cookieを読ませない・送る場面を絞る"],"S09-6":["SSRF","推奨","サーバに、利用者が指定したURLを取りに行かせて、外から届かない内部にアクセスする"],"S10-2":["パスワードの保存","推奨","ハッシュ値にして保存し、ソルトとストレッチングで割り出しにくくする"],"S15-2":["対応の体制（CSIRT）","推奨","窓口を一本にし、インシデントかどうか・どのくらい重いかを判断して順番を決める"],"S03-4":["HSTS","推奨","一度HTTPSで来たブラウザに『次から必ずHTTPSで』と覚えさせる"],"S03-5":["TLSの設定と復号検査","推奨","使う版・暗号の選び方と、途中でTLSを開いて検査する装置の仕組み"],"S05-2":["プロキシとURLフィルタリング","推奨","外への通信をプロキシ経由にして、利用者の認証・URLの許可と拒否・記録をそこでする"],"S05-4":["NATとUPnP","推奨","NATの後ろでは送信元のIPが変わる。UPnPは機器が自分でポートを開ける"],"S06-3":["リモートアクセス（VPN・踏み台）","推奨","外からの入口をVPNや踏み台に絞り、接続元と端末を限定する"],"S09-7":["パストラバーサルとアップロード","推奨","ファイルの場所や中身を利用者に決めさせると、見せてはいけないファイルに届く"],"S10-3":["アカウントの列挙とパスワード再設定","推奨","登録済みかどうかで画面が変わると、攻撃者にIDの有無を教えてしまう"],"S11-3":["ID連携とIDaaSの運用","推奨","1つのIDで多くのサービスに入れる分、そのIDを守る・止める仕組みが要る"],"S11-4":["APIの認証（APIキー・JWT）","推奨","APIは鍵や署名つきトークンで呼び出し元を確かめる"],"S13-3":["端末の状態を見るコマンド","推奨","いまの通信・動いているプロセス・親子関係から、何がどこから動いたかをたどる"],"S02-4":["DMARC","本文で足りる","SPF・DKIMの結果とヘッダFromのドメインが合うかで判定し、失敗したときの扱いを送信側がDNSで宣言する"],"S04-2":["MAC・HMAC","本文で足りる","共有した秘密鍵とデータから値を作り、受け手が同じ計算をして一致を確かめる"],"S11-5":["Kerberos","本文で足りる","認証サーバが発行するチ function buildScene(){svg.innerHTML='';N=sc.nodes;E=sc.edges;sc.zones.forEach(([x,y,w,h,fill,label,lc])=>{el('rect',{x,y,width:w,height:h,rx:22,fill});if(label)txt(x+14,y+20,label,lc)});const eg=el('g',{});E.forEach(([a,b])=>{const A=N[a],B=N[b];const d=Math.hypot(B.x-A.x,B.y-A.y),ux=(B.x-A.x)/d,uy=(B.y-A.y)/d,r1=RAD[A.type],r2=RAD[B.type];el('line',{x1:A.x+ux*r1,y1:A.y+uy*r1,x2:B.x-ux*r2,y2:B.y-uy*r2,class:'edge',id:'e-'+a+'-'+b},eg)});ring=el('rect',{fill:'none',stroke:'#EF9F27','stroke-width':1.8,'stroke-dasharray':'5 4',rx:14,style:'display:none'});Object.entries(N).forEach(([k,n])=>drawNode(k,n));pk=el('g',{style:'display:none'});el('rect',{x:-9,y:-9,width:18,height:18,rx:5,fill:'#FFE38A',stroke:'#BA7517','stroke-width':1},pk);el('circle',{cx:-3,cy:-1,r:1.5,fill:INK},pk);el('circle',{cx:3,cy:-1,r:1.5,fill:INK},pk);el('path',{d:'M-2 3 Q0 5 2 3',fill:'none',stroke:INK,'stroke-width':1,'stroke-linecap':'round'},pk);cap=el('g',{style:'display:none'});capR=el('rect',{height:22,rx:11,fill:'#FAEEDA',stroke:'#BA7517','stroke-width':0.6},cap);capT=el('text',{'font-size':12,fill:'#633806','text-anchor':'middle','dominant-baseline':'central'},cap);
$('h-sub').textContent='まとまり'+sc.group+' '+GT[sc.group]+'｜場面 '+sc.scene;$('h-title').textContent=sc.title;$('h-goal').textContent=sc.goal;$('h-focus').textContent=sc.focus;$('h-ex').textContent=sc.example;$('h-note').textContent=sc.note||'';const anyLayer=sc.route.some(r=>r[2].some(p=>p[1]));$('h-layer').style.display=anyLayer?'':'none';
$('route').innerHTML=sc.route.map(([w,rest,prs],i)=>{const n=N[w],c=WHO[n.type];return '<div class="rr" id="rt-'+i+'"><span>'+esc(sc.steps[i].t.slice(0,1))+'</span><span class="who" style="background:'+c[0]+';color:'+c[1]+'">'+esc(n.label)+'</span><span>'+esc(rest)+'</span><span class="pr">'+prs.map(([p,l])=>'<span class="pn">'+esc(p)+'</span>'+(l?'<span class="ly">'+esc(l)+'</span>':'')).join('<span style="width:6px"></span>')+'</span></div>'}).join('');
$('steps').innerHTML='';sc.steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.t;b.onclick=()=>setStep(i);$('steps').appendChild(b)});view='all';setMode(1);setStep(0)}
function setMode(m){mode=m;[...$('modes').children].forEach(b=>b.classList.toggle('on',+b.dataset.m===m));$('viewrow').style.display=m===2?'flex':'none';$('end').style.display='none';views()}
function views(){const box=$('views');box.innerHTML='';const st=sc.steps[si].star[0];[['all','全体']].concat([...involved()].map(k=>[k,(k===st?'★ ':'')+N[k].label])).forEach(([k,n])=>{const b=document.createElement('button');if(k===view)b.className='on';b.textContent=n;b.onclick=()=>setView(k);box.appendChild(b)})}
function states(){const inv=involved();Object.keys(N).forEach(k=>{const on=inv.has(k);$('n-'+k).classList.toggle('dim',!on&&k!==view);$('fo-'+k).style.display=on?'':'none';$('fc-'+k).style.display=on?'none':''})}
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function avatar(){const a=$('av');a.innerHTML='';const ty=N[view].type;mk('circle',{cx:20,cy:20,r:18,fill:AVC[ty],stroke:'#B4B2A9','stroke-width':1},a);[[14,18],[26,18]].forEach(([x,y])=>mk('circle',{cx:x,cy:y,r:2.4,fill:INK},a));[[9,24],[31,24]].forEach(([x,y])=>mk('ellipse',{cx:x,cy:y,rx:3.4,ry:2,fill:BLUSH,opacity:.8},a));mk('path',{d:'M17 25 Q20 28 23 25',fill:'none',stroke:INK,'stroke-width':1.4,'stroke-linecap':'round'},a)}
function render(){const s=sc.steps[si],box=$('box'),h=$('bx-h'),b=$('bx-b');if(view==='all'){const l=s.legs[cur];box.style.background='var(--warn-bg)';$('mic').style.display='';$('mic').style.color='var(--warn)';$('av').style.display='none';h.style.color='var(--warn)';h.textContent='実況｜'+s.t+'（'+(cur+1)+'／'+s.legs.length+'）';b.innerHTML='<div style="font-size:14px">'+esc(s.o)+'</div><dl class="jk"><dt>いま</dt><dd>'+esc(l[2])+'</dd><dt>目指す先</dt><dd>'+esc(l[3])+'</dd><dt>使うコード</dt><dd style="font-family:var(--mono);font-size:13px">'+esc(l[4])+'</dd><dt>ひとこと</dt><dd>'+esc(l[5])+'</dd></dl>'}else{box.style.background='var(--soft)';$('mic').style.display='none';$('av').style.display='';avatar();h.style.color='var(--sub)';h.textContent=N[view].label+' の立場から｜'+s.t;const st=s.star[0]===view?'<div style="margin-top:6px;font-size:13px;color:var(--accent)">★ この手順で聞かれやすい立場：'+esc(s.star[1])+'</div>':'';b.innerHTML='<div style="font-size:15px;line-height:1.7">'+esc(s.r[view])+'</div>'+st}}
function setStep(i){si=(i+sc.steps.length)%sc.steps.length;cur=0;$('end').style.display='none';if(view!=='all'&&!involved().has(view))view='all';[...$('steps').children].forEach((b,j)=>b.classList.toggle('on',j===si));sc.steps.forEach((_,j)=>$('rt-'+j).classList.toggle('on',j===si));const hot=new Set();sc.steps[si].legs.forEach(l=>{for(let j=0;j<l[0].length-1;j++){hot.add(l[0][j]+'-'+l[0][j+1]);hot.add(l[0][j+1]+'-'+l[0][j])}});E.forEach(([a,b])=>$('e-'+a+'-'+b).classList.toggle('hot',hot.has(a+'-'+b)));ringAt();states();views();render();cards();play()}
function ringAt(){if(view==='all'){ring.style.display='none';return}const n=N[view],[hw,hh]=HALF[n.type];ring.setAttribute('x',n.x-hw-8);ring.setAttribute('y',n.y-hh-8);ring.setAttribute('width',2*hw+16);ring.setAttribute('height',2*hh+16);ring.style.display=''}
function setView(k){view=k;ringAt();states();views();render()}
function cards(){const box=$('cards');box.innerHTML='';sc.steps[si].cards.forEach(id=>{const c=CARDS[id]||[id,'',''];const [nm,pr,core]=c;const bg=pr==='必須'?'var(--danger-bg)':pr==='推奨'?'var(--warn-bg)':'var(--soft)';const fg=pr==='必須'?'var(--danger)':pr==='推奨'?'var(--warn)':'var(--sub)';const d=document.createElement('div');d.className='cd';d.innerHTML='<div style="font-size:12px;color:var(--sub);margin-bottom:4px"><span class="badge" style="background:'+bg+';color:'+fg+'">'+esc(pr)+'</span>'+esc(id)+'</div><div style="font-size:14px;font-weight:500;margin-bottom:4px">'+esc(nm)+'</div><div style="font-size:13px;color:var(--sub)">'+esc(core)+'</div>';box.appendChild(d)})}
function wlen(t){let w=0;for(const ch of t)w+=ch.charCodeAt(0)<128?7:12;return w+18}
function place(x,y,lb){pk.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');const w=wlen(lb);const lx=Math.min(Math.max(x,w/2+4),676-w/2),ly=y<70?y+28:y-28;capR.setAttribute('x',lx-w/2);capR.setAttribute('y',ly-11);capR.setAttribute('width',w);capT.setAttribute('x',lx);capT.setAttribute('y',ly);capT.textContent=lb}
function play(){const my=++tok;const legs=sc.steps[si].legs;pk.style.display='';cap.style.display='';if(matchMedia('(prefers-reduced-motion: reduce)').matches){cur=legs.length-1;const l=legs[cur],p=N[l[0][l[0].length-1]];place(p.x,p.y,l[1]);render();return}let li=0;function leg(){if(my!==tok)return;if(li>=legs.length){if(mode===1){if(si<sc.steps.length-1)setTimeout(()=>{if(my===tok)setStep(si+1)},1800);else $('end').style.display='block'}return}const [path,lb]=legs[li];cur=li;render();const P=path.map(k=>[N[k].x,N[k].y]);const seg=[];let L=0;for(let j=0;j<P.length-1;j++){const d=Math.hypot(P[j+1][0]-P[j][0],P[j+1][1]-P[j][1]);seg.push(d);L+=d}const sp=+$('spd').value;const dur=Math.max(1400,L/sp*1000);place(P[0][0],P[0][1],lb);setTimeout(()=>{if(my!==tok)return;if(P.length<2){li++;setTimeout(leg,1600);return}const t1=performance.now();function f(now){if(my!==tok)return;let p=Math.min(1,(now-t1)/dur)*L,j=0;while(j<seg.length-1&&p>seg[j]){p-=seg[j];j++}const q=seg[j]?p/seg[j]:1;place(P[j][0]+(P[j+1][0]-P[j][0])*q,P[j][1]+(P[j+1][1]-P[j][1])*q,lb);if(now-t1<dur)requestAnimationFrame(f);else{li++;setTimeout(leg,1100)}}requestAnimationFrame(f)},700)}leg()}
function selector(){const gs=[...new Set(SCENES.map(s=>s.group))].sort();$('groups').innerHTML='';gs.forEach(g=>{const b=document.createElement('button');b.textContent='まとまり'+g+' '+GT[g];if(g===sc.group)b.className='on';b.onclick=()=>openScene(SCENES.find(s=>s.group===g).scene);$('groups').appendChild(b)});$('scenes').innerHTML='';SCENES.filter(s=>s.group===sc.group).forEach(s=>{const b=document.createElement('button');b.textContent='場面'+s.scene+' '+s.title.split('（')[0];if(s===sc)b.className='on';b.onclick=()=>openScene(s.scene);$('scenes').appendChild(b)})}
function openScene(id){sc=SCENES.find(s=>s.scene===String(id))||SCENES[0];if(location.hash!=='#'+sc.scene)history.replaceState(null,'','#'+sc.scene);selector();buildScene();window.scrollTo({top:0})}
[[1,'1周目 流れを見る'],[2,'2周目 立場で見る']].forEach(([m,t])=>{const b=document.createElement('button');b.dataset.m=m;b.textContent=t;b.onclick=()=>{setMode(m);if(m===1){setView('all');setStep(si)}};$('modes').appendChild(b)});
$('prev').onclick=()=>setStep(si-1);$('next').onclick=()=>setStep(si+1);$('again').onclick=()=>play();$('go2').onclick=()=>{setMode(2);setStep(0)};
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&(!sc||id!==sc.scene))openScene(id)});
openScene(location.hash.slice(1)||SCENES[0].scene);
</script>
